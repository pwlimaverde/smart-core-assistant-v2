name: Build Windows Installer (Velopack)

on:
  push:
    tags:
      - 'win-v*'

env:
  FLUTTER_VERSION: '3.24.0'
  VELOPACK_VERSION: '0.0.520'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smartcore-releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter Dependencies
        run: |
          cd clients/apps/smart-core-tenant
          flutter pub get

      - name: Build Flutter Windows App
        run: |
          cd clients/apps/smart-core-tenant
          flutter build windows --release

      - name: Setup NSIS
        uses: joncloud/nsis-action@v3
        with:
          script-file: "infra/windows/smartcore-installer.nsi"
          nsis-version: '3.08'

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g Velopack.Cli --version ${{ env.VELOPACK_VERSION }}
          vpk --version

      - name: Extract Version and Channel from Tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^win-v', ''

          if ($version -match 'beta') {
            $channel = 'beta'
          } else {
            $channel = 'stable'
          }

          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Pack with Velopack
        run: |
          vpk pack `
            --packId SmartCoreTenant `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir "clients/apps/smart-core-tenant/build/windows/x64/Release" `
            --mainExe smart_core_tenant.exe `
            --channel ${{ steps.version.outputs.channel }} `
            --icon "infra/branding/assets/app_icon.ico" `
            --splashImage "infra/branding/assets/installer-logo.bmp"
        env:
          VELOPACK_ASSET_DIR: "infra/branding/assets"

      - name: Upload Velopack Artifacts
        run: |
          $token = "${{ secrets.RELEASES_UPLOAD_TOKEN }}"
          $version = "${{ steps.version.outputs.version }}"
          $channel = "${{ steps.version.outputs.channel }}"
          $releaseUrl = "https://releases.smartcoreassistant.com.br"

          # Find all .nupkg and Setup.exe files
          $files = @(Get-ChildItem -Path "." -Recurse -Include @("*.nupkg", "Setup.exe", "releases.*.json") -ErrorAction SilentlyContinue)

          if ($files.Count -eq 0) {
            Write-Host "❌ No artifacts found (.nupkg, Setup.exe, or feed JSON)!"
            exit 1
          }

          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name)..."
            $uploadResponse = curl.exe -X POST `
              -H "Authorization: Bearer $token" `
              -F "version=$version" `
              -F "channel=$channel" `
              -F "file=@$($file.FullName)" `
              "$releaseUrl/upload"

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ $($file.Name) uploaded successfully"
            } else {
              Write-Host "❌ Failed to upload $($file.Name)"
              exit 1
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Setup.exe
            releases.${{ steps.version.outputs.channel }}.json
            *.nupkg
          draft: false
          prerelease: ${{ steps.version.outputs.channel == 'beta' }}
          body: |
            # Smart Core Tenant v${{ steps.version.outputs.version }}

            **Channel:** `${{ steps.version.outputs.channel }}`

            ### Features
            - ✅ Velopack auto-update infrastructure
            - ✅ Flutter Windows build
            - ✅ Professional installer with branding
            - ✅ Automatic updates from releases.smartcoreassistant.com.br

            ### Installation
            1. Download `Setup.exe`
            2. Run installer (no admin required)
            3. App checks for updates automatically

            ### Release Notes
            See [Releases](https://github.com/${{ github.repository }}/releases) for full changelog.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Success
        if: success()
        run: |
          Write-Host "✅ Build completed successfully"
          Write-Host "   Version: ${{ steps.version.outputs.version }}"
          Write-Host "   Channel: ${{ steps.version.outputs.channel }}"
          Write-Host "   Setup: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Setup.exe"
          Write-Host "   Feed: ${{ steps.version.outputs.channel }}.smartcoreassistant.com.br/api/releases"

      - name: Notify Failure
        if: failure()
        run: |
          Write-Host "❌ Build failed"
          Write-Host "   Version: ${{ steps.version.outputs.version }}"
          Write-Host "   Channel: ${{ steps.version.outputs.channel }}"
          exit 1
