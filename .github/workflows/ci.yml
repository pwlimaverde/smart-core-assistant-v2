name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala toolchain Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (unit + lib)
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --lib --bins 2>&1

  flutter:
    name: Flutter — análise e testes
    runs-on: ubuntu-latest
    # Só executa quando o diretório clients existir
    if: hashFiles('clients/pubspec.yaml') != '' || hashFiles('clients/flutter_windows/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: clients/flutter_windows
        run: flutter pub get

      - name: flutter analyze
        working-directory: clients/flutter_windows
        run: flutter analyze

      - name: flutter test
        working-directory: clients/flutter_windows
        run: flutter test
