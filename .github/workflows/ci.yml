name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — lint e testes
    runs-on: ubuntu-latest

    # Infra de teste: Postgres (com pgvector) e Redis sobem como service containers
    # mapeados nas MESMAS portas que os testes esperam (5434 e 6380). Assim o
    # test_support detecta a porta aberta e NÃO tenta abrir o túnel SSH.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartcore_v2
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Instala toolchain Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # O build.rs do crate "contracts" gera gRPC/FlatBuffers e exige protoc + flatc.
      # No servidor isso vem do server-setup.sh; no ubuntu-latest precisamos instalar
      # (mesmas fontes/versão do server-setup) ou o clippy/test falham ao compilar.
      - name: Instala protoc e flatc (geração de contratos)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler postgresql-client
          wget -q -O /tmp/flatc.zip https://github.com/google/flatbuffers/releases/download/v25.12.19-2026-02-06-03fffb2/Linux.flatc.binary.g%2B%2B-13.zip
          unzip -q -o /tmp/flatc.zip -d /tmp/flatc_extracted
          sudo mv /tmp/flatc_extracted/flatc /usr/local/bin/flatc
          sudo chmod +x /usr/local/bin/flatc
          protoc --version && flatc --version

      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Cria o role restrito smartcore_app (NOBYPASSRLS) e configura privilégios
      # padrão para as tabelas que as migrations criam em runtime (rodadas pelo
      # role admin = postgres). Sem isto, a conexão DATABASE_URL (app) não enxerga
      # as tabelas e o RLS não pode ser validado.
      - name: Bootstrap do banco de teste (role app + RLS)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5434 -U postgres -d smartcore_v2 -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'smartcore_app') THEN
              CREATE ROLE smartcore_app LOGIN PASSWORD 'smartcore_app' NOBYPASSRLS;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO smartcore_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO smartcore_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO smartcore_app;
          SQL

      - name: cargo test (unit + lib)
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://smartcore_app:smartcore_app@localhost:5434/smartcore_v2
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2
          REDIS_URL: redis://localhost:6380
          # No CI há apenas um Redis (porta 6380). REDIS_BUS_URL aponta para ele também
          # pois os testes de bus (webhook_ingress, data_whatsapp) usam fake_bus próprio.
          REDIS_BUS_URL: redis://localhost:6380
          # Chave AES-256 (base64 de 32 bytes) exigida pelo CipherManager nos testes
          # das rotas admin de config (CoreSettings/TenantConfig cifrados). Valor de
          # TESTE fixo — não é segredo de produção (essa vem do .env do servidor).
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          # Testes de banco compartilham o mesmo Postgres/Redis e cada `setup_teste()`
          # abre um pool próprio. Sem serializar, os testes paralelos estouram o
          # `max_connections` do Postgres (container = 100) e derrubam conexões
          # (MigrateError/UnexpectedEof). É a convenção do projeto p/ testes de banco
          # (ver testing-strategy.md). `--test-threads=1` serializa também entre os
          # binários (RUST_TEST_THREADS só serializa dentro de cada binário).
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --lib --bins -- --test-threads=1 2>&1

      # Valida que o cache .sqlx/ versionado está em sincronia com as queries do código.
      # Sem isto, uma query nova/alterada sem `cargo sqlx prepare` quebraria o build de
      # release no deploy (que usa SQLX_OFFLINE). O --check falha se houver drift.
      - name: cargo sqlx prepare --check
        working-directory: server
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked || true
          cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "true"
          # prepare --check conecta no banco para revalidar as queries; o schema já
          # foi criado pelas migrations no step de testes (mesmo container persiste).
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2

  # Detecta se o app Flutter já existe.
  # hashFiles() NÃO funciona em if de nível de job (avaliado antes do checkout),
  # por isso a detecção roda num job próprio com checkout e expõe um output.
  detect:
    name: Detecta stacks presentes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.check.outputs.flutter }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f clients/pubspec.yaml ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  flutter:
    name: Flutter — análise e testes
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # Pub workspace (Dart >= 3.6): resolve todos os membros a partir da raiz clients/.
      - name: dart pub get (workspace)
        working-directory: clients
        run: dart pub get

      - name: melos analyze
        working-directory: clients
        run: |
          dart pub global activate melos
          melos run analyze

      - name: melos test
        working-directory: clients
        run: melos run test

      # Smoke de build web/WASM: pega quebras de compilação cedo (ex.: flutter_secure_storage).
      - name: Smoke build web (--wasm)
        working-directory: clients/apps/smart-core-admin
        run: flutter build web --wasm --base-href /v2/admin/ -t lib/main_dev.dart --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br
