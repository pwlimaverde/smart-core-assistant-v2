name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — lint e testes
    runs-on: ubuntu-latest

    # Infra de teste: Postgres (com pgvector) e Redis sobem como service containers
    # mapeados nas MESMAS portas que os testes esperam (5434 e 6380). Assim o
    # test_support detecta a porta aberta e NÃO tenta abrir o túnel SSH.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartcore_v2
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Instala toolchain Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # O build.rs do crate "contracts" gera gRPC/FlatBuffers e exige protoc + flatc.
      # No servidor isso vem do server-setup.sh; no ubuntu-latest precisamos instalar
      # (mesmas fontes/versão do server-setup) ou o clippy/test falham ao compilar.
      - name: Instala protoc e flatc (geração de contratos)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler postgresql-client
          wget -q -O /tmp/flatc.zip https://github.com/google/flatbuffers/releases/download/v25.12.19-2026-02-06-03fffb2/Linux.flatc.binary.g%2B%2B-13.zip
          unzip -q -o /tmp/flatc.zip -d /tmp/flatc_extracted
          sudo mv /tmp/flatc_extracted/flatc /usr/local/bin/flatc
          sudo chmod +x /usr/local/bin/flatc
          protoc --version && flatc --version

      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Cria o role restrito smartcore_app_rt (NOBYPASSRLS) e configura privilégios
      # padrão para as tabelas que as migrations criam em runtime (rodadas pelo
      # role admin = postgres). Sem isto, a conexão DATABASE_URL (app) não enxerga
      # as tabelas e o RLS não pode ser validado. Nome unificado com dev/prod
      # (N4.1 — ver infra/provision-db-role.sh): smartcore_app_rt é sempre a role
      # de runtime restrita; a role admin varia por ambiente (aqui, postgres).
      - name: Bootstrap do banco de teste (role app + RLS)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5434 -U postgres -d smartcore_v2 -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'smartcore_app_rt') THEN
              CREATE ROLE smartcore_app_rt LOGIN PASSWORD 'smartcore_app_rt' NOBYPASSRLS;
            END IF;
            -- A migration 0016 concede DML à role legada `smartcore_app` (sem guarda,
            -- nome anterior à renomeação da N4.1 para `smartcore_app_rt`). Em dev/prod
            -- essa role existe; no container efêmero do CI precisamos criá-la para a
            -- 0016 não falhar com "role smartcore_app does not exist". A role de runtime
            -- real dos testes continua sendo smartcore_app_rt (grants pela 0018).
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'smartcore_app') THEN
              CREATE ROLE smartcore_app LOGIN PASSWORD 'smartcore_app' NOBYPASSRLS;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO smartcore_app_rt;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO smartcore_app_rt;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO smartcore_app_rt;
          SQL

      # Cria o schema do zero via migrations sqlx. Antes isso era efeito colateral dos
      # testes de banco do data_postgres; com a refatoração Ports & Adapters esses
      # testes viraram unitários (mock) ou de integração (tests/), então as migrations
      # precisam rodar AQUI explicitamente — o passo `sqlx prepare --check` abaixo
      # introspecta as queries contra este schema (e o mesmo container persiste).
      - name: Roda migrations (cria schema)
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked || true
          cargo sqlx migrate run --source crates/infrastructure_postgres/migrations

      - name: cargo test (unit + lib)
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://smartcore_app_rt:smartcore_app_rt@localhost:5434/smartcore_v2
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2
          REDIS_URL: redis://localhost:6380
          # No CI há apenas um Redis (porta 6380). REDIS_BUS_URL aponta para ele também
          # pois os testes de bus (webhook_ingress, data_whatsapp) usam fake_bus próprio.
          REDIS_BUS_URL: redis://localhost:6380
          # Chave AES-256 (base64 de 32 bytes) exigida pelo CipherManager nos testes
          # das rotas admin de config (CoreSettings/TenantConfig cifrados). Valor de
          # TESTE fixo — não é segredo de produção (essa vem do .env do servidor).
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          # Testes de banco compartilham o mesmo Postgres/Redis e cada `setup_teste()`
          # abre um pool próprio. Sem serializar, os testes paralelos estouram o
          # `max_connections` do Postgres (container = 100) e derrubam conexões
          # (MigrateError/UnexpectedEof). É a convenção do projeto p/ testes de banco
          # (ver testing-strategy.md). `--test-threads=1` serializa também entre os
          # binários (RUST_TEST_THREADS só serializa dentro de cada binário).
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --lib --bins -- --test-threads=1 2>&1

      - name: Instala cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked || true

      # Cobertura COMBINADA (unit + integração): roda a suíte inteira (sem o filtro
      # --lib --bins) contra os MESMOS service containers efêmeros já provisionados
      # acima — os testes de integração detectam a porta aberta (5434/6380) e não
      # tentam abrir túnel SSH (ver comentário no topo do job). É a primeira vez que a
      # suíte de integração roda no CI (antes só localmente, via test-local.ps1, contra
      # o banco remoto da Hostinger) — por isso o passo é INFORMATIVO
      # (continue-on-error): não bloqueia o pipeline se aparecer alguma instabilidade
      # nesta rodada inicial. Testes opt-in de R2 (infrastructure_storage/tests/objetos)
      # pulam sozinhos sem as env vars S3_* (sem secret novo necessário aqui). O
      # ratchet (falhar se a cobertura cair) entra depois que a etapa provar estável.
      - name: cargo llvm-cov (cobertura combinada, informativo)
        working-directory: server
        continue-on-error: true
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://smartcore_app_rt:smartcore_app_rt@localhost:5434/smartcore_v2
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2
          REDIS_URL: redis://localhost:6380
          REDIS_BUS_URL: redis://localhost:6380
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          RUST_TEST_THREADS: "1"
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/rust-lcov.info -- --test-threads=1
          cargo llvm-cov report --summary-only

      - name: Publica lcov Rust como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: server/coverage/rust-lcov.info
          if-no-files-found: ignore

      # Valida que o cache .sqlx/ versionado está em sincronia com as queries do código.
      # Sem isto, uma query nova/alterada sem `cargo sqlx prepare` quebraria o build de
      # release no deploy (que usa SQLX_OFFLINE). O --check falha se houver drift.
      - name: cargo sqlx prepare --check
        working-directory: server
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked || true
          cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "true"
          # prepare --check conecta no banco para revalidar as queries; o schema já
          # foi criado pelas migrations no step de testes (mesmo container persiste).
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/smartcore_v2

  # Fecha a lacuna histórica: os 44 testes do ia_engine nunca rodaram no CI (só
  # localmente). Job próprio, sem dependência do banco (o ia_engine não fala com
  # Postgres/Redis diretamente — é o worker Rust que faz a ponte via gRPC).
  ia_engine:
    name: ia_engine — testes e cobertura (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instala uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: uv sync (dev)
        working-directory: ia_engine
        run: uv sync --dev

      # Stubs gRPC gerados a partir do .proto canônico compartilhado com o Rust
      # (server/crates/contracts/schemas/ai/ai_engine.proto); necessários para
      # importar ia_engine.contracts nos testes e no servicer.
      - name: Gera stubs gRPC (proto canônico)
        working-directory: ia_engine
        run: uv run python scripts/gen_proto.py

      - name: uv run pytest --cov
        working-directory: ia_engine
        run: uv run pytest --cov=ia_engine --cov-report=xml --cov-report=term-missing

      - name: Publica cobertura ia_engine como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-engine-coverage
          path: ia_engine/coverage.xml
          if-no-files-found: ignore

  # Detecta se o app Flutter já existe.
  # hashFiles() NÃO funciona em if de nível de job (avaliado antes do checkout),
  # por isso a detecção roda num job próprio com checkout e expõe um output.
  detect:
    name: Detecta stacks presentes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.check.outputs.flutter }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f clients/pubspec.yaml ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  flutter:
    name: Flutter — análise e testes
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      # Pub workspace (Dart >= 3.6): resolve todos os membros a partir da raiz clients/.
      - name: dart pub get (workspace)
        working-directory: clients
        run: dart pub get

      - name: melos analyze
        working-directory: clients
        run: |
          dart pub global activate melos
          melos run analyze

      - name: melos test
        working-directory: clients
        run: melos run test

      # Agrega os coverage/lcov.info gerados pelo `flutter test --coverage` de cada
      # pacote (melos test já roda com --coverage) num único lcov combinado + resumo
      # em %. Informativo: nunca falha o job por si (o gate é o teste em si, acima).
      - name: Agrega cobertura Flutter (lcov combinado)
        working-directory: clients
        run: |
          mkdir -p ../coverage
          dest=../coverage/flutter-lcov.info
          rm -f "$dest"
          total_lf=0; total_lh=0
          while IFS= read -r -d '' lcov; do
            cat "$lcov" >> "$dest"
            lf=$(grep '^LF:' "$lcov" | awk -F: '{s+=$2} END {print s+0}')
            lh=$(grep '^LH:' "$lcov" | awk -F: '{s+=$2} END {print s+0}')
            total_lf=$((total_lf + lf)); total_lh=$((total_lh + lh))
          done < <(find . -path '*/coverage/lcov.info' -print0)
          pct=$(awk -v lh="$total_lh" -v lf="$total_lf" 'BEGIN { if (lf>0) printf "%.1f", 100*lh/lf; else print "0" }')
          echo "TOTAL Flutter: ${total_lh}/${total_lf} = ${pct}%"

      - name: Publica lcov Flutter como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lcov
          path: coverage/flutter-lcov.info
          if-no-files-found: ignore

      # Smoke de build web/WASM: pega quebras de compilação cedo (ex.: flutter_secure_storage).
      - name: Smoke build web (--wasm)
        working-directory: clients/apps/smart-core-admin
        run: flutter build web --wasm --base-href /v2/admin/ -t lib/main_dev.dart --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br
