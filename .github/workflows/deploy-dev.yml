name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: Build Rust Server (DEV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-edge:
    name: Build Edge Gateway (DEV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepare build context
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-edge:dev
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  deploy-dev:
    name: Deploy DEV (compose)
    needs: [build-server, build-edge]
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # O env real (com segredos) NÃO está no repo (gitignored) e o checkout limpa o
      # working tree; copiamos do caminho provisionado pelo server-setup.sh.
      - name: Provisiona env real do servidor (DEV)
        run: |
          mkdir -p docker/compose/env
          cp /opt/smartcore/dev/env/dev.env docker/compose/env/dev.env

      - name: Compose pull & up (DEV)
        working-directory: docker/compose
        run: |
          export COMPOSE_PROJECT_NAME=smartcore-dev
          docker compose --env-file env/dev.env pull
          docker compose --env-file env/dev.env up -d --remove-orphans
