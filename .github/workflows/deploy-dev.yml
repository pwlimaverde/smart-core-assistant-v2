name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Monorepo: detecta o que mudou para nao rebuildar o que nao foi alterado.
  #   server  -> rebuild da imagem Rust + compose up
  #   web     -> rebuild do bundle Flutter + publicacao em /srv
  #   compose -> so compose up (pull da imagem existente + aplica mudancas)
  # Mudar o proprio workflow forca tudo (valida o pipeline).
  changes:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker/server/**'
              - '.github/workflows/deploy-dev.yml'
            web:
              - 'clients/**'
              - '.github/workflows/deploy-dev.yml'
            compose:
              - 'docker/compose/**'
              - 'docker/init-scripts/**'
              - 'docker/observability/**'
              - '.github/workflows/deploy-dev.yml'

  build-server:
    name: Build Rust Server (DEV)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Driver docker-container: necessário para o cache type=gha (o driver docker
      # padrão não suporta cache export).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Empacota bundle estático
        run: tar -C clients/apps/smart-core-admin/build/web -czf web-dev.tar.gz .

      - uses: actions/upload-artifact@v6
        with:
          name: web-dev
          path: web-dev.tar.gz
          retention-days: 3

  deploy-dev:
    name: Deploy DEV (compose + web)
    needs: [changes, build-server, build-web]
    # Roda se algo relevante mudou e nenhum build falhou (builds pulados = 'skipped',
    # nao bloqueiam). A borda continua sendo o Caddy do host (servidor compartilhado).
    if: >-
      ${{ always()
          && needs.build-server.result != 'failure'
          && needs.build-web.result != 'failure'
          && (needs.changes.outputs.server == 'true'
              || needs.changes.outputs.web == 'true'
              || needs.changes.outputs.compose == 'true') }}
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # O env real (com segredos) NÃO está no repo (gitignored) e o checkout limpa o
      # working tree; copiamos do caminho provisionado pelo server-setup.sh.
      - name: Provisiona env real do servidor (DEV)
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.compose == 'true'
        run: |
          mkdir -p docker/compose/env
          cp /opt/smartcore/dev/env/dev.env docker/compose/env/dev.env

      # Observabilidade compartilhada (cria a rede external). Idempotente.
      - name: Sobe observabilidade (cria a rede compartilhada)
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.compose == 'true'
        working-directory: docker/compose
        run: docker compose -f compose.observability.yml up -d

      - name: Compose pull & up (DEV)
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.compose == 'true'
        working-directory: docker/compose
        run: |
          export COMPOSE_PROJECT_NAME=smart-core-v2-dev
          docker compose --env-file env/dev.env pull
          docker compose --env-file env/dev.env up -d --remove-orphans

      # Bundle estático servido pelo Caddy do host: baixa o artefato e troca atômico.
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.web == 'true'
        with:
          name: web-dev

      - name: Publica bundle web DEV (atômico, com backup)
        if: needs.changes.outputs.web == 'true'
        run: |
          WEB_DIR="/srv/smart-core-admin/dev/web"
          STAGE="/srv/smart-core-admin/dev/web.staging"
          rm -rf /srv/smart-core-admin/dev/web.bak
          cp -r "$WEB_DIR" /srv/smart-core-admin/dev/web.bak 2>/dev/null || true
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf web-dev.tar.gz -C "$STAGE"
          chmod -R 755 "$STAGE"
          rm -rf "$WEB_DIR"; mkdir -p "$(dirname "$WEB_DIR")"
          mv "$STAGE" "$WEB_DIR"
          rm -f web-dev.tar.gz
          echo "✓ bundle web DEV publicado em $WEB_DIR (Caddy do host serve estático, sem reload)"
