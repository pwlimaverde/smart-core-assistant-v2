name: Deploy → DEV

on:
  push:
    branches: [dev]

# Um único grupo para TODO deploy na VPS (dev, prod, infra, rollback): o host é
# um só, e dois `compose pull`/`up` simultâneos disputam disco e memória.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: write   # cria a tag vX.Y.Z-beta.N depois do smoke test
  packages: write   # publica e promove imagens no GHCR

# Versionamento da dev: cada deploy aprovado no smoke test vira
# vX.Y.Z-beta.N (X.Y.Z do arquivo VERSION, N sequencial). TODAS as imagens da
# aplicação ganham essa tag (as não reconstruídas herdam a do bundle em uso), e
# a tag git marca o commit como "testado na dev" — só esses commits podem virar
# release de prod (gate-origem do deploy-prod.yml).
#
# A dev NÃO toca a infraestrutura compartilhada (borda, observabilidade,
# Evolution): ela serve os dois ambientes e só muda por deploy-infra.yml, com
# aprovação. Antes, um push na dev reconstruía a borda e recriava o resto.

jobs:
  # Monorepo: so builda o que mudou.
  #   server -> imagem Rust | web -> imagens Flutter | ia_engine/jev/mcp -> Python
  #   stack  -> nenhuma imagem: so reimplanta o bundle (compose, scripts, VERSION)
  changes:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      ia_engine: ${{ steps.filter.outputs.ia_engine }}
      ia_engine_jev: ${{ steps.filter.outputs.ia_engine_jev }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker/server/**'
            web:
              - 'clients/**'
              - 'docker/web/**'
            ia_engine:
              - 'ia_engine/**'
              # Os stubs gRPC do ia_engine são gerados do .proto canônico do contracts.
              - 'server/crates/contracts/**'
            ia_engine_jev:
              - 'ia_engine_jev/**'
              - 'server/crates/contracts/**'
            mcp_server:
              - 'mcp_server/**'
              # Os stubs gRPC do mcp_server saem do mesmo .proto canônico.
              - 'server/crates/contracts/**'
            # Muda o bundle sem mudar imagem: só reimplanta (sem rebuild).
            stack:
              - 'docker/stack/**'
              - 'docker/backup/**'
              - 'docker/init-scripts/**'
              - 'infra/deploy/**'
              - 'VERSION'
              - '.github/workflows/deploy-dev.yml'

  build-server:
    name: Build Rust Server (DEV)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Versão fixa de propósito: com '3.x' o runner pega o stable do dia, e a
          # troca 3.47.9 -> 3.50.0 (11/11/2026) reprovou o `flutter analyze` em 12
          # pacotes sem commit nenhum (o 3.50 marca `package:flutter/material.dart`
          # como obsoleto). Subir a versão é mudança de código: troca aqui, no
          # deploy-dev, no deploy-prod e no release-windows, com a CI da branch.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - id: sha
        run: echo "curto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          # sha-<curto> é o que o bundle usa (promovido a vX.Y.Z-beta.N); `dev`
          # é só referência humana — o compose nunca usa tag móvel.
          tags: |
            ghcr.io/${{ github.repository }}/smartcore-web:dev
            ghcr.io/${{ github.repository }}/smartcore-web:sha-${{ steps.sha.outputs.curto }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-web-tenant:
    name: Build Web Tenant/Operacional (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build web tenant (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - id: sha
        run: echo "curto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo Dockerfile generico do admin (docker/web) — so muda o bundle e a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          # sha-<curto> é o que o bundle usa (promovido a vX.Y.Z-beta.N); `dev`
          # é só referência humana — o compose nunca usa tag móvel.
          tags: |
            ghcr.io/${{ github.repository }}/smartcore-web-tenant:dev
            ghcr.io/${{ github.repository }}/smartcore-web-tenant:sha-${{ steps.sha.outputs.curto }}
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  # Cliente Windows (Flutter desktop). NAO vai para o VPS — o desktop e baixado
  # pelo usuario. O job existe porque este artefato era feito a mao e ficava
  # velho sem ninguem notar: em 12/09/2026 o zip marcava a data de um build
  # antigo enquanto as imagens web ja tinham sido refeitas.
  #
  # Chama o MESMO script que se usa na maquina local, de proposito: duas
  # receitas para o mesmo artefato divergem, e a que roda menos e a que quebra.
  build-windows-tenant:
    name: Build Windows Tenant (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Duas tentativas de propósito. O `setup.sh` da action baixa o SDK e já
      # falhou com exit 35 do curl (erro de TLS) em 242ms — nada a ver com o
      # código, e um build de desktop perdido por engasgo de rede custa o
      # deploy inteiro. A primeira tentativa não derruba o job; a segunda sim.
      - name: Setup Flutter
        id: flutter
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Setup Flutter (segunda tentativa)
        if: steps.flutter.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # O script confere, dentro do snapshot AOT, que os enderecos entraram —
      # e falha se o endereco do outro ambiente vazou. Um `--dart-define`
      # esquecido nao quebra o build sozinho: gera um app que aponta para o
      # lugar errado e so falha na mao do usuario.
      - name: Build e empacota
        shell: pwsh
        run: .\infra\build-windows.ps1 -Env dev -App tenant

      - uses: actions/upload-artifact@v4
        with:
          name: smart-core-tenant-windows-dev
          path: clients/build/smart-core-tenant-windows-dev.zip
          retention-days: 30
          if-no-files-found: error

  # Imagem Python do ia_engine. O compose (docker/dev/compose.yml) referencia
  # ghcr.io/.../smartcore-ia-engine:dev via `docker compose pull`; sem este job a
  # imagem nunca é publicada e o "Compose pull & up" falha com "not found".
  # Contexto = raiz do repo (o Dockerfile gera os stubs do .proto do contracts).
  build-ia-engine:
    name: Build IA Engine (DEV)
    needs: changes
    if: needs.changes.outputs.ia_engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-ia-engine
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ia-engine
          cache-to: type=gha,mode=max,scope=ia-engine

  # Plano ia-engine-jev — imagem do motor Jev, no mesmo molde do ia_engine. O
  # compose referencia ghcr.io/.../smartcore-ia-engine-jev:dev; sem este job o
  # "Compose pull & up" falha com "not found".
  build-ia-engine-jev:
    name: Build IA Engine Jev (DEV)
    needs: changes
    if: needs.changes.outputs.ia_engine_jev == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-ia-engine-jev
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine_jev/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ia-engine-jev
          cache-to: type=gha,mode=max,scope=ia-engine-jev

  # Imagem Python do mcp_server (N13). Mesmo motivo do job do ia_engine: o compose
  # referencia ghcr.io/.../smartcore-mcp-server:dev via `docker compose pull`, e sem
  # este job o "Compose pull & up" falha com "not found".
  # Contexto = raiz do repo (o Dockerfile gera os stubs do .proto do contracts).
  build-mcp-server:
    name: Build MCP Server (DEV)
    needs: changes
    if: needs.changes.outputs.mcp_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-mcp-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server

  deploy-dev:
    name: Deploy DEV (bundle vX.Y.Z-beta.N)
    needs: [changes, build-server, build-web, build-web-tenant, build-ia-engine, build-ia-engine-jev, build-mcp-server]
    if: >-
      ${{ always()
          && needs.build-server.result != 'failure'
          && needs.build-web.result != 'failure'
          && needs.build-web-tenant.result != 'failure'
          && needs.build-ia-engine.result != 'failure'
          && needs.build-ia-engine-jev.result != 'failure'
          && needs.build-mcp-server.result != 'failure'
          && (needs.changes.outputs.server == 'true'
              || needs.changes.outputs.web == 'true'
              || needs.changes.outputs.ia_engine == 'true'
              || needs.changes.outputs.ia_engine_jev == 'true'
              || needs.changes.outputs.mcp_server == 'true'
              || needs.changes.outputs.stack == 'true') }}
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      # O runner self-hosted reutiliza a workspace entre execuções. Containers que
      # rodaram como root podem deixar arquivos root em .git/objects e o checkout
      # falha com "insufficient permission" (git exit 128). O gh-runner não tem
      # sudo chown, mas tem Docker: um container descartável devolve a posse.
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      # fetch-depth 0: o cálculo do N da beta precisa de todas as tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Calcula a versão beta
        id: versao
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION inválido: '$base'"; exit 1; }
          # VERSION já lançado em prod? As betas seguintes vão para o próximo
          # PATCH até alguém subir o VERSION (MINOR/MAJOR é decisão humana).
          while git rev-parse -q --verify "refs/tags/v$base" >/dev/null; do
            IFS=. read -r ma mi pa <<< "$base"; novo="$ma.$mi.$((pa + 1))"
            echo "::warning::v$base já foi lançada; betas seguem em $novo — atualize o arquivo VERSION"
            base="$novo"
          done
          n=$(git tag -l "v$base-beta.*" | sed 's/.*-beta\.//' | grep -E '^[0-9]+$' | sort -n | tail -n1)
          n=$(( ${n:-0} + 1 ))
          echo "imagem=$base-beta.$n" >> "$GITHUB_OUTPUT"
          echo "id=v$base-beta.$n" >> "$GITHUB_OUTPUT"
          echo "versão da dev: v$base-beta.$n"

      # Imagem reconstruída agora: origem sha-<curto>. As demais herdam a tag do
      # bundle em uso (exatamente o que está rodando); sem bundle (primeira vez),
      # a tag `dev`.
      - name: Promove imagens para a versão beta
        env:
          REBUILT_SERVER: ${{ needs.build-server.result }}
          REBUILT_WEB: ${{ needs.build-web.result }}
          REBUILT_WEB_TENANT: ${{ needs.build-web-tenant.result }}
          REBUILT_IA_ENGINE: ${{ needs.build-ia-engine.result }}
          REBUILT_IA_ENGINE_JEV: ${{ needs.build-ia-engine-jev.result }}
          REBUILT_MCP_SERVER: ${{ needs.build-mcp-server.result }}
        run: |
          set -euo pipefail
          curto="sha-${GITHUB_SHA::7}"
          atual=/opt/smartcore/dev/releases/current/images.env
          origem() { # <resultado do build> <variável do images.env>
            if [ "$1" = success ]; then echo "$curto"
            elif [ -f "$atual" ] && grep -q "^$2=" "$atual"; then grep "^$2=" "$atual" | cut -d= -f2
            else echo dev; fi
          }
          infra/deploy/promove-imagens.sh "${{ steps.versao.outputs.imagem }}" "$RUNNER_TEMP/images.env" dev \
            "smartcore-server=$(origem "$REBUILT_SERVER" SERVER_TAG)" \
            "smartcore-web=$(origem "$REBUILT_WEB" WEB_TAG)" \
            "smartcore-web-tenant=$(origem "$REBUILT_WEB_TENANT" WEB_TENANT_TAG)" \
            "smartcore-ia-engine=$(origem "$REBUILT_IA_ENGINE" IA_ENGINE_TAG)" \
            "smartcore-ia-engine-jev=$(origem "$REBUILT_IA_ENGINE_JEV" IA_ENGINE_JEV_TAG)" \
            "smartcore-mcp-server=$(origem "$REBUILT_MCP_SERVER" MCP_SERVER_TAG)"

      - name: Monta o bundle
        run: infra/deploy/bundle.sh dev "${{ steps.versao.outputs.id }}" "$RUNNER_TEMP/images.env"

      # Materializa /opt/smartcore/dev/env/dev.env a partir do secret, valida
      # chaves, faz pg_dump, sobe, roda o smoke test e troca o `current`. Se o
      # smoke reprovar, volta sozinho para o bundle anterior.
      - name: Implanta (deploy.sh)
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
        run: infra/deploy/deploy.sh dev "${{ steps.versao.outputs.id }}"

      # Só depois do smoke: a tag beta significa "rodou e passou na dev". Criada
      # com GITHUB_TOKEN — de propósito não dispara workflow nenhum.
      - name: Cria a tag ${{ steps.versao.outputs.id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.versao.outputs.id }}" -f sha="$GITHUB_SHA" --silent
          echo "tag ${{ steps.versao.outputs.id }} -> $GITHUB_SHA"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy DEV ${{ steps.versao.outputs.id }}"
            echo ""
            echo "| Imagem | Tag |"; echo "|---|---|"
            sed 's/=/ | /; s/^/| /; s/$/ |/' "$RUNNER_TEMP/images.env" 2>/dev/null || true
            echo ""
            echo "Último marcador: \`$(tail -n1 /opt/smartcore/dev/deploys.log 2>/dev/null)\`"
          } >> "$GITHUB_STEP_SUMMARY"
