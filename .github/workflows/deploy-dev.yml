name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Monorepo: so builda o que mudou.
  #   server  -> imagem Rust         | web  -> imagem do client Flutter
  #   edge    -> imagem da borda      | compose -> so reconcilia (up)
  # Mudar o proprio workflow forca tudo.
  changes:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      edge: ${{ steps.filter.outputs.edge }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker/server/**'
              - '.github/workflows/deploy-dev.yml'
            web:
              - 'clients/**'
              - 'docker/web/**'
              - '.github/workflows/deploy-dev.yml'
            edge:
              - 'docker/edge/**'
              - '.github/workflows/deploy-dev.yml'
            compose:
              - 'docker/dev/**'
              - 'docker/init-scripts/**'
              - 'docker/observability/**'
              - '.github/workflows/deploy-dev.yml'

  build-server:
    name: Build Rust Server (DEV)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-edge:
    name: Build Edge (borda)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Imagem da borda e env-agnostica (roteia v1 + dev + prod + grafana).
      - uses: docker/build-push-action@v6
        with:
          context: docker/edge
          file: docker/edge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-edge:latest
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  deploy-dev:
    name: Deploy DEV (compose)
    needs: [changes, build-server, build-web, build-edge]
    if: >-
      ${{ always()
          && needs.build-server.result != 'failure'
          && needs.build-web.result != 'failure'
          && needs.build-edge.result != 'failure'
          && (needs.changes.outputs.server == 'true'
              || needs.changes.outputs.web == 'true'
              || needs.changes.outputs.edge == 'true'
              || needs.changes.outputs.compose == 'true') }}
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (DEV)
        run: cp /opt/smartcore/dev/env/dev.env docker/dev/.env

      # Observabilidade (cria a rede external compartilhada). Idempotente.
      - name: Sobe observabilidade
        working-directory: docker/observability
        run: docker compose up -d

      # Stack do ambiente dev (inclui o container web do client). Idempotente.
      - name: Compose pull & up (DEV)
        working-directory: docker/dev
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      # Borda (Caddy em 80/443: roteia v1 + v2 + grafana). Idempotente; pull pega
      # a :latest mais recente da imagem do edge.
      - name: Sobe a borda (edge)
        working-directory: docker/edge
        run: |
          docker compose pull
          docker compose up -d
