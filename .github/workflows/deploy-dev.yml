name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Monorepo: so builda o que mudou.
  #   server  -> imagem Rust         | web  -> imagem do client Flutter
  #   edge    -> imagem da borda      | compose -> so reconcilia (up)
  # Mudar o proprio workflow forca tudo.
  changes:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      edge: ${{ steps.filter.outputs.edge }}
      ia_engine: ${{ steps.filter.outputs.ia_engine }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker/server/**'
              - '.github/workflows/deploy-dev.yml'
            web:
              - 'clients/**'
              - 'docker/web/**'
              - '.github/workflows/deploy-dev.yml'
            edge:
              - 'docker/edge/**'
              - '.github/workflows/deploy-dev.yml'
            ia_engine:
              - 'ia_engine/**'
              # Os stubs gRPC do ia_engine são gerados do .proto canônico do contracts.
              - 'server/crates/contracts/**'
              - '.github/workflows/deploy-dev.yml'
            compose:
              - 'docker/dev/**'
              - 'docker/init-scripts/**'
              - 'docker/observability/**'
              - '.github/workflows/deploy-dev.yml'

  build-server:
    name: Build Rust Server (DEV)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-web-tenant:
    name: Build Web Tenant/Operacional (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web tenant (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo Dockerfile generico do admin (docker/web) — so muda o bundle e a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-web-tenant:dev
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  build-edge:
    name: Build Edge (borda)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Imagem da borda e env-agnostica (roteia v1 + dev + prod + grafana).
      - uses: docker/build-push-action@v6
        with:
          context: docker/edge
          file: docker/edge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-edge:latest
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  # Imagem Python do ia_engine. O compose (docker/dev/compose.yml) referencia
  # ghcr.io/.../smartcore-ia-engine:dev via `docker compose pull`; sem este job a
  # imagem nunca é publicada e o "Compose pull & up" falha com "not found".
  # Contexto = raiz do repo (o Dockerfile gera os stubs do .proto do contracts).
  build-ia-engine:
    name: Build IA Engine (DEV)
    needs: changes
    if: needs.changes.outputs.ia_engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-ia-engine
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ia-engine
          cache-to: type=gha,mode=max,scope=ia-engine

  deploy-dev:
    name: Deploy DEV (compose)
    needs: [changes, build-server, build-web, build-web-tenant, build-edge, build-ia-engine]
    if: >-
      ${{ always()
          && needs.build-server.result != 'failure'
          && needs.build-web.result != 'failure'
          && needs.build-web-tenant.result != 'failure'
          && needs.build-edge.result != 'failure'
          && needs.build-ia-engine.result != 'failure'
          && (needs.changes.outputs.server == 'true'
              || needs.changes.outputs.web == 'true'
              || needs.changes.outputs.edge == 'true'
              || needs.changes.outputs.ia_engine == 'true'
              || needs.changes.outputs.compose == 'true') }}
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      # O runner self-hosted reutiliza a workspace entre execuções. Containers que
      # rodaram como root em ciclos anteriores podem deixar arquivos pertencentes a
      # root em .git/objects, e aí o checkout falha com "insufficient permission for
      # adding an object to repository database .git/objects" (git exit 128). O
      # gh-runner não tem sudo chown (sudoers só libera `docker compose`), mas tem
      # acesso ao Docker — então usamos um container descartável para devolver a
      # posse ao usuário do runner ANTES do checkout. Idempotente e defensivo.
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      - uses: actions/checkout@v5

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (DEV)
        run: |
          cp /opt/smartcore/dev/env/dev.env docker/dev/.env
          # O evolution sobe a partir do MESMO dev.env (compose lê via --env-file;
          # vars extras são ignoradas). Exige EVOLUTION_POSTGRES_USER/PASSWORD,
          # EVOLUTION_GLOBAL_API_KEY e EVOLUTION_PORT no dev.env (ver .env.example).
          # IMPORTANTE: o dev.env NÃO pode conter COMPOSE_PROJECT_NAME — cada compose
          # tem seu próprio `name:`. Se vazasse aqui, o env sobreporia o name: do
          # evolution e ele cairia no projeto smart-core-v2-dev (vira órfão e some).
          cp /opt/smartcore/dev/env/dev.env docker/evolution/.env

      # Observabilidade (cria a rede external compartilhada). Idempotente.
      - name: Sobe observabilidade
        working-directory: docker/observability
        run: docker compose up -d

      # Stack FUNDACIONAL evolution: stateful (sessão/auth do WhatsApp em volumes +
      # restart: unless-stopped). `up -d` é idempotente — NÃO reinicia se a config
      # não mudou — e CRIA a rede externa `smart_core_v2_evolution_net` consumida por
      # data_whatsapp/webhook_ingress. PRECEDE o docker/dev, que depende dessa rede.
      # `-p smart-core-v2-evolution` força o projeto próprio explicitamente (defesa
      # extra contra herdar COMPOSE_PROJECT_NAME e cair no projeto do dev).
      - name: Sobe stack evolution (fundacional)
        working-directory: docker/evolution
        run: |
          docker compose -p smart-core-v2-evolution --env-file .env pull
          docker compose -p smart-core-v2-evolution --env-file .env up -d

      # Stack do ambiente dev (inclui o container web do client). Idempotente.
      # --remove-orphans é seguro: a remoção de órfãos é escopada ao projeto
      # (smart-core-v2-dev). O evolution roda em projeto próprio
      # (smart-core-v2-evolution), então NÃO é tratado como órfão do dev mesmo
      # compartilhando a rede smart_core_v2_evolution_net (verificado no servidor).
      - name: Compose pull & up (DEV)
        working-directory: docker/dev
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      # Borda (Caddy em 80/443: roteia v1 + v2 + grafana). Idempotente; pull pega
      # a :latest mais recente da imagem do edge.
      - name: Sobe a borda (edge)
        working-directory: docker/edge
        run: |
          docker compose pull
          docker compose up -d

      # A config de tenant é publicada pelo data_postgres e lida pelo ia_engine
      # em INSTÂNCIAS Redis diferentes se o wiring estiver errado (cache x bus).
      # Nesse caso ela fica íntegra e invisível: nenhum serviço reclama, e só a
      # primeira mensagem de WhatsApp revelaria — com FAILED_PRECONDITION. Este
      # passo compara os dois lados. Nenhum teste unitário pega wiring.
      - name: Smoke test da config no Redis (DEV)
        working-directory: docker/dev
        run: |
          set -u
          # As credenciais vivem no .env do compose, não no ambiente do runner.
          PG_USER=$(grep -E '^POSTGRES_USER=' .env | cut -d= -f2-)
          PG_DB=$(grep -E '^POSTGRES_DB=' .env | cut -d= -f2-)
          RD_PASS=$(grep -E '^REDIS_PASSWORD=' .env | cut -d= -f2-)

          ativos=$(docker compose --env-file .env exec -T postgres \
            psql -U "$PG_USER" -d "$PG_DB" -t -A \
            -c "SELECT count(*) FROM tenants_tenant WHERE active = TRUE" 2>/dev/null \
            | tr -d '[:space:]')
          if [ -z "${ativos:-}" ] || [ "$ativos" = "0" ]; then
            echo "ok  sem tenants ativos — nada a publicar"
            exit 0
          fi

          # O ia_engine se conecta por REDIS_URL: a chave TEM de estar nesse Redis.
          publicadas=$(docker compose --env-file .env exec -T redis \
            redis-cli -a "$RD_PASS" --scan --pattern 'tenant:config:*' 2>/dev/null \
            | grep -c 'tenant:config:' || true)
          if [ "${publicadas:-0}" = "0" ]; then
            echo "::error::$ativos tenant(s) ativo(s) e nenhuma config em tenant:config:* no Redis de cache."
            echo "::error::Verifique se o data_postgres publica em REDIS_URL (e não em REDIS_BUS_URL)."
            docker compose --env-file .env logs --tail 30 data_postgres || true
            exit 1
          fi
          echo "ok  config no Redis ($publicadas de $ativos tenant(s) ativo(s))"

      # A borda ocupa 80/443 e roteia TUDO — inclusive o painel v1 em produção.
      # Ela vive num compose próprio (docker/edge), fora da lista do smoke test
      # abaixo, então um Caddyfile inválido a deixava em crash-loop com o deploy
      # verde e o site fora do ar (2026-07-28: sintaxe `{$VAR:-default}`, que o
      # Caddy lê como default literal `-8082`). Falha rápido e alto.
      - name: Smoke test da borda (DEV)
        working-directory: docker/edge
        run: |
          set -u
          sleep 10
          cid=$(docker compose ps -q caddy || true)
          if [ -z "$cid" ]; then
            echo "::error::edge/caddy: container inexistente"
            exit 1
          fi
          status=$(docker inspect -f '{{.State.Status}}' "$cid")
          restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
          if [ "$status" != "running" ] || [ "$restarts" -gt 2 ]; then
            echo "::error::edge/caddy: status=$status restarts=$restarts"
            docker logs --tail 30 "$cid" || true
            exit 1
          fi
          # Estar `running` não prova que o Caddy aceitou a config e abriu a
          # porta: valida o handshake de verdade contra o domínio público.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://smartcoreassistant.com.br/ || echo 000)
          if [ "$codigo" = "000" ]; then
            echo "::error::edge/caddy: 80/443 não respondem (HTTP $codigo)"
            docker logs --tail 30 "$cid" || true
            exit 1
          fi
          echo "ok  edge/caddy (status=$status restarts=$restarts HTTP=$codigo)"

      # Smoke test: `compose up -d` devolve sucesso assim que os containers são
      # CRIADOS — um serviço que sobe e morre em seguida (env faltando, migration
      # quebrada, dependência fora do ar) deixava o deploy "verde" e só aparecia
      # depois, no uso.
      #
      # Agora TODOS os serviços têm sonda: os RPC pelo PING do transport, o worker
      # pelo batimento do loop de consumo, o webhook_ingress pelo /health e o
      # pg_backup pela idade do último backup bem-sucedido. O gate deixou de ser
      # "o processo está de pé" e passou a ser "o serviço responde" — um processo
      # no ar com o servidor travado aparece como `running` e passava antes.
      # O watchdog não declara sonda (é ele quem sonda os outros) e continua
      # julgado pelo estado do container.
      - name: Smoke test dos serviços (DEV)
        working-directory: docker/dev
        run: |
          set -u
          # Janela para um crash-loop se manifestar (restart: unless-stopped é
          # imediato, então poucos segundos já expõem o RestartCount subindo).
          sleep 25
          servicos="data_postgres data_redis data_storage control_plane worker runtime_api webhook_ingress data_whatsapp ia_engine watchdog pg_backup"
          falhas=""
          for svc in $servicos; do
            cid=$(docker compose --env-file .env ps -q "$svc" || true)
            if [ -z "$cid" ]; then
              echo "::error::$svc: container inexistente"
              falhas="$falhas $svc"
              continue
            fi
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            # Containers sem healthcheck declarado não têm .State.Health; o
            # template devolve "n/a" para eles e o veredito não os julga.
            tpl='{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}'
            health=$(docker inspect -f "$tpl" "$cid")
            # `starting` não é veredito: espera a sonda concluir antes de
            # decidir, senão o gate aprovaria por sorte de timing. A janela é de
            # 180s por causa do pg_backup, cujo `start_period` cobre o tempo do
            # primeiro dump — os demais resolvem em segundos.
            espera=0
            while [ "$health" = "starting" ] && [ "$espera" -lt 180 ]; do
              sleep 5
              espera=$((espera + 5))
              health=$(docker inspect -f "$tpl" "$cid")
            done
            if [ "$status" != "running" ] || [ "$restarts" -gt 2 ] \
               || [ "$health" = "unhealthy" ] || [ "$health" = "starting" ]; then
              echo "::error::$svc: status=$status restarts=$restarts health=$health"
              docker logs --tail 50 "$cid" || true
              falhas="$falhas $svc"
            else
              echo "ok  $svc (status=$status restarts=$restarts health=$health)"
            fi
          done
          if [ -n "$falhas" ]; then
            echo "::error::serviços com falha:$falhas"
            exit 1
          fi
