name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Monorepo: so builda o que mudou.
  #   server  -> imagem Rust         | web  -> imagem do client Flutter
  #   edge    -> imagem da borda      | compose -> so reconcilia (up)
  # Mudar o proprio workflow forca tudo.
  changes:
    name: Detecta mudanças
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      edge: ${{ steps.filter.outputs.edge }}
      ia_engine: ${{ steps.filter.outputs.ia_engine }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docker/server/**'
              - '.github/workflows/deploy-dev.yml'
            web:
              - 'clients/**'
              - 'docker/web/**'
              - '.github/workflows/deploy-dev.yml'
            edge:
              - 'docker/edge/**'
              - '.github/workflows/deploy-dev.yml'
            ia_engine:
              - 'ia_engine/**'
              # Os stubs gRPC do ia_engine são gerados do .proto canônico do contracts.
              - 'server/crates/contracts/**'
              - '.github/workflows/deploy-dev.yml'
            compose:
              - 'docker/dev/**'
              - 'docker/init-scripts/**'
              - 'docker/observability/**'
              - '.github/workflows/deploy-dev.yml'

  build-server:
    name: Build Rust Server (DEV)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-web-tenant:
    name: Build Web Tenant/Operacional (DEV)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web tenant (DEV, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_dev.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://dev.smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo Dockerfile generico do admin (docker/web) — so muda o bundle e a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-web-tenant:dev
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  build-edge:
    name: Build Edge (borda)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Imagem da borda e env-agnostica (roteia v1 + dev + prod + grafana).
      - uses: docker/build-push-action@v6
        with:
          context: docker/edge
          file: docker/edge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-edge:latest
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  # Imagem Python do ia_engine. O compose (docker/dev/compose.yml) referencia
  # ghcr.io/.../smartcore-ia-engine:dev via `docker compose pull`; sem este job a
  # imagem nunca é publicada e o "Compose pull & up" falha com "not found".
  # Contexto = raiz do repo (o Dockerfile gera os stubs do .proto do contracts).
  build-ia-engine:
    name: Build IA Engine (DEV)
    needs: changes
    if: needs.changes.outputs.ia_engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-ia-engine
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ia-engine
          cache-to: type=gha,mode=max,scope=ia-engine

  deploy-dev:
    name: Deploy DEV (compose)
    needs: [changes, build-server, build-web, build-web-tenant, build-edge, build-ia-engine]
    if: >-
      ${{ always()
          && needs.build-server.result != 'failure'
          && needs.build-web.result != 'failure'
          && needs.build-web-tenant.result != 'failure'
          && needs.build-edge.result != 'failure'
          && needs.build-ia-engine.result != 'failure'
          && (needs.changes.outputs.server == 'true'
              || needs.changes.outputs.web == 'true'
              || needs.changes.outputs.edge == 'true'
              || needs.changes.outputs.ia_engine == 'true'
              || needs.changes.outputs.compose == 'true') }}
    runs-on: [self-hosted, hostinger]
    environment: dev
    steps:
      # O runner self-hosted reutiliza a workspace entre execuções. Containers que
      # rodaram como root em ciclos anteriores podem deixar arquivos pertencentes a
      # root em .git/objects, e aí o checkout falha com "insufficient permission for
      # adding an object to repository database .git/objects" (git exit 128). O
      # gh-runner não tem sudo chown (sudoers só libera `docker compose`), mas tem
      # acesso ao Docker — então usamos um container descartável para devolver a
      # posse ao usuário do runner ANTES do checkout. Idempotente e defensivo.
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      - uses: actions/checkout@v5

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (DEV)
        run: |
          cp /opt/smartcore/dev/env/dev.env docker/dev/.env
          # O evolution sobe a partir do MESMO dev.env (compose lê via --env-file;
          # vars extras são ignoradas). Exige EVOLUTION_POSTGRES_USER/PASSWORD,
          # EVOLUTION_GLOBAL_API_KEY e EVOLUTION_PORT no dev.env (ver .env.example).
          # IMPORTANTE: o dev.env NÃO pode conter COMPOSE_PROJECT_NAME — cada compose
          # tem seu próprio `name:`. Se vazasse aqui, o env sobreporia o name: do
          # evolution e ele cairia no projeto smart-core-v2-dev (vira órfão e some).
          cp /opt/smartcore/dev/env/dev.env docker/evolution/.env

      # Observabilidade (cria a rede external compartilhada). Idempotente.
      - name: Sobe observabilidade
        working-directory: docker/observability
        run: docker compose up -d

      # Stack FUNDACIONAL evolution: stateful (sessão/auth do WhatsApp em volumes +
      # restart: unless-stopped). `up -d` é idempotente — NÃO reinicia se a config
      # não mudou — e CRIA a rede externa `smart_core_v2_evolution_net` consumida por
      # data_whatsapp/webhook_ingress. PRECEDE o docker/dev, que depende dessa rede.
      # `-p smart-core-v2-evolution` força o projeto próprio explicitamente (defesa
      # extra contra herdar COMPOSE_PROJECT_NAME e cair no projeto do dev).
      - name: Sobe stack evolution (fundacional)
        working-directory: docker/evolution
        run: |
          docker compose -p smart-core-v2-evolution --env-file .env pull
          docker compose -p smart-core-v2-evolution --env-file .env up -d

      # Stack do ambiente dev (inclui o container web do client). Idempotente.
      # --remove-orphans é seguro: a remoção de órfãos é escopada ao projeto
      # (smart-core-v2-dev). O evolution roda em projeto próprio
      # (smart-core-v2-evolution), então NÃO é tratado como órfão do dev mesmo
      # compartilhando a rede smart_core_v2_evolution_net (verificado no servidor).
      - name: Compose pull & up (DEV)
        working-directory: docker/dev
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      # Borda (Caddy em 80/443: roteia v1 + v2 + grafana). Idempotente; pull pega
      # a :latest mais recente da imagem do edge.
      - name: Sobe a borda (edge)
        working-directory: docker/edge
        run: |
          docker compose pull
          docker compose up -d

      # Smoke test: `compose up -d` devolve sucesso assim que os containers são
      # CRIADOS — um serviço que sobe e morre em seguida (env faltando, migration
      # quebrada, dependência fora do ar) deixava o deploy "verde" e só aparecia
      # depois, no uso. Como os serviços Rust não têm healthcheck no compose, o
      # critério é o estado do container: rodando, sem estar em restart-loop.
      - name: Smoke test dos serviços (DEV)
        working-directory: docker/dev
        run: |
          set -u
          # Janela para um crash-loop se manifestar (restart: unless-stopped é
          # imediato, então poucos segundos já expõem o RestartCount subindo).
          sleep 25
          servicos="data_postgres data_redis data_storage control_plane worker runtime_api webhook_ingress data_whatsapp ia_engine"
          falhas=""
          for svc in $servicos; do
            cid=$(docker compose --env-file .env ps -q "$svc" || true)
            if [ -z "$cid" ]; then
              echo "::error::$svc: container inexistente"
              falhas="$falhas $svc"
              continue
            fi
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            if [ "$status" != "running" ] || [ "$restarts" -gt 2 ]; then
              echo "::error::$svc: status=$status restarts=$restarts"
              docker logs --tail 50 "$cid" || true
              falhas="$falhas $svc"
            else
              echo "ok  $svc (status=$status restarts=$restarts)"
            fi
          done
          if [ -n "$falhas" ]; then
            echo "::error::serviços com falha:$falhas"
            exit 1
          fi
