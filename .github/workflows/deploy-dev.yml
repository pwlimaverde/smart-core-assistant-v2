name: Deploy → DEV

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Rust + Deploy DEV
    runs-on: [self-hosted, hostinger]
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Adiciona Rust ao PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Garante toolchain Rust atualizado
        run: rustup update stable

      - name: Cargo build release (workspace)
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
          RUSTFLAGS: "-C target-cpu=native"
        run: cargo build --release --workspace

      - name: Backup binários anteriores
        run: |
          BACKUP_DIR="/opt/smartcore/dev/bin.bak"
          rm -rf "$BACKUP_DIR"
          cp -r /opt/smartcore/dev/bin "$BACKUP_DIR" 2>/dev/null || true

      - name: Instala novos binários em DEV
        run: |
          BIN_DIR="/opt/smartcore/dev/bin"
          SRC="server/target/release"
          mkdir -p "$BIN_DIR"
          for svc in data_postgres data_redis data_storage \
                     runtime_api control_plane messaging_gateway worker; do
            if [ -f "$SRC/$svc" ]; then
              # Instala via arquivo temporário + mv atômico. Um cp direto sobre o
              # binário antigo falha com "Text file busy" (ETXTBSY) enquanto o
              # serviço está em execução; o rename apenas troca a entrada de
              # diretório (o processo antigo mantém o inode até o restart).
              install -m 755 "$SRC/$svc" "$BIN_DIR/$svc.new"
              mv -f "$BIN_DIR/$svc.new" "$BIN_DIR/$svc"
              echo "✓ $svc instalado"
            fi
          done

      - name: Reinicia serviços DEV (ordem de dependência)
        run: |
          sudo systemctl restart smartcore-dev-data_redis
          sleep 2
          sudo systemctl restart smartcore-dev-data_postgres
          sleep 3
          sudo systemctl restart \
            smartcore-dev-data_storage \
            smartcore-dev-control_plane \
            smartcore-dev-messaging_gateway \
            smartcore-dev-worker
          sleep 3
          sudo systemctl restart smartcore-dev-runtime_api

      - name: Smoke test DEV
        run: |
          sleep 8
          FAILED=0
          for svc in data_redis data_postgres data_storage control_plane messaging_gateway worker runtime_api; do
            STATUS=$(sudo systemctl is-active smartcore-dev-$svc 2>/dev/null || echo "unknown")
            if [ "$STATUS" != "active" ]; then
              echo "ERRO: smartcore-dev-$svc → $STATUS"
              sudo journalctl -u smartcore-dev-$svc --no-pager -n 30
              FAILED=1
            else
              echo "✓ smartcore-dev-$svc ativo"
            fi
          done
          exit $FAILED

      - name: Rollback em falha
        if: failure()
        run: |
          echo "Falha detectada — revertendo binários DEV..."
          if [ -d "/opt/smartcore/dev/bin.bak" ]; then
            # Restaura via mv atômico pelo mesmo motivo do step de instalação
            # (evita "Text file busy" sobre binários ainda em execução).
            for bak in /opt/smartcore/dev/bin.bak/*; do
              [ -f "$bak" ] || continue
              svc="$(basename "$bak")"
              install -m 755 "$bak" "/opt/smartcore/dev/bin/$svc.new"
              mv -f "/opt/smartcore/dev/bin/$svc.new" "/opt/smartcore/dev/bin/$svc"
            done
            sudo systemctl restart \
              smartcore-dev-data_redis \
              smartcore-dev-data_postgres \
              smartcore-dev-data_storage \
              smartcore-dev-control_plane \
              smartcore-dev-messaging_gateway \
              smartcore-dev-worker \
              smartcore-dev-runtime_api
            echo "Rollback DEV concluído."
          else
            echo "Sem backup disponível."
          fi
