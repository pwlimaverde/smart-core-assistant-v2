name: Deploy → PROD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: Build Rust Server (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-edge:
    name: Build Edge Gateway (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepare build context
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-edge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-edge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: true
          tags: ${{ steps.meta-edge.outputs.tags }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  deploy-prod:
    name: Deploy PROD (compose)
    needs: [build-server, build-edge]
    runs-on: [self-hosted, hostinger]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Backup banco de dados PROD (pg_dump)
        run: |
          TAG="${GITHUB_REF_NAME}"
          BACKUP_FILE="/opt/smartcore/prod/db-backup-${TAG}-$(date +%Y%m%d%H%M).dump"
          mkdir -p /opt/smartcore/prod
          CONTAINER="smartcore-v2-postgres"
          if docker ps --format '{{.Names}}' | grep -q "smartcore-prod-postgres"; then
            CONTAINER="smartcore-prod-postgres-1"
          fi
          echo "Gerando backup do banco de dados usando o container $CONTAINER..."
          docker exec "$CONTAINER" pg_dump -U smartcore_app -F c smartcore_v2 > "$BACKUP_FILE" || echo "Falha ao gerar backup (pode ser o primeiro deploy)"
          echo "Backup gravado em: $BACKUP_FILE"
          # Mantém apenas os últimos 5 backups
          ls -t /opt/smartcore/prod/db-backup-*.dump 2>/dev/null | tail -n +6 | xargs rm -f || true

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # O env real (com segredos) NÃO está no repo (gitignored) e o checkout limpa o
      # working tree; copiamos do caminho provisionado pelo server-setup.sh.
      - name: Provisiona env real do servidor (PROD)
        run: |
          mkdir -p docker/compose/env
          cp /opt/smartcore/prod/env/prod.env docker/compose/env/prod.env

      - name: Compose pull & up (PROD)
        working-directory: docker/compose
        run: |
          export COMPOSE_PROJECT_NAME=smartcore-prod
          docker compose --env-file env/prod.env pull
          docker compose --env-file env/prod.env up -d --remove-orphans
