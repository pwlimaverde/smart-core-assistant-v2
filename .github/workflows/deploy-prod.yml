name: Deploy → PROD

# Release = tag vX.Y.Z criada por PESSOA (o ruleset de tags só deixa o dono
# criar). Tag criada por automação com GITHUB_TOKEN não dispara workflow.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Grupo por tag: nenhum outro run (dev, infra, rollback, outra tag) cancela o
# deploy desta tag enquanto ele espera a aprovação do environment `prod`. A
# serialização no host vem do runner self-hosted `hostinger`, que é único e
# roda um job por vez (ver comentário em deploy-dev.yml).
concurrency:
  group: deploy-vps-prod-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: write

# Fluxo (plano servidor-reestruturacao-dev-prod, Fase R5):
#   gate-origem  tag X.Y.Z estável, em commit com beta testada na dev (ou na main)
#   verifica-ci  CI verde no SHA
#   build        web/web-tenant SEMPRE (endereços de prod no --dart-define);
#                backend só se não houver beta (hotfix) — senão é PROMOVIDO:
#                X.Y.Z vira outro nome do mesmo digest testado na dev
#   deploy       environment `prod` (aprovação do dono) -> bundle -> deploy.sh
#                (pg_dump, up, smoke, rollback automático) -> main avança
# A infraestrutura compartilhada (borda, observabilidade, Evolution) NÃO é
# tocada aqui: muda só por deploy-infra.yml.
jobs:
  gate-origem:
    name: Exige origem válida (beta testado na dev ou main)
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.gate.outputs.versao }}
      beta: ${{ steps.gate.outputs.beta }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Confere tag e procedência do commit
        id: gate
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' não é X.Y.Z estável"; exit 1
          fi
          versao="${TAG#v}"
          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dev:refs/remotes/origin/dev'
          # Beta mais recente apontando para este commit (a que passou na dev).
          beta=$(git tag --points-at "$SHA" -l 'v*-beta.*' | sort -V | tail -n1)
          if [ -n "$beta" ] && git merge-base --is-ancestor "$SHA" origin/dev; then
            [ "${beta%%-beta.*}" = "$TAG" ] || echo "::warning::beta $beta tem outra base que $TAG (VERSION desatualizado?)"
            echo "ok  commit implantado na dev como $beta — backend será promovido, sem rebuild"
          elif git merge-base --is-ancestor "$SHA" origin/main; then
            beta=""
            echo "ok  commit pertence à main (hotfix) — backend será construído"
          else
            echo "::error::$SHA não tem tag beta na dev nem está na main — release recusada."
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "beta=${beta#v}" >> "$GITHUB_OUTPUT"

  verifica-ci:
    name: Exige CI verde no commit da tag
    needs: gate-origem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Consulta a conclusão do workflow CI para o SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusao=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.run_started_at) | last | .conclusion // "ausente"')
          echo "CI para $SHA: $conclusao"
          case "$conclusao" in
            success) echo "CI verde — segue o deploy." ;;
            ausente|null)
              echo "::error::Nenhuma execução do workflow CI encontrada para $SHA. Rode o CI nesse commit antes de publicar a tag."
              exit 1 ;;
            *)
              echo "::error::CI concluiu como '$conclusao' para $SHA. Corrija antes de publicar a release."
              exit 1 ;;
          esac

  build-web:
    name: Build Web Admin (PROD)
    needs: [gate-origem, verifica-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Versão fixa de propósito: com '3.x' o runner pega o stable do dia, e a
          # troca 3.47.9 -> 3.50.0 (11/11/2026) reprovou o `flutter analyze` em 12
          # pacotes sem commit nenhum (o 3.50 marca `package:flutter/material.dart`
          # como obsoleto). Subir a versão é mudança de código: troca aqui, no
          # deploy-dev, no deploy-prod e no release-windows, com a CI da branch.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build web admin (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web
          # Só a versão exata: prod nunca usa tag móvel (rollback por versão).
          tags: |
            type=raw,value=${{ needs.gate-origem.outputs.versao }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-web-tenant:
    name: Build Web Tenant/Operacional (PROD)
    needs: [gate-origem, verifica-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build web tenant (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web-tenant
          # Só a versão exata: prod nunca usa tag móvel (rollback por versão).
          tags: |
            type=raw,value=${{ needs.gate-origem.outputs.versao }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  build-server:
    name: Build Rust Server (PROD, só hotfix sem beta)
    needs: [gate-origem, verifica-ci]
    if: needs.gate-origem.outputs.beta == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-server:${{ needs.gate-origem.outputs.versao }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-ia-engine:
    name: Build IA Engine (PROD, só hotfix sem beta)
    needs: [gate-origem, verifica-ci]
    if: needs.gate-origem.outputs.beta == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-ia-engine:${{ needs.gate-origem.outputs.versao }}
          cache-from: type=gha,scope=ia-engine
          cache-to: type=gha,mode=max,scope=ia-engine

  build-ia-engine-jev:
    name: Build IA Engine Jev (PROD, só hotfix sem beta)
    needs: [gate-origem, verifica-ci]
    if: needs.gate-origem.outputs.beta == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine_jev/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-ia-engine-jev:${{ needs.gate-origem.outputs.versao }}
          cache-from: type=gha,scope=ia-engine-jev
          cache-to: type=gha,mode=max,scope=ia-engine-jev

  build-mcp-server:
    name: Build MCP Server (PROD, só hotfix sem beta)
    needs: [gate-origem, verifica-ci]
    if: needs.gate-origem.outputs.beta == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/smartcore-mcp-server:${{ needs.gate-origem.outputs.versao }}
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server

  deploy-prod:
    name: Deploy PROD (bundle vX.Y.Z)
    needs: [gate-origem, verifica-ci, build-web, build-web-tenant, build-server, build-ia-engine, build-ia-engine-jev, build-mcp-server]
    if: >-
      ${{ always()
          && needs.gate-origem.result == 'success'
          && needs.verifica-ci.result == 'success'
          && needs.build-web.result == 'success'
          && needs.build-web-tenant.result == 'success'
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') }}
    runs-on: [self-hosted, hostinger]
    # `prod`: revisor obrigatório (o dono) + só tags v* e a main. Era
    # `production`, que não existia — a primeira tag iria sem aprovação.
    environment: prod
    env:
      VERSAO: ${{ needs.gate-origem.outputs.versao }}
      BETA: ${{ needs.gate-origem.outputs.beta }}
    steps:
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Com beta: server/ia_engine/jev/mcp são o MESMO digest testado na dev,
      # só com o nome X.Y.Z. Web e web-tenant foram construídos agora (prod).
      - name: Promove imagens para X.Y.Z
        run: |
          set -euo pipefail
          origem="${BETA:-$VERSAO}"
          infra/deploy/promove-imagens.sh "$VERSAO" "$RUNNER_TEMP/images.env" "$origem" \
            "smartcore-web=$VERSAO" "smartcore-web-tenant=$VERSAO"

      - name: Monta o bundle
        run: infra/deploy/bundle.sh prod "v$VERSAO" "$RUNNER_TEMP/images.env"

      # pg_dump validado (aborta se falhar), up, smoke e rollback automático
      # para o bundle anterior — tudo dentro do deploy.sh.
      - name: Implanta (deploy.sh)
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
        run: infra/deploy/deploy.sh prod "v$VERSAO"

      # A main é o ponteiro da última release. O ruleset dela só aceita PR — ou
      # a deploy key do runner (bypass), que é o que este passo usa. Só avança
      # por fast-forward; se a main tiver commit que a tag não tem (hotfix
      # ainda não trazido para a dev), não força nada e abre PR main -> dev.
      - name: Avança a main até a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dev:refs/remotes/origin/dev'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main já contém v$VERSAO (hotfix)"
          elif git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            GIT_SSH_COMMAND="ssh -i $HOME/.ssh/smartcore_main_ff -o IdentitiesOnly=yes" \
              git push "git@github.com:${{ github.repository }}.git" "$GITHUB_SHA:refs/heads/main"
            echo "main -> v$VERSAO ($GITHUB_SHA)"
          else
            echo "::warning::main divergiu de v$VERSAO — não avançada. Traga a main para a dev (PR abaixo)."
          fi
          # Backport: a main tem commit que a dev não tem (hotfix) -> PR main -> dev.
          if [ -n "$(git rev-list origin/dev..origin/main)" ]; then
            gh pr create --repo "${{ github.repository }}" --base dev --head main \
              --title "backport: main -> dev após v$VERSAO" \
              --body "A main tem commit(s) que a dev não tem (hotfix). Mergear com **merge commit** (não squash)." \
              || echo "PR main -> dev já existe."
          fi

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy PROD v$VERSAO"
            echo ""
            echo "Origem do backend: ${BETA:+beta $BETA (promovida, sem rebuild)}${BETA:-build do hotfix}"
            echo ""
            echo "| Imagem | Tag |"; echo "|---|---|"
            sed 's/=/ | /; s/^/| /; s/$/ |/' "$RUNNER_TEMP/images.env" 2>/dev/null || true
            echo ""
            echo "Último marcador: \`$(tail -n1 /opt/smartcore/prod/deploys.log 2>/dev/null)\`"
            echo ""
            echo "Rollback: Actions -> rollback-prod -> versão anterior."
          } >> "$GITHUB_STEP_SUMMARY"
