name: Deploy → PROD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: Build Rust Server (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # Bundle estático servido pelo Caddy do host (servidor compartilhado: a borda é o
  # Caddy do host, que também serve o painel v1). Sem imagem edge.
  build-web:
    name: Build Web Admin (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Empacota bundle estático
        run: tar -C clients/apps/smart-core-admin/build/web -czf web-prod.tar.gz .

      - uses: actions/upload-artifact@v6
        with:
          name: web-prod
          path: web-prod.tar.gz
          retention-days: 3

  deploy-prod:
    name: Deploy PROD (compose + web)
    needs: [build-server, build-web]
    runs-on: [self-hosted, hostinger]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: web-prod

      - name: Backup banco de dados PROD (pg_dump)
        run: |
          TAG="${GITHUB_REF_NAME}"
          BACKUP_FILE="/opt/smartcore/prod/backups/db-backup-${TAG}-$(date +%Y%m%d%H%M).dump"
          mkdir -p /opt/smartcore/prod/backups
          CONTAINER="smartcore-prod-postgres-1"
          if docker ps --format '{{.Names}}' | grep -q "$CONTAINER"; then
            echo "Gerando backup do banco usando $CONTAINER..."
            docker exec "$CONTAINER" pg_dump -U smartcore_app -F c smartcore_v2 > "$BACKUP_FILE" \
              || echo "Falha no backup (pode ser o primeiro deploy)"
            echo "Backup: $BACKUP_FILE"
            ls -t /opt/smartcore/prod/backups/db-backup-*.dump 2>/dev/null | tail -n +6 | xargs rm -f || true
          else
            echo "Container $CONTAINER ausente (primeiro deploy) — sem backup."
          fi

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (PROD)
        run: |
          mkdir -p docker/compose/env
          cp /opt/smartcore/prod/env/prod.env docker/compose/env/prod.env

      - name: Sobe observabilidade (cria a rede compartilhada)
        working-directory: docker/compose
        run: docker compose -f compose.observability.yml up -d

      - name: Compose pull & up (PROD)
        working-directory: docker/compose
        run: |
          export COMPOSE_PROJECT_NAME=smartcore-prod
          docker compose --env-file env/prod.env pull
          docker compose --env-file env/prod.env up -d --remove-orphans

      - name: Publica bundle web PROD (atômico, com backup)
        run: |
          WEB_DIR="/srv/smart-core-admin/prod/web"
          STAGE="/srv/smart-core-admin/prod/web.staging"
          rm -rf /srv/smart-core-admin/prod/web.bak
          cp -r "$WEB_DIR" /srv/smart-core-admin/prod/web.bak 2>/dev/null || true
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf web-prod.tar.gz -C "$STAGE"
          chmod -R 755 "$STAGE"
          rm -rf "$WEB_DIR"; mkdir -p "$(dirname "$WEB_DIR")"
          mv "$STAGE" "$WEB_DIR"
          rm -f web-prod.tar.gz
          echo "✓ bundle web PROD publicado em $WEB_DIR"
