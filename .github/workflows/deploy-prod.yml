name: Deploy → PROD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# Release: build completo de proposito (a imagem versionada de cada tag precisa
# existir mesmo sem mudanca de codigo). A borda (edge) e compartilhada e construida
# no fluxo dev; aqui apenas a subimos.
jobs:
  build-server:
    name: Build Rust Server (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Paridade com o admin: a imagem do tenant e construida na tag, e o servico
  # web-tenant sobe no compose prod. O ROTEAMENTO prod do app (Caddy) segue
  # pendente de decisao (ver infra/caddy/tenant.caddy e docker/edge/Caddyfile) —
  # o container roda sem rota publica ate a decisao, exatamente como o admin prod.
  build-web-tenant:
    name: Build Web Tenant/Operacional (PROD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web tenant (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web-tenant
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  deploy-prod:
    name: Deploy PROD (compose)
    needs: [build-server, build-web, build-web-tenant]
    runs-on: [self-hosted, hostinger]
    environment: production
    steps:
      # O runner self-hosted reutiliza a workspace entre execuções (a mesma do deploy
      # dev, por ser o mesmo repo). Containers que rodaram como root podem deixar
      # arquivos root em .git/objects, fazendo o checkout falhar com "insufficient
      # permission ... .git/objects" (git exit 128). O gh-runner não tem sudo chown
      # (sudoers só libera `docker compose`), mas tem acesso ao Docker — então um
      # container descartável devolve a posse ao usuário do runner ANTES do checkout.
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      - uses: actions/checkout@v5

      - name: Backup banco de dados PROD (pg_dump)
        run: |
          TAG="${GITHUB_REF_NAME}"
          BACKUP_FILE="/opt/smartcore/prod/backups/db-backup-${TAG}-$(date +%Y%m%d%H%M).dump"
          mkdir -p /opt/smartcore/prod/backups
          CONTAINER="smart-core-v2-prod-postgres-1"
          if docker ps --format '{{.Names}}' | grep -q "$CONTAINER"; then
            echo "Gerando backup do banco usando $CONTAINER..."
            docker exec "$CONTAINER" pg_dump -U smartcore_app -F c smartcore_v2 > "$BACKUP_FILE" \
              || echo "Falha no backup (pode ser o primeiro deploy)"
            echo "Backup: $BACKUP_FILE"
            ls -t /opt/smartcore/prod/backups/db-backup-*.dump 2>/dev/null | tail -n +6 | xargs rm -f || true
          else
            echo "Container $CONTAINER ausente (primeiro deploy) — sem backup."
          fi

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (PROD)
        run: cp /opt/smartcore/prod/env/prod.env docker/prod/.env

      - name: Sobe observabilidade
        working-directory: docker/observability
        run: docker compose up -d

      - name: Compose pull & up (PROD)
        working-directory: docker/prod
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      - name: Sobe a borda (edge)
        working-directory: docker/edge
        run: |
          docker compose pull
          docker compose up -d
