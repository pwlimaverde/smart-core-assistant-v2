name: Deploy → PROD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# Release: build completo de proposito (a imagem versionada de cada tag precisa
# existir mesmo sem mudanca de codigo). A borda (edge) e compartilhada e construida
# no fluxo dev; aqui apenas a subimos.
jobs:
  # Portão: a tag só vira release se o CI daquele commit tiver passado. Antes, uma
  # tag em cima de um commit com teste vermelho ia direto para produção — o
  # `environment: production` pede aprovação humana, mas quem aprova não tem como
  # saber, do próprio deploy, se a suíte passou. A tag é criada depois do push em
  # `dev`, então o CI daquele SHA já terminou: aqui é só consulta, custa segundos.
  verifica-ci:
    name: Exige CI verde no commit da tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Consulta a conclusão do workflow CI para o SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusao=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.run_started_at) | last | .conclusion // "ausente"')
          echo "CI para $SHA: $conclusao"
          case "$conclusao" in
            success) echo "CI verde — segue o deploy." ;;
            ausente|null)
              echo "::error::Nenhuma execução do workflow CI encontrada para $SHA. Rode o CI nesse commit antes de publicar a tag."
              exit 1 ;;
            *)
              echo "::error::CI concluiu como '$conclusao' para $SHA. Corrija antes de publicar a release."
              exit 1 ;;
          esac

  build-server:
    name: Build Rust Server (PROD)
    needs: verifica-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-web:
    name: Build Web Admin (PROD)
    needs: verifica-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web admin (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-admin
          flutter build web --wasm \
            --base-href /v2/admin/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-admin/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Paridade com o admin: a imagem do tenant e construida na tag, e o servico
  # web-tenant sobe no compose prod. O ROTEAMENTO prod do app (Caddy) segue
  # pendente de decisao (ver infra/caddy/tenant.caddy e docker/edge/Caddyfile) —
  # o container roda sem rota publica ate a decisao, exatamente como o admin prod.
  build-web-tenant:
    name: Build Web Tenant/Operacional (PROD)
    needs: verifica-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Build web tenant (PROD, --wasm)
        working-directory: clients
        run: |
          flutter pub get
          cd apps/smart-core-tenant
          flutter build web --wasm \
            --base-href /v2/tenant/ \
            -t lib/main_prod.dart \
            --dart-define=SMARTCORE_API_ENDPOINT=https://smartcoreassistant.com.br

      - name: Prepara contexto (./web)
        run: cp -r clients/apps/smart-core-tenant/build/web ./web

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-web-tenant
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=web-tenant
          cache-to: type=gha,mode=max,scope=web-tenant

  # Imagem Python do ia_engine (paridade com o dev). O compose de prod referencia
  # ghcr.io/.../smartcore-ia-engine:latest via `docker compose pull`; sem este job
  # a imagem nunca é publicada e o "Compose pull & up (PROD)" falha com "not found".
  # Contexto = raiz do repo (o Dockerfile gera os stubs do .proto do contracts).
  build-ia-engine:
    name: Build IA Engine (PROD)
    needs: verifica-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcore-ia-engine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ia_engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=ia-engine
          cache-to: type=gha,mode=max,scope=ia-engine

  deploy-prod:
    name: Deploy PROD (compose)
    needs: [build-server, build-web, build-web-tenant, build-ia-engine]
    runs-on: [self-hosted, hostinger]
    environment: production
    steps:
      # O runner self-hosted reutiliza a workspace entre execuções (a mesma do deploy
      # dev, por ser o mesmo repo). Containers que rodaram como root podem deixar
      # arquivos root em .git/objects, fazendo o checkout falhar com "insufficient
      # permission ... .git/objects" (git exit 128). O gh-runner não tem sudo chown
      # (sudoers só libera `docker compose`), mas tem acesso ao Docker — então um
      # container descartável devolve a posse ao usuário do runner ANTES do checkout.
      - name: Sanitiza posse da workspace (runner self-hosted)
        run: |
          docker run --rm -v "${{ github.workspace }}":/ws busybox \
            chown -R "$(id -u):$(id -g)" /ws

      - uses: actions/checkout@v5

      # Este é o único ponto de retorno se a release corromper dados. Antes, a falha
      # do `pg_dump` era engolida (`|| echo`) e o deploy seguia: o arquivo ficava
      # truncado ou vazio (o redirecionamento cria o arquivo mesmo quando o comando
      # falha) e ninguém percebia até precisar restaurar. Agora, com o container no
      # ar, backup que falha ABORTA o deploy; a ausência do container segue sendo
      # caso legítimo (primeiro deploy).
      - name: Backup banco de dados PROD (pg_dump)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BACKUP_FILE="/opt/smartcore/prod/backups/db-backup-${TAG}-$(date +%Y%m%d%H%M).dump"
          mkdir -p /opt/smartcore/prod/backups
          CONTAINER="smart-core-v2-prod-postgres-1"
          if ! docker ps --format '{{.Names}}' | grep -q "$CONTAINER"; then
            echo "Container $CONTAINER ausente (primeiro deploy) — sem backup."
            exit 0
          fi
          echo "Gerando backup do banco usando $CONTAINER..."
          if ! docker exec "$CONTAINER" pg_dump -U smartcore_app -F c smartcore_v2 > "$BACKUP_FILE"; then
            rm -f "$BACKUP_FILE"
            echo "::error::pg_dump falhou — deploy abortado (produção ficaria sem ponto de retorno)."
            exit 1
          fi
          # Um dump custom-format válido tem cabeçalho "PGDMP" e nunca é minúsculo:
          # pega o caso do dump que "termina bem" mas sai vazio/truncado.
          tamanho=$(stat -c%s "$BACKUP_FILE")
          if [ "$tamanho" -lt 1024 ]; then
            echo "::error::backup suspeito (${tamanho} bytes) — deploy abortado."
            exit 1
          fi
          if ! head -c 5 "$BACKUP_FILE" | grep -q "PGDMP"; then
            echo "::error::backup sem cabeçalho PGDMP — deploy abortado."
            exit 1
          fi
          echo "Backup: $BACKUP_FILE (${tamanho} bytes)"
          ls -t /opt/smartcore/prod/backups/db-backup-*.dump 2>/dev/null | tail -n +6 | xargs -r rm -f || true

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Provisiona env real do servidor (PROD)
        run: cp /opt/smartcore/prod/env/prod.env docker/prod/.env

      - name: Sobe observabilidade
        working-directory: docker/observability
        run: docker compose up -d

      - name: Compose pull & up (PROD)
        working-directory: docker/prod
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      - name: Sobe a borda (edge)
        working-directory: docker/edge
        run: |
          docker compose pull
          docker compose up -d

      # A borda ocupa 80/443 e roteia TUDO — inclusive o painel v1 em produção.
      # Ela vive num compose próprio (docker/edge), fora da lista do smoke test
      # abaixo, então um Caddyfile inválido a deixava em crash-loop com o deploy
      # verde e o site fora do ar (2026-07-28: sintaxe `{$VAR:-default}`, que o
      # Caddy lê como default literal `-8082`). Falha rápido e alto.
      - name: Smoke test da borda (PROD)
        working-directory: docker/edge
        run: |
          set -u
          sleep 10
          cid=$(docker compose ps -q caddy || true)
          if [ -z "$cid" ]; then
            echo "::error::edge/caddy: container inexistente"
            exit 1
          fi
          status=$(docker inspect -f '{{.State.Status}}' "$cid")
          restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
          if [ "$status" != "running" ] || [ "$restarts" -gt 2 ]; then
            echo "::error::edge/caddy: status=$status restarts=$restarts"
            docker logs --tail 30 "$cid" || true
            exit 1
          fi
          # Estar `running` não prova que o Caddy aceitou a config e abriu a
          # porta: valida o handshake de verdade contra o domínio público.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://smartcoreassistant.com.br/ || echo 000)
          if [ "$codigo" = "000" ]; then
            echo "::error::edge/caddy: 80/443 não respondem (HTTP $codigo)"
            docker logs --tail 30 "$cid" || true
            exit 1
          fi
          echo "ok  edge/caddy (status=$status restarts=$restarts HTTP=$codigo)"

      # Smoke test: `compose up -d` devolve sucesso assim que os containers são
      # CRIADOS. Sem esta verificação, uma release que sobe serviços em crash-loop
      # (env faltando, migration quebrada) era publicada como deploy bem-sucedido —
      # e o PR de release ainda pedia "smoke tests em prod verificados" como item
      # manual de checklist.
      #
      # Agora TODOS os serviços têm sonda: os RPC pelo PING do transport, o worker
      # pelo batimento do loop de consumo, o webhook_ingress pelo /health e o
      # pg_backup pela idade do último backup bem-sucedido. O gate deixou de ser
      # "o processo está de pé" e passou a ser "o serviço responde". O watchdog
      # não declara sonda (é ele quem sonda os outros) e segue julgado pelo
      # estado do container.
      - name: Smoke test dos serviços (PROD)
        working-directory: docker/prod
        run: |
          set -u
          sleep 25
          servicos="data_postgres data_redis data_storage control_plane worker runtime_api webhook_ingress data_whatsapp ia_engine watchdog pg_backup"
          falhas=""
          for svc in $servicos; do
            cid=$(docker compose --env-file .env ps -q "$svc" || true)
            if [ -z "$cid" ]; then
              echo "::error::$svc: container inexistente"
              falhas="$falhas $svc"
              continue
            fi
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
            # Containers sem healthcheck declarado não têm .State.Health; o
            # template devolve "n/a" para eles e o veredito não os julga.
            tpl='{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}'
            health=$(docker inspect -f "$tpl" "$cid")
            # `starting` não é veredito: espera a sonda concluir antes de
            # decidir, senão o gate aprovaria por sorte de timing. A janela é de
            # 240s por causa do pg_backup, cujo `start_period` cobre o tempo do
            # primeiro dump — em prod o banco é maior que o de dev.
            espera=0
            while [ "$health" = "starting" ] && [ "$espera" -lt 240 ]; do
              sleep 5
              espera=$((espera + 5))
              health=$(docker inspect -f "$tpl" "$cid")
            done
            if [ "$status" != "running" ] || [ "$restarts" -gt 2 ] \
               || [ "$health" = "unhealthy" ] || [ "$health" = "starting" ]; then
              echo "::error::$svc: status=$status restarts=$restarts health=$health"
              docker logs --tail 50 "$cid" || true
              falhas="$falhas $svc"
            else
              echo "ok  $svc (status=$status restarts=$restarts health=$health)"
            fi
          done
          if [ -n "$falhas" ]; then
            echo "::error::serviços com falha:$falhas"
            echo "Rollback: reimplante a tag anterior (as imagens versionadas seguem no GHCR)."
            exit 1
          fi
