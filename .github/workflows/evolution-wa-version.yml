# Constrói e publica no GHCR a Evolution Go 0.7.3 com a versão do WhatsApp Web
# atual (docker/evolution/wa-version). O compile acontece aqui: se a chamada
# não compilar contra o whatsmeow da tag, o job falha e nada é publicado.
#
# A stack fundacional (docker/evolution) puxa esta imagem no deploy-infra.yml
# (infra compartilhada, aprovação de prod). Tags anteriores ficam no GHCR para
# rollback: 0.7.3-wa1 (sem o patch do Archive) e 0.7.2-wa1 (anterior ao ack da
# stanza <status>; voltar a ela trava a recepção). Republicar a tag não muda o
# que roda: o compose fixa o digest; ao republicar, atualize-o.
# Build só por workflow_dispatch (`gh workflow run evolution-wa-version.yml
# --ref <branch>`): o push só dispara no branch histórico abaixo.
# Versão e revisão de patch ficam no `env` do job: build-arg e tag usam os
# mesmos valores, então a tag sempre bate com o main.version do binário.
name: Evolution Go (WhatsApp Web atual)

on:
  push:
    branches: ['feature/evolution-wa-version']
    paths:
      - 'docker/evolution/wa-version/**'
      - '.github/workflows/evolution-wa-version.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EVOLUTION_REF: '0.7.3'
      PATCH_REV: 'wa2'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: docker/evolution/wa-version
          build-args: |
            EVOLUTION_REF=${{ env.EVOLUTION_REF }}
            PATCH_REV=${{ env.PATCH_REV }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/evolution-go-wa:${{ env.EVOLUTION_REF }}-${{ env.PATCH_REV }}
