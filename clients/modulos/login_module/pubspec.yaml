name: login_module
description: Módulo de login (Flutter Web/WASM) consumindo o auth da runtime_api via gRPC-Web.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dependencies_module:
    path: ../dependencies_module
  # Deps diretas (importadas explicitamente pelas camadas domain/data/presentation).
  core_module:
    path: ../core_module
  presentation_module:
    path: ../presentation_module
  api_client:
    path: ../../packages/api_client
  app_config:
    path: ../../packages/app_config
  domain_models:
    path: ../../packages/domain_models
  get_it_module:
    path: ../../packages/get_it_module
  return_success_or_error: ^3.0.1
  meta: ^1.15.0
  # v10+ migrou o backend web para package:web (compatível com --wasm); v9 ainda
  # usa dart:html e quebra o build WASM.
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

resolution: workspace
