name: onboarding_module
description: Wizard público de cadastro de tenant (empresa, plano, pagamento) para o app do tenant.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dependencies_module:
    path: ../dependencies_module
  core_module:
    path: ../core_module
  # O passo final do wizard entra na conta recém-criada pelo AuthService dele.
  login_module:
    path: ../login_module
  presentation_module:
    path: ../presentation_module
  api_client:
    path: ../../packages/api_client
  domain_models:
    path: ../../packages/domain_models
  get_it_module:
    path: ../../packages/get_it_module
  design_system_module:
    path: ../design_system_module
  return_success_or_error: ^3.0.1
  meta: ^1.15.0
  # Abrir a URL de um gateway de pagamento no navegador do sistema.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  go_router: ^17.2.1
  get_it: ^9.2.1
  bloc_test: ^10.0.0

resolution: workspace
