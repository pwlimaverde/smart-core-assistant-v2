name: operacional_module
description: Telas operacionais (fila/Kanban/chat) do atendimento — WS-6. RemoteOnly hoje (gRPC-Web); preparado para LocalEngineFFI no futuro sem tocar as telas.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dependencies_module:
    path: ../dependencies_module
  core_module:
    path: ../core_module
  presentation_module:
    path: ../presentation_module
  design_system_module:
    path: ../design_system_module
  api_client:
    path: ../../packages/api_client
  local_engine_ffi:
    path: ../../packages/local_engine_ffi
  app_config:
    path: ../../packages/app_config
  domain_models:
    path: ../../packages/domain_models
  get_it_module:
    path: ../../packages/get_it_module
  return_success_or_error: ^3.0.1
  meta: ^1.15.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  # Int64 dos campos de timestamp do protobuf nos testes do gateway.
  fixnum: ^1.1.0

resolution: workspace
