name: tenant_module
description: Módulo do painel do tenant (Flutter Web/WASM) — convites, gestão de usuários/flow_permissions e configuração do próprio tenant.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dependencies_module:
    path: ../dependencies_module
  core_module:
    path: ../core_module
  login_module:
    path: ../login_module
  # A tela de pagamento e o aviso de pendencia leem o PortaoConfiguracao, que
  # guarda o estado da conta consultado uma vez por sessao. Dependencia de mao
  # unica: onboarding_module nao conhece tenant_module.
  onboarding_module:
    path: ../onboarding_module
  presentation_module:
    path: ../presentation_module
  url_launcher: ^6.3.1
  # C3: este modulo fornece ao quadro a busca de clientes (cadastro e assunto
  # daqui). Mao unica, como onboarding_module acima — o operacional_module nao
  # conhece tenant_module, e e o app que compoe os dois.
  operacional_module:
    path: ../operacional_module
  # `Int64` do protobuf — o id do campo personalizado é int64, e o datasource
  # o constrói. Era dev-dependency, de quando só os testes precisavam.
  fixnum: ^1.1.0
  api_client:
    path: ../../packages/api_client
  app_config:
    path: ../../packages/app_config
  domain_models:
    path: ../../packages/domain_models
  get_it_module:
    path: ../../packages/get_it_module
  design_system_module:
    path: ../design_system_module
  return_success_or_error: ^3.0.1
  meta: ^1.15.0
  web: ^1.1.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  go_router: ^17.2.1
  get_it: ^9.2.1

resolution: workspace
