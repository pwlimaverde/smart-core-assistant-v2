name: api_client
description: Contrato único de comunicação com o backend (stub — gRPC/gRPC-Web em fase futura).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  app_config:
    path: ../app_config
  domain_models:
    path: ../domain_models
  # gRPC-Web: canal + stubs gerados do auth.proto. A web do grpc 4.x usa
  # package:web/dart:js_interop (compatível com flutter build web --wasm).
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

