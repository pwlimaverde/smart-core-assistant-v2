include: package:flutter_lints/flutter.yaml

# cargokit/ é a ferramenta de build vendorizada do flutter_rust_bridge (pacote Dart
# próprio, com deps não resolvidas no contexto deste pacote). O `flutter analyze .`
# do CI (melos) desce nela e acusa dezenas de uri_does_not_exist/undefined — então
# excluímos do analyzer. Não é código do pacote.
analyzer:
  exclude:
    - cargokit/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
