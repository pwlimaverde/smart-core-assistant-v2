name: smart-core-v2-observability

networks:
  smart_core_v2_observability:
    name: smart_core_v2_observability
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ../observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    volumes:
      - ../observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ../observability/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ../observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [smart_core_v2_observability]
    restart: unless-stopped

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
