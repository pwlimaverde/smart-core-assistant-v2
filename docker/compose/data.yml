# ============================================
# Smart Core Assistant v2 — Infraestrutura de Dados
# ============================================
# Deploy no Hostinger via: cd infra && .\deploy-data.ps1
# Desenvolvimento local: cd infra && .\tunnel.ps1
# Gerenciamento remoto: cd infra && .\manage.ps1
# ============================================

networks:
  smartcore_v2_network:
    name: smartcore_v2_network
    driver: bridge

services:
  # ============================================
  # PostgreSQL 16 + pgvector
  # Banco unificado multitenant com RLS
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartcore-v2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - smartcore_v2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # Redis 7
  # Cache DashMap + pub/sub + bridge ia_engine
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: smartcore-v2-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 150mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - smartcore_v2_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 64M

  # ============================================
  # MinIO
  # Armazenamento de midia (S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: smartcore-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - smartcore_v2_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    name: smartcore_v2_postgres_data
  redis_data:
    name: smartcore_v2_redis_data
  minio_data:
    name: smartcore_v2_minio_data
