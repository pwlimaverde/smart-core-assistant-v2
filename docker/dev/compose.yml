# =============================================================================
# Ambiente DEV — Smart Core Assistant v2 (full-docker)
# =============================================================================
# Stack autocontida do ambiente de DESENVOLVIMENTO. O nome do projeto é fixo
# (name:), entao nao precisa de COMPOSE_PROJECT_NAME. Storage de midia: MinIO
# local (em prod e Cloudflare R2). A borda e o Caddy do HOST (servidor
# compartilhado): publicamos so a fachada gRPC-Web do runtime_api no host.
#
# Subir (a partir de docker/dev/):
#   docker compose --env-file .env up -d
# A rede de observabilidade deve existir antes (suba docker/observability primeiro).
# =============================================================================
name: smart-core-v2-dev

x-server-image: &server-image ${SERVER_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-v2/smartcore-server:dev}

networks:
  internal:
    driver: bridge
  observability:
    name: smart_core_v2_observability
    external: true
  evolution_net:
    name: smart_core_v2_evolution_net
    external: true

services:
  # ---------- DADOS ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 150mb --maxmemory-policy allkeys-lru --bind 0.0.0.0 --protected-mode yes
    volumes: [redis_data:/data]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-bus:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 150mb --maxmemory-policy noeviction --bind 0.0.0.0 --protected-mode yes
    volumes: [redis_bus_data:/data]
    ports:
      - "${REDIS_BUS_PORT:-6381}:6379"
    networks: [internal]
    restart: unless-stopped

  # Storage de midia local (dev). Em prod usa-se R2 (sem MinIO).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [internal]
    restart: unless-stopped

  # Provisiona o bucket no MinIO. Sem ele, o data_storage entra em crash-loop num
  # volume novo ("bucket inexistente"). One-off idempotente.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-media-smart-core-assistant}
    networks: [internal]
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break
          echo "aguardando minio... ($$i)"; sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET pronto"

  # ---------- SERVICOS RUST (imagem unica, command por servico) ----------
  data_postgres:
    image: *server-image
    command: ["data_postgres"]
    env_file: [.env]
    networks: [internal, observability]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  data_redis:
    image: *server-image
    command: ["data_redis"]
    env_file: [.env]
    networks: [internal, observability]
    depends_on:
      redis: { condition: service_healthy }
      redis-bus: { condition: service_started }
    restart: unless-stopped

  data_storage:
    image: *server-image
    command: ["data_storage"]
    env_file: [.env]
    networks: [internal, observability]
    restart: unless-stopped

  control_plane:
    image: *server-image
    command: ["control_plane"]
    env_file: [.env]
    networks: [internal, observability]
    depends_on:
      data_postgres: { condition: service_started }
    restart: unless-stopped

  worker:
    image: *server-image
    command: ["worker"]
    env_file: [.env]
    networks: [internal, observability]
    depends_on:
      data_postgres: { condition: service_started }
      data_redis: { condition: service_started }
    restart: unless-stopped

  runtime_api:
    image: *server-image
    command: ["runtime_api"]
    env_file: [.env]
    networks: [internal, observability]
    # Publica a fachada gRPC-Web no host; o admin.caddy do Caddy do host faz o
    # reverse_proxy p/ esta porta (dev: 50051).
    ports:
      - "${RUNTIME_WEB_PORT:-50051}:50051"
    depends_on:
      control_plane: { condition: service_started }
    restart: unless-stopped

  # Client admin (Flutter Web) — bundle embutido na imagem. Publicado no host; o
  # edge faz reverse_proxy p/ host.docker.internal:${WEB_HOST_PORT} no /v2/admin/*.
  web:
    image: ${WEB_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-v2/smartcore-web:dev}
    ports:
      - "${WEB_HOST_PORT:-8081}:80"
    networks: [internal]
    restart: unless-stopped

  # ---------- MENSAGERIA / WHATSAPP ----------
  data_whatsapp:
    image: *server-image
    command: ["data_whatsapp"]
    env_file: [.env]
    networks: [internal, observability, evolution_net]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  webhook_ingress:
    image: *server-image
    command: ["webhook_ingress"]
    env_file: [.env]
    networks: [internal, observability, evolution_net]
    ports:
      - "${WEBHOOK_INGRESS_PORT:-9200}:9200"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  redis_bus_data:
  minio_data:
