name: smart-core-v2-evolution

services:
  postgres_evolution:
    image: postgres:16-alpine
    container_name: smartcore-evolution-postgres
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}
      POSTGRES_DB: evogo_auth
      EVOGO_USERS_DB: evogo_users
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - evolution_net
    healthcheck:
      # -d evogo_auth: sem o -d, o pg_isready conecta no db "evolution" (= nome do
      # user), que não existe → healthcheck falha eternamente → container unhealthy.
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d evogo_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution:
    # Versão FIXA (reprodutibilidade): evita que `:latest` mude e quebre o dev sem
    # aviso. 0.7.1 é a última release estável. Para atualizar, troque a tag aqui e
    # suba a stack manualmente de novo (serviço fundacional "sobe uma vez").
    image: evoapicloud/evolution-go:0.7.1
    container_name: smartcore-evolution
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: smartcore
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?defina EVOLUTION_GLOBAL_API_KEY no .env}
      POSTGRES_AUTH_DB: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}@postgres_evolution:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}@postgres_evolution:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "ERROR"
      LOGTYPE: console
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - evolution_net
    depends_on:
      postgres_evolution:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_evolution_data:
  evolution_data:
  evolution_logs:

networks:
  evolution_net:
    name: smart_core_v2_evolution_net
    driver: bridge
