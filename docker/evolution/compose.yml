name: smart-core-v2-evolution

services:
  postgres_evolution:
    image: postgres:16-alpine
    container_name: smartcore-evolution-postgres
    # A evolution-go VAZA conexão: cada pedido de QR que não acha cliente ativo
    # abre uma nova e não a devolve. Elas ficam `idle` para sempre, e ao chegar
    # em `max_connections` o provedor para de funcionar inteiro — sem device
    # store não há cliente whatsmeow, sem cliente não há websocket, sem
    # websocket não há QR. O sintoma na tela é um QR que nunca aparece; o log
    # diz "sorry, too many clients already".
    #
    # `idle_session_timeout` devolve o slot sozinho: sessão parada por 5 min é
    # encerrada. Não conserta o vazamento (é da evolution-go), mas impede que
    # ele acumule até derrubar o pareamento. `max_connections` maior só adiaria.
    command:
      - postgres
      - -c
      - idle_session_timeout=300000
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}
      POSTGRES_DB: evogo_auth
      EVOGO_USERS_DB: evogo_users
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
      # Caminho ESTÁVEL entre deploys. O deploy-infra.sh copia os scripts para
      # /opt/smartcore/infra/evolution/init-scripts e exporta a variável. Com
      # `./init-scripts` a origem do bind mount era `releases/<id>/init-scripts`,
      # que muda a cada bundle: o config-hash do serviço mudava e o compose
      # recriava o banco do Evolution em todo deploy de infra (segundos sem banco
      # para dev e prod). O volume de dados nunca mudou de nome; só o container
      # era recriado. Os scripts só rodam com o volume vazio (primeira subida).
      # O padrão `./init-scripts` serve à validação da CI e ao uso local.
      - ${EVOLUTION_INIT_SCRIPTS_DIR:-./init-scripts}:/docker-entrypoint-initdb.d:ro
    networks:
      - evolution_net
    healthcheck:
      # -d evogo_auth: sem o -d, o pg_isready conecta no db "evolution" (= nome do
      # user), que não existe → healthcheck falha eternamente → container unhealthy.
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d evogo_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution:
    # Versão FIXA (reprodutibilidade): evita que `:latest` mude e quebre o dev sem
    # aviso. Imagem própria: a oficial recusa o pareamento com 405
    # ClientOutdated quando a versão embutida no whatsmeow envelhece, porque
    # grava a versão atual do WhatsApp Web só em DeviceProps. A nossa chama
    # store.SetWAVersion com a versão que o próprio Evolution busca na web
    # (docker/evolution/wa-version). Para atualizar, trocar a tag e publicar pelo
    # workflow evolution-wa-version.
    #
    # 0.7.3: o whatsmeow da 0.7.2 não dava ack na stanza `<status>` (stories) e
    # a fila do WhatsApp travava — nenhuma mensagem recebida chegava. Rollback:
    # voltar este padrão para 0.7.2-wa1 e rodar o deploy-infra (as migrações
    # v15/v16 do store só adicionam colunas com default e são marcadas
    # "compatible with v8+", então a 0.7.2, que vai até a v14, abre o banco).
    #
    # Fixada também por digest: a tag no GHCR pode ser republicada pelo
    # workflow; o digest garante que dev e prod rodam o binário que foi testado.
    image: ghcr.io/pwlimaverde/evolution-go-wa:${EVOLUTION_IMAGE_TAG:-0.7.3-wa1@sha256:0aeebb8a3732033dfeaca30d79c45014feb46b4076d64e0841333aed1f9f4366}
    container_name: smartcore-evolution
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: smartcore
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?defina EVOLUTION_GLOBAL_API_KEY no .env}
      POSTGRES_AUTH_DB: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}@postgres_evolution:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}@postgres_evolution:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "ERROR"
      LOGTYPE: console
    # Só no loopback: a v2 fala com a evolution pela rede Docker
    # (`smartcore-evolution:8080`), e a borda não a publica. A porta no host
    # existe para administração local (curl, manager). Em 0.0.0.0 a API inteira
    # do WhatsApp ficava na internet protegida só pela chave global — e o Docker
    # publica por cima do UFW.
    ports:
      - "${EVOLUTION_BIND_IP:-127.0.0.1}:${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - evolution_net
    depends_on:
      postgres_evolution:
        condition: service_healthy
    restart: unless-stopped

  # Intermediário de webhooks de provedores (ADR adr-intermediario-webhooks-provedores.md).
  # Recebe o webhook do Evolution em `/{ambiente}/webhook/...` e repassa ao
  # webhook_ingress daquele ambiente. Sem porta publicada: só a rede evolution_net
  # alcança este serviço. Imagem fixa por sha, gravada pelo deploy-infra.sh.
  provider_edge:
    image: ${PROVIDER_EDGE_IMAGE:?PROVIDER_EDGE_IMAGE ausente (evolution.env)}
    container_name: smartcore-provider-edge
    command: ["provider_edge"]
    environment:
      PROVIDER_EDGE_PORT: "8088"
      # ambiente=destino, separados por vírgula. dev: ingress na evolution_net;
      # prod: ingress publicado na ponte do host (ver prod.override.yml).
      PROVIDER_EDGE_DESTINOS: ${PROVIDER_EDGE_DESTINOS:-dev=http://webhook_ingress:9200,prod=http://172.17.0.1:9211}
      RUST_LOG: ${PROVIDER_EDGE_RUST_LOG:-info}
      # Sem rota para o otel-collector (só está na evolution_net): com o OTLP
      # ligado, o exportador tentaria localhost:4317 e encheria o log de erro de
      # exportação. Os logs JSON do stdout continuam indo para o Loki (promtail).
      OTEL_SDK_DISABLED: ${PROVIDER_EDGE_OTEL_SDK_DISABLED:-true}
    networks:
      - evolution_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8088/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres_evolution_data:
  evolution_data:
  evolution_logs:

networks:
  evolution_net:
    name: smart_core_v2_evolution_net
    driver: bridge
