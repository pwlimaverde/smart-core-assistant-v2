# =============================================================================
# Observabilidade (LGTM) — Smart Core Assistant v2
# =============================================================================
# Stack COMPARTILHADA e separada dos ambientes. Cria a rede external
# `smart_core_v2_observability`, que dev e prod referenciam. Suba ESTA stack
# ANTES de dev/prod (senao o `up` deles falha por rede inexistente).
# A separacao dev/prod nos dados/traces e por OTEL_SERVICE_NAMESPACE (no .env de
# cada ambiente: smart-core-v2-dev / smart-core-v2-prod).
#
# Subir (a partir de docker/observability/):
#   docker compose up -d
# =============================================================================
name: smart-core-v2-observability

networks:
  smart_core_v2_observability:
    name: smart_core_v2_observability
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Destino dos alertas. O provisionamento (`provisioning/alerting/
      # contact-points.yml`) lê estas variáveis; elas precisam SEMPRE existir,
      # senão o Grafana falha ao provisionar. Os defaults abaixo não entregam
      # nada — são só para a stack subir. Aponte o webhook para um canal real
      # (Discord/Slack/n8n) ou configure o SMTP; sem isso as regras disparam e
      # ninguém fica sabendo.
      SMARTCORE_ALERTA_WEBHOOK_URL: ${SMARTCORE_ALERTA_WEBHOOK_URL:-http://localhost:9/alerta-nao-configurado}
      SMARTCORE_ALERTA_EMAIL: ${SMARTCORE_ALERTA_EMAIL:-ops@smartcore.local}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [smart_core_v2_observability]
    restart: unless-stopped

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
