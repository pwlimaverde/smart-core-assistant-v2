# =============================================================================
# Observabilidade (LGTM) — Smart Core Assistant v2
# =============================================================================
# Stack COMPARTILHADA e separada dos ambientes. Cria a rede external
# `smart_core_v2_observability`, que dev e prod referenciam. Suba ESTA stack
# ANTES de dev/prod (senao o `up` deles falha por rede inexistente).
# A separacao dev/prod nos dados/traces e por OTEL_SERVICE_NAMESPACE (no .env de
# cada ambiente: smart-core-v2-dev / smart-core-v2-prod).
#
# Subir (a partir de docker/observability/):
#   docker compose up -d
# =============================================================================
name: smart-core-v2-observability

networks:
  smart_core_v2_observability:
    name: smart_core_v2_observability
    driver: bridge

  # Rede só para o `mcp_server` alcançar o collector (N13.4).
  #
  # Existe porque a `smart_core_v2_observability` tem TODOS os serviços, inclusive
  # `data_postgres`, `data_redis` e `data_storage`. Pôr o mcp_server nela dava a
  # ele resolução e alcance de rede para esses três — o que destrói o invariante
  # da fase N13: "o mcp_server não fala com o banco, e a barreira é topológica".
  # Verificado no servidor em 2026-09-11: os três resolviam de dentro do
  # container. O teste de isolamento do módulo pegou.
  #
  # Aqui só entram o collector e os `mcp_server` (dev e prod). Declarada NESTA
  # stack porque ela sobe antes da stack de aplicação no deploy; a stack de
  # aplicação a consome como externa.
  smart_core_v2_mcp_telemetria:
    name: smart_core_v2_mcp_telemetria
    driver: bridge

  # Só o promtail e o proxy do socket. `internal`: sem saída para fora, e
  # nenhum outro serviço alcança o proxy.
  docker_proxy:
    internal: true

services:
  # Proxy do socket do Docker, só leitura, para o promtail.
  #
  # O promtail processa log de todos os containers — conteúdo que vem de fora
  # (webhook, mensagem de WhatsApp, requisição HTTP). Com o `docker.sock`
  # montado, uma falha nele dava controle total do Docker, isto é, root no
  # host; o `:ro` na montagem não muda isso, o socket aceita qualquer comando.
  # Pelo proxy ele só lista containers e redes e lê logs: `POST` desligado, e
  # nada de exec, imagens, volumes ou sistema.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_proxy]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [smart_core_v2_observability, smart_core_v2_mcp_telemetria]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  tempo:
    # Pinada (nao ":latest"): a tag "latest" no Docker Hub aponta hoje para o
    # v3.0.0, que substituiu o "compactor:" monolitico por uma arquitetura
    # backend-scheduler/backend-worker incompativel com o config abaixo (o
    # container entra em crash loop: "field compactor not found in type
    # app.Config"). 2.10.8 e a ultima release estavel da serie 2.x, onde
    # "compactor.compaction.block_retention" (tempo-config.yml) funciona.
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    # Retencao explicita: sem "command", o entrypoint usa so os defaults da
    # imagem. Declarar aqui documenta a decisao (14 dias, ver P5 do plano de
    # observabilidade) e blinda contra mudanca de default em versao futura.
    # Atencao: declarar "command" SUBSTITUI o do entrypoint por inteiro, entao
    # os caminhos padrao de config/storage precisam ser repetidos.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    # Só na ponte do Docker: quem fala com o Grafana é o Caddy da borda, por
    # `host.docker.internal`. Publicado em 0.0.0.0, a porta 3000 ficava aberta
    # para a internet em HTTP puro — a senha de login trafegava sem TLS, e o
    # Docker publica por cima do UFW.
    ports:
      - "${HOST_BRIDGE_IP:-172.17.0.1}:3000:3000"
    environment:
      # Destino dos alertas. O provisionamento (`provisioning/alerting/
      # contact-points.yml`) lê estas variáveis; elas precisam SEMPRE existir,
      # senão o Grafana falha ao provisionar. Os defaults abaixo não entregam
      # nada — são só para a stack subir. Aponte o webhook para um canal real
      # (Discord/Slack/n8n) ou configure o SMTP; sem isso as regras disparam e
      # ninguém fica sabendo.
      SMARTCORE_ALERTA_WEBHOOK_URL: ${SMARTCORE_ALERTA_WEBHOOK_URL:-http://localhost:9/alerta-nao-configurado}
      SMARTCORE_ALERTA_EMAIL: ${SMARTCORE_ALERTA_EMAIL:-ops@smartcore.local}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      # Sem isto o usuario admin nasce com senha ninguem-definiu e, como o
      # Grafana fica exposto publicamente pelo Caddy, vira admin/admin de fato.
      # O ":?" e proposital: falta a variavel, a stack NAO sobe, em vez de
      # subir insegura em silencio.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?defina no .env}
      GF_SERVER_ROOT_URL: https://grafana.smartcoreassistant.com.br
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [smart_core_v2_observability]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.8
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    # Docker só pelo `docker-proxy` (ver acima), nunca pelo socket.
    networks: [smart_core_v2_observability, docker_proxy]
    depends_on: [docker-proxy]
    restart: unless-stopped

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
