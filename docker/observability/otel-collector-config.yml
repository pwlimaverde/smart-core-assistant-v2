receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Primeiro da fila em todo pipeline: com o teto de 256m do container
  # (compose.yml, decisão D1), o collector passa a recusar dados (o SDK refaz)
  # antes de o kernel matá-lo por OOM — o que derrubaria a telemetria inteira.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    send_batch_size: 1000
    timeout: 1s
    send_batch_max_size: 2000

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Sem "namespace": os nomes de métrica já nascem com o prefixo "smartcore_"
    # no código da aplicação (ex.: smartcore_rpc_duration_ms); um namespace aqui
    # duplicaria o prefixo (smartcore_smartcore_...) e quebraria as queries dos
    # dashboards provisionados (N1.4).
    # add_metric_suffixes: false — sem isto o exporter acrescenta o sufixo da
    # unidade (ex.: smartcore_rpc_duration_ms_milliseconds_bucket), quebrando o
    # dashboard latencia_grpc.json, que consulta smartcore_rpc_duration_ms_bucket.
    add_metric_suffixes: false
    # resource_to_telemetry_conversion: converte o atributo de recurso
    # "service.name" (setado por observability::init_telemetry por binário) em
    # label "service_name" nas métricas — sem isso, métricas de worker/
    # data_postgres/data_whatsapp etc. ficam indistinguíveis entre si no Prometheus.
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
