receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 1s
    send_batch_max_size: 2000

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Sem "namespace": os nomes de métrica já nascem com o prefixo "smartcore_"
    # no código da aplicação (ex.: smartcore_rpc_duration_ms); um namespace aqui
    # duplicaria o prefixo (smartcore_smartcore_...) e quebraria as queries dos
    # dashboards provisionados (N1.4).
    # resource_to_telemetry_conversion: converte o atributo de recurso
    # "service.name" (setado por observability::init_telemetry por binário) em
    # label "service_name" nas métricas — sem isso, métricas de worker/
    # data_postgres/data_whatsapp etc. ficam indistinguíveis entre si no Prometheus.
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
