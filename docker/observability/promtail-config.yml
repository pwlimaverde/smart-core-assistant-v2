server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Em volume (compose: promtail_positions): em /tmp, todo recreate do promtail
  # relia os arquivos do início — no job deploy_markers isso duplicava eventos.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Descoberta via Docker SD (socket), nao mais static_configs com glob de
  # arquivo. Motivo: o glob antigo (/var/lib/docker/containers/*/*-json.log)
  # so tinha o hash do container como identificador (label "filename"), que
  # muda a cada recriacao — junto com a retencao de 14 dias (P5), isso incha
  # o indice do Loki com um label novo por deploy. Docker SD tambem entrega o
  # log ja decodificado (sem precisar de "tag" no log-opts do daemon, que
  # nunca foi configurado — por isso image_name/image_tag saiam vazios e o
  # Promtail os descartava).
  - job_name: containers
    docker_sd_configs:
      # Pelo proxy só leitura da stack, não pelo socket (ver `docker-proxy`
      # no compose).
      - host: tcp://docker-proxy:2375
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # job=containerlogs mantido por compatibilidade com o dashboard
      # audit_log.json, que seleciona {job="containerlogs"} e faz "| json"
      # em cima do conteudo da linha (log estruturado da aplicacao).
      - static_labels:
          job: containerlogs

  # Marcadores de deploy (plano servidor-reestruturacao-dev-prod, R6): uma linha
  # logfmt por deploy/rollback, escrita por infra/deploy/lib.sh (marcador) e
  # infra/deploy/deploy-infra.sh (marca). Viram anotações no painel "Deploys".
  #
  # Os arquivos entram montados UM A UM no compose (nunca o diretório
  # /opt/smartcore/<env>): ao lado deles mora o <env>.env com os segredos, e o
  # promtail processa conteúdo vindo de fora.
  - job_name: deploy_markers
    # `env` vem do arquivo, não da linha: os marcadores da infra compartilhada
    # (borda, observabilidade, Evolution) não têm `env=`.
    static_configs:
      - targets: [localhost]
        labels: {job: deploy_markers, env: dev, __path__: /var/log/smartcore/deploys-dev.log}
      - targets: [localhost]
        labels: {job: deploy_markers, env: prod, __path__: /var/log/smartcore/deploys-prod.log}
      - targets: [localhost]
        labels: {job: deploy_markers, env: infra, __path__: /var/log/smartcore/deploys-infra.log}
    pipeline_stages:
      - logfmt:
          mapping:
            ts:
            event:
            componente:
            status:
      # Cardinalidade baixa: poucos eventos, componentes e status. `version`,
      # `sha` e `run` ficam no corpo da linha (um stream por release incharia o
      # índice do Loki).
      - labels:
          event:
          componente:
          status:
      # O horário do evento é o do deploy, não o da leitura pelo promtail.
      - timestamp:
          source: ts
          format: RFC3339
