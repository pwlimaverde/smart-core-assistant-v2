server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Descoberta via Docker SD (socket), nao mais static_configs com glob de
  # arquivo. Motivo: o glob antigo (/var/lib/docker/containers/*/*-json.log)
  # so tinha o hash do container como identificador (label "filename"), que
  # muda a cada recriacao — junto com a retencao de 14 dias (P5), isso incha
  # o indice do Loki com um label novo por deploy. Docker SD tambem entrega o
  # log ja decodificado (sem precisar de "tag" no log-opts do daemon, que
  # nunca foi configurado — por isso image_name/image_tag saiam vazios e o
  # Promtail os descartava).
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # job=containerlogs mantido por compatibilidade com o dashboard
      # audit_log.json, que seleciona {job="containerlogs"} e faz "| json"
      # em cima do conteudo da linha (log estruturado da aplicacao).
      - static_labels:
          job: containerlogs
