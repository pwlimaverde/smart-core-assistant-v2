apiVersion: 1

# Contact point básico (N1.4). Placeholder: troque o endereço por um canal real
# (e-mail de plantão, webhook do Slack/PagerDuty, etc.) antes de depender deste
# alerta em produção — o objetivo aqui é ter o roteamento provisionado como
# código, não configurar o canal definitivo de notificação.
contactPoints:
  - orgId: 1
    name: smartcore-default
    receivers:
      - uid: smartcore-default-email
        type: email
        settings:
          addresses: ops@smartcore.local
          singleEmail: true
        disableResolveMessage: false
