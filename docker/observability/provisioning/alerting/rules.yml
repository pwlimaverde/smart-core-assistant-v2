apiVersion: 1

# Regras de alerta provisionadas como código (N1.4). Recursos provisionados não
# são editáveis pela UI; recarregar via restart do Grafana ou Admin API.
# Padrão de 3 estágios por regra (query A -> reduce B -> threshold C), igual ao
# que o editor de alertas do Grafana gera: `condition` sempre aponta para o
# estágio de threshold.
groups:
  - orgId: 1
    name: smartcore-core
    folder: smartcore
    interval: 60s
    rules:
      - uid: outbox-backlog-alto
        title: Backlog de outbox alto
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        labels:
          severidade: critica
        annotations:
          resumo: "Outbox do PostgreSQL acumulando eventos não publicados (OutboxRelay possivelmente parado ou Redis indisponível)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "smartcore_outbox_backlog"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [100]

      - uid: bus-pending-alto
        title: Lag do bus (PEL do Redis Streams) alto
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        labels:
          severidade: critica
        annotations:
          resumo: "Mensagens pendentes na PEL do Redis Streams acima do limiar — consumidores (worker/data_postgres) possivelmente travados ou lentos."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "smartcore_bus_pending"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [500]

      - uid: servico-fora-do-ar
        title: Servico fora do ar ou nao saudavel
        condition: C
        for: 2m
        # As métricas chegam por push (OTLP): quando um serviço morre, a série
        # dele SOME em vez de ir a zero, e um alerta comum nunca dispararia. Duas
        # defesas: o `smartcore_service_up` é publicado pelo watchdog (que está
        # vivo e publica o zero de verdade) e, se o próprio watchdog cair,
        # `noDataState: Alerting` transforma o silêncio em alarme.
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severidade: critica
        annotations:
          resumo: "Um ou mais servicos da stack estao parados ou com healthcheck falhando. Se nao houver dado nenhum, o proprio watchdog pode ter caido."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "min(smartcore_service_up)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: backup-do-banco-atrasado
        title: Backup do banco atrasado
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severidade: critica
        annotations:
          resumo: "O servico pg_backup nao concluiu backup dentro da janela. Backup que falha em silencio so e descoberto na hora de restaurar."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              # O healthcheck do container do backup verifica a idade do último
              # sucesso; o watchdog traduz isso para `smartcore_service_up`.
              expr: "min(smartcore_service_up{servico=\"pg_backup\"})"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: taxa-erro-grpc-alta
        title: Taxa de erro gRPC/RPC interna alta
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        labels:
          severidade: alta
        annotations:
          resumo: "Mais de 5% das chamadas RPC internas (transport::Server) estão falhando nos últimos 5 minutos."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              # "or vector(0)" e obrigatorio aqui: smartcore_rpc_total{error="true"}
              # so existe como serie depois do primeiro erro (contador Prometheus
              # nao vem pre-inicializado por valor de label). Sem isso, um sistema
              # saudavel (zero erros desde o boot) faz o numerador sumir e a regra
              # fica em NoData para sempre — foi o que aconteceu na pratica desde
              # 2026-08-01, e teria virado spam de e-mail assim que o SMTP (P4)
              # foi ligado.
              expr: "100 * (sum(rate(smartcore_rpc_total{error=\"true\"}[5m])) or vector(0)) / sum(rate(smartcore_rpc_total[5m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      # ---------------------------------------------------------------------
      # N13 — Agentes de IA (servidor MCP)
      # ---------------------------------------------------------------------
      # Duas regras, dois riscos distintos. Nenhuma delas usa `grant_id` como
      # label: identificador em métrica explode a série temporal. O alerta diz
      # QUE algo está errado; QUEM está no `audit_log` com `source: "mcp"`.

      - uid: mcp-recusas-anomalas
        title: Pico de recusas no servidor MCP
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severidade: alta
        annotations:
          resumo: >-
            Mais de 30 recusas por minuto no servidor MCP nos últimos 5 minutos.
            É a assinatura de um agente em laço ou de um token vazado sendo
            sondado. Veja o dashboard "Agentes de IA (MCP)" e, para saber qual
            aplicativo, o audit_log com source=mcp.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              # `or vector(0)` pelo mesmo motivo da regra de erro gRPC acima: o
              # contador de recusas só passa a existir como série depois da
              # primeira recusa. Sem isso, um sistema saudável fica em NoData
              # para sempre e a regra nunca dispara quando precisar.
              expr: "sum(rate(smartcore_mcp_denied_total[5m])) * 60 or vector(0)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [30]

      - uid: mcp-destrutivas-em-volume
        title: Volume anômalo de ações destrutivas por agente de IA
        condition: C
        # Sem `for`: o teto por consentimento é 5/min e 30/dia. Passar de 10 numa
        # hora já significa que alguém (ou vários) está removendo coisas em série,
        # e esperar cinco minutos para avisar não ajuda ninguém.
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          severidade: alta
        annotations:
          resumo: >-
            Mais de 10 ações destrutivas executadas por agentes de IA na última
            hora (desativar/remover). Em operação normal este número fica perto
            de zero. Confira no audit_log quais consentimentos executaram e, se
            não reconhecer, desconecte o aplicativo na tela do tenant.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: "sum(increase(smartcore_mcp_tool_total{tool=~\"desativar_.*|remover_.*\",result=\"ok\"}[1h])) or vector(0)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
