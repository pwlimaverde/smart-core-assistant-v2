stream_over_http: true
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:3200

ingester:
  max_block_duration: 5m

compactor:
  ring:
    kvstore:
      store: memberlist
  compaction:
    block_size_bytes: 524288000
    compacted_block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
