# Stack do releases_server (fora do deploy automático: sobe à mão no VPS).
#   cd /opt/smartcore/releases-stack && docker compose --env-file .env up -d
# O diretório de dados fica FORA da pasta do compose: nada de .env, logs ou
# scripts dentro do que o servidor serve (achado G5).
services:
  releases-server:
    image: ${RELEASES_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-v2-releases:latest}
    container_name: smart-core-v2-releases
    restart: unless-stopped
    environment:
      RELEASES_DIR: /data/releases
      RELEASES_UPLOAD_TOKEN: ${RELEASES_UPLOAD_TOKEN:?defina RELEASES_UPLOAD_TOKEN no .env}
      RELEASES_DOWNLOAD_SECRET: ${RELEASES_DOWNLOAD_SECRET:-}
      RELEASES_MAX_UPLOAD_MB: ${RELEASES_MAX_UPLOAD_MB:-500}
      RUST_LOG: releases_server=info,tower_http=info
    ports:
      # Só na ponte do Docker: a borda (Caddy em container) chega por
      # host.docker.internal; a internet não, mesmo com UFW aberto.
      - "${HOST_BRIDGE_IP:-172.17.0.1}:${RELEASES_HOST_PORT:-8086}:8086"
    volumes:
      # Leitura E escrita: o POST /upload grava feed, instaladores e manifesto.
      # O dono precisa ser o uid 10001 (usuário da imagem):
      #   sudo chown -R 10001 /opt/smartcore/releases-data
      - /opt/smartcore/releases-data:/data/releases
    mem_limit: 128m
