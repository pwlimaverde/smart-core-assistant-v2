# =============================================================================
# Overlay DEV — aplicado sobre docker-compose.base.yml
# =============================================================================
# Só o que a dev tem e a prod não. Portas, tetos e retenção vêm de dev.vars.
# Qualquer outra diferença entre ambientes é defeito: o lugar dela é a base.
# Logging do MinIO usa a mesma âncora da base, redeclarada aqui porque âncoras
# YAML não atravessam arquivos.
# =============================================================================
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  # Storage de midia local (dev). Em prod usa-se R2 (sem MinIO).
  minio:
    # quay.io, nao Docker Hub: a MinIO parou de publicar lá e em 2026-09-11 o
    # `docker compose pull` do deploy passou a falhar com "pull access denied for
    # minio/mc, repository does not exist". A stack continuava de pé porque a
    # imagem estava no disco desde 2025-09-07 — o deploy e que morria, e levava
    # com ele qualquer correcao que estivesse na fila.
    #
    # Tag fixa, nao `latest`: foi o `latest` que deixou isto apodrecer em
    # silencio por semanas. Esta e exatamente a versao que já roda aqui, então a
    # troca de registro nao muda comportamento nenhum.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # Em 25/09/2026 o quay.io passou a responder 401 para os repositórios da
    # MinIO: a imagem saiu do ar publicamente e o `compose pull` do deploy
    # falhava inteiro por causa dela. `missing` usa a cópia que já está em
    # disco. Numa máquina nova não há cópia: ali é preciso trocar a origem.
    pull_policy: missing
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [internal]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_MINIO:-512m}

  # Provisiona o bucket no MinIO. Sem ele, o data_storage entra em crash-loop num
  # volume novo ("bucket inexistente"). One-off idempotente.
  minio-setup:
    # Mesmo motivo do `minio` acima. A tag mais nova disponivel no quay e uma
    # semana posterior a que estava em disco; o `mc` aqui so cria bucket.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: missing # ver `minio` acima
    depends_on:
      minio: { condition: service_started }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-media-smart-core-assistant}
    networks: [internal]
    restart: "no"
    logging: *logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break
          echo "aguardando minio... ($$i)"; sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET pronto"

volumes:
  minio_data:
