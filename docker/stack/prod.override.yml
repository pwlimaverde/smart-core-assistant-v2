# =============================================================================
# Overlay PROD — aplicado sobre docker-compose.base.yml
# =============================================================================
# Só o que a prod tem de diferente. Portas, redes de telemetria, tetos e
# retenção vêm de prod.vars; storage é Cloudflare R2 pelo prod.env (sem MinIO).
# =============================================================================
services:
  data_postgres:
    healthcheck:
      # O banco de prod é maior: as migrations de uma release levam mais tempo
      # antes de o consumidor do barramento começar a bater.
      start_period: 180s

  # ISOLAMENTO DO WEBHOOK DO WHATSAPP (incidente de 2026-11-22, correção v0.2.2).
  #
  # A `evolution_net` é uma rede ÚNICA, compartilhada pelos dois ambientes. Nela
  # o nome `webhook_ingress` resolve para os containers dos DOIS: no primeiro
  # deploy da v0.2.0 o Evolution entregou os webhooks do tenant da dev no
  # webhook_ingress da PROD (250 eventos recusados só pela FK de audit_log) e a
  # dev ficou sem mensagens.
  #
  # Correção: a prod NÃO entra na evolution_net com o ingress (o nome continua
  # sendo só da dev, sem re-registrar as instâncias de lá) e registra no
  # Evolution uma URL que só ela responde — a porta própria dela (prod.vars:
  # WEBHOOK_INGRESS_PORT) publicada na ponte do Docker, a mesma por onde a borda
  # já alcança a prod. 172.17.0.1 não é roteável de fora da VPS. Verificado em
  # 2026-11-22: o container do Evolution alcança 172.17.0.1.
  #
  # A dev segue no padrão (`http://webhook_ingress:9200`) — nada muda lá.
  #
  # Cutover para o provider_edge (ADR adr-intermediario-webhooks-provedores.md,
  # §5) — INATIVO, só depois do deploy-infra aprovado e da dev estável. Trocar a
  # linha abaixo por:
  #   WEBHOOK_INGRESS_URL: http://provider_edge:8088/prod
  # A porta própria da prod na ponte continua publicada: é o destino `prod` que
  # o provider_edge usa (PROVIDER_EDGE_DESTINOS). O deploy.sh (passo 3b) recusa
  # o deploy com essa URL enquanto o provider_edge não estiver healthy e
  # atendendo `/prod`.
  data_whatsapp:
    environment:
      WEBHOOK_INGRESS_URL: http://${HOST_BRIDGE_IP:-172.17.0.1}:${WEBHOOK_INGRESS_PORT:?WEBHOOK_INGRESS_PORT ausente (prod.vars)}

  webhook_ingress:
    networks: !override [internal, observability]
    ports: !override
      - "${HOST_BRIDGE_IP:-172.17.0.1}:${WEBHOOK_INGRESS_PORT:?WEBHOOK_INGRESS_PORT ausente (prod.vars)}:9200"
