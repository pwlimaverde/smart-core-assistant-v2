[project]
name = "ia_engine"
version = "0.1.0"
description = "Serviço gRPC de IA (RAG, análise de mídia, sentimento) do Smart Core Assistant v2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "py-return-success-or-error>=1.0.0",
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "protobuf>=5.28",
    "langchain>=1.0",
    "langchain-openai>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "loguru>=0.7",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["src/ia_engine/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompts de conteúdo (texto literal) excedem a largura de linha por design.
"src/ia_engine/features/sentimento/datasources/sentimento_datasource.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Cobertura (pytest-cov). Medição é bússola, não meta cega (ver testing-strategy).
# Os stubs gRPC gerados (contracts) ficam de fora — não são código nosso.
[tool.coverage.run]
source = ["ia_engine"]
branch = true
omit = [
    "src/ia_engine/contracts/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["src/ia_engine/contracts"]
