[project]
name = "ia_engine"
version = "0.1.0"
description = "Serviço gRPC de IA (RAG, análise de mídia, sentimento) do Smart Core Assistant v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "protobuf>=5.28",
    "langchain>=1.0",
    "langchain-openai>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "loguru>=0.7",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/ia_engine/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompts de conteúdo (texto literal) excedem a largura de linha por design.
"src/ia_engine/features/sentimento.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/ia_engine/contracts"]
