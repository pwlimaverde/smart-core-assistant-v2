[project]
name = "mcp_server"
version = "0.1.0"
description = "Servidor MCP do Smart Core Assistant v2 — permite a agentes de IA externos (Claude, ChatGPT, Cursor) configurar e operar o tenant do usuário"
readme = "README.md"
requires-python = ">=3.13"
# NÃO é cópia do pyproject do ia_engine. O SDK `mcp` 2.x arrasta um conjunto
# próprio (httpx2 — que é major novo, não o httpx 0.x —, starlette, uvicorn,
# sse-starlette, pyjwt[crypto], opentelemetry-api, jsonschema, python-multipart)
# e exige `pydantic>=2.12`, acima do piso do ia_engine. Compartilhar o lock dos
# dois módulos travaria um dos lados na primeira divergência.
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    # 1.82.0 foi *yanked* no PyPI; o piso precisa ser 1.82.1.
    "grpcio>=1.82.1",
    "grpcio-health-checking>=1.82.1",
    "protobuf>=5.28",
    "loguru>=0.7",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-grpc>=0.49b0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.82.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["src/mcp_server/grpc/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_server"]
branch = true
omit = [
    "src/mcp_server/grpc/contracts/*",
    "*/__main__.py",
    # Mesmo recorte do ia_engine: bootstrap de processo, resolução de env e
    # pipeline OTLP são cola, não domínio.
    "src/mcp_server/server.py",
    "src/mcp_server/settings.py",
    "src/mcp_server/telemetry.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["src/mcp_server/grpc/contracts"]
