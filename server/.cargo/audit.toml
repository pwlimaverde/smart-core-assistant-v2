# Configuração do `cargo audit` (job "Dependências — advisories RustSec" do CI).
#
# O `cargo audit` lê o `Cargo.lock` inteiro, e o lock inclui dependências
# OPCIONAIS que nenhuma feature ativa — elas são resolvidas, mas nunca
# compiladas. Por isso um advisory aqui não significa, por si só, código
# vulnerável no binário.
#
# Regra da casa: só entra nesta lista o que for comprovadamente não compilado
# (verificável com `cargo tree`), e sempre com a prova ao lado. Vulnerabilidade
# em código que roda se corrige atualizando, não ignorando.

# ---------------------------------------------------------------------------
# CORRIGIDO em 24/11/2026 — RUSTSEC-2026-0459 (libsqlite3-sys 0.37 -> 0.40)
#                          e RUSTSEC-2026-0592 (url 2.5.8 -> 2.5.9)
#
# 0459: SQLite embutido antes do 3.54.0 podia devolver memória não
# inicializada ao abrir banco com `-wal` de tamanho de página diferente.
# Chegava por `local_engine` -> `sqlx` (feature `sqlite`) -> `sqlx-sqlite`.
# Destravou quando o `sqlx-sqlite 0.9.1` subiu o limite para
# `libsqlite3-sys < 0.41`. O `sqlx = "=0.9.1"` trava todos os subcrates, então
# `sqlx-core`/`sqlx-postgres` dos serviços também foram de 0.9.0 para 0.9.1.
#
# 0592: `Url::origin()` estourava a pilha com `blob:` aninhado. Nenhum código
# do workspace chama `Url::origin()`; corrigido mesmo assim por caber no lock.
#
# O que mudou: só `server/Cargo.lock` e
# `clients/packages/local_engine_ffi/rust/Cargo.lock` (`cargo update -p url
# -p sqlx -p libsqlite3-sys`). No lock do FFI o `sqlx-postgres 0.9.1` exigiu
# `web-sys >= 0.3.77`, o que levou a família `wasm-bindgen` de 0.2.92 para
# 0.2.130; ela só entra no alvo wasm (`cargo tree --target
# x86_64-pc-windows-msvc -i wasm-bindgen` responde "nothing to print"), mas o
# instalador deve ser ensaiado em `ci/release-windows-*` antes de um `win-v*`.
#
# Dono: dono do produto. Este bloco é só registro; pode ser apagado na
# próxima revisão (11/12/2026).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# AVISOS PERMITIDOS, SEM EXCEÇÃO DE PROPÓSITO (registrados em 13/11/2026)
#
# O `cargo audit` separa "vulnerabilidade" (reprova o job) de "aviso" (só
# lista: `unsound` e `yanked`). Os cinco avisos abaixo aparecem no CI da `dev`
# (execução 43107056175, 11/11/2026) como "5 allowed warnings found". Nenhum
# entra na lista `ignore`: a entrada esconderia o aviso do log, e o que os
# resolve é atualizar a dependência. Ficam aqui para ninguém precisar
# redescobrir o que são.
#
# Por que não foram corrigidos junto com o plano de vínculo contato ↔ cliente:
# a correção é mexer no `Cargo.lock`. Subir `tokio` troca o runtime de TODOS
# os serviços do servidor e do `local_engine`; é uma mudança de plataforma,
# com a sua própria rodada de CI, ensaio na dev e do instalador — fora do
# escopo de um plano de cadastro. Os demais vão na mesma atualização.
#
# Dono: dono do produto (mantenedor do repositório).
# Próxima revisão: 11/12/2026, ou antes, na primeira atualização de
# dependências do workspace.
#
# 1. RUSTSEC-2026-0386 — tokio 1.52.3 — `unsound`
#    "`AsyncFd::new` and related constructors violate I/O safety."
#    Corrigido em `>=1.51.6, <1.52.0` ou `>=1.53.3`.
#    Exposição: nenhum código do workspace chama `AsyncFd` (conferido com
#    busca por `AsyncFd` em `server/apps`, `server/crates` e
#    `clients/packages/local_engine_ffi/rust/src`). O aviso é sobre uma API
#    que permite uso incorreto, não sobre um caminho que os serviços executam.
#    Correção: em `server/`, `cargo update -p tokio` (conferir no lock
#    `tokio >= 1.53.3`); repetir em `clients/packages/local_engine_ffi/rust/`,
#    que tem lock próprio; CI completa, deploy na dev e ensaio do instalador.
#
# 2. RUSTSEC-2026-0486 — rustix 1.1.4 — `unsound`
#    "xattr functions mark unwritten bytes as initialized when given a
#    zero-length buffer." Corrigido em `>=1.1.6`.
#    Por onde chega: só pelo `tempfile 3.27.0` (`native-tls`, `prost-build`,
#    `tonic-prost-build` e o `releases_server`). Nenhum código do workspace
#    chama as funções de xattr do `rustix`.
#    Correção: `cargo update -p rustix` (conferir no lock `rustix >= 1.1.6`),
#    na mesma atualização do tokio.
#
# 3. chacha20 0.10.0 — `yanked` (sem ID: versão retirada do crates.io pelo
#    autor, não é advisory). Chega pelo `rand 0.10.1` (`sqlx-postgres`,
#    `quinn-proto`, `tokio-retry`).
#    Correção: `cargo update -p chacha20`.
#
# 4. spin 0.9.8 — `yanked` (sem ID). Chega pelo `flume 0.12.0`
#    (`sqlx-sqlite`) e pelo `multer 3.1.0` (`axum`).
#    Correção: `cargo update -p spin@0.9.8`.
#
# 5. spin 0.10.0 — `yanked` (sem ID). Chega pelo `crc-fast 1.10.0`
#    (`aws-smithy-checksums` -> `aws-sdk-s3`).
#    Correção: `cargo update -p spin@0.10.0`.
#
# Versão retirada continua baixando enquanto estiver no lock; o risco é o
# motivo da retirada, que o crates.io não informa. Por isso a correção é
# atualizar, e não há o que "aceitar" além do prazo acima.
#
# Ao corrigir: apagar o item daqui. Se sobrar só o cabeçalho, apagar o bloco.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CORRIGIDO em 13/11/2026 — RUSTSEC-2026-0538 (quinn-udp 0.5.15 -> 0.5.16)
#
# O que era: em alvos que leem um datagrama por `recvmsg` (Apple sem
# `fast-apple-datapath`, OpenBSD, NetBSD, Solaris, illumos), o laço de
# recepção podia girar sem parar depois de um datagrama truncado — negação de
# serviço remota. Linux, Android, FreeBSD e Windows não são afetados.
#
# Aparecia como vulnerabilidade no job de advisories (CI 43522852110 da `dev`,
# 13/11/2026), ao lado do RUSTSEC-2026-0459, e não tinha registro aqui.
#
# Por onde chega: `reqwest 0.12.28` -> `quinn 0.11.11` -> `quinn-udp`, atrás
# da feature `http3` do `reqwest`, que este workspace não liga. Prova de que
# NÃO é compilado: `cargo tree --target all -i quinn-udp` responde "nothing to
# print". Mesmo assim foi corrigido, e não ignorado: a correção cabia no lock.
#
# O que mudou: só a entrada do `quinn-udp` no `server/Cargo.lock` (versão e
# checksum), 0.5.15 -> 0.5.16, a menor versão corrigida; o `quinn 0.11.11`
# aceita. Nenhuma outra dependência mudou. O `cargo update -p quinn-udp
# --precise 0.5.16` puro também rebaixava `socket2` e `windows-sys` de outras
# crates (`hyper-util`, `rustix`, `tempfile`, `errno`); essas linhas foram
# mantidas como estavam, e o `cargo` aceita o lock com `--locked`.
# O lock de `clients/packages/local_engine_ffi/rust/` não tem `quinn-udp`.
#
# Conferência: `cargo audit` em `server/` não lista mais o 0538.
# Dono: dono do produto (mantenedor do repositório). Este bloco é só registro;
# pode ser apagado na próxima revisão (11/12/2026).
# ---------------------------------------------------------------------------

[advisories]
ignore = [
    # rkyv 0.7.46 — leitura fora dos limites em arquivos com Rc/Arc.
    #
    # Chega pelo `rust_decimal` como dependência OPCIONAL, atrás da feature
    # `rkyv`, que este workspace não liga (usamos apenas `serde-with-str`).
    #
    # Prova: `cargo tree -i rkyv` responde "nothing to print" — não há caminho
    # até ele no grafo de build; e `cargo tree -p rust_decimal -e features` não
    # lista `rkyv` entre as features ativas.
    #
    # A correção de verdade (upgrade para >=0.8.17) depende do `rust_decimal`
    # publicar uma versão que use o rkyv novo. REVISAR a cada bump dessa crate:
    # se algum dia a feature for ligada, o advisory passa a valer e esta entrada
    # tem de sair.
    "RUSTSEC-2026-0235",
]
