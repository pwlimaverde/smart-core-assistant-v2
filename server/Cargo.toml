[workspace]
resolver = "2"
members = [
    "crates/error_core",
    "crates/infrastructure_postgres",
    "crates/infrastructure_redis",
    "crates/observability",
    "crates/test_support",
    "crates/contracts",
    "crates/transport",
    "crates/infrastructure_storage",
    "crates/application",
    "crates/domain_whatsapp",
    "apps/data_postgres",
    "apps/data_redis",
    "apps/data_storage",
    "apps/runtime_api",
    "apps/worker",
    "apps/control_plane",
    "crates/infrastructure_messaging",
    "crates/infrastructure_evolution",
    "apps/webhook_ingress",
    "apps/data_whatsapp",
    "apps/healthcheck",
    "apps/watchdog",
    "crates/local_engine",
]

[workspace.package]
edition = "2021"
license = "Proprietary"

# -----------------------------------------------------------------------------
# Perfis de compilação — controle de tamanho do target/
#
# debug = 1  → só tabelas de linha (stack traces funcionam, .pdb bem menores)
# debug = 2  → debug completo (padrão Rust, causa .pdb gigantes)
# split-debuginfo = "packed" → agrupa símbolos num único .pdb por crate
# -----------------------------------------------------------------------------
[profile.dev]
debug = 1
split-debuginfo = "packed"

[profile.test]
debug = 1
split-debuginfo = "packed"

[workspace.dependencies]
sqlx = { version = "0.9", features = [
    "postgres", "runtime-tokio", "tls-rustls", "macros",
    "migrate", "uuid", "chrono", "rust_decimal", "json",
] }
pgvector      = { version = "0.4", features = ["sqlx"] }
dashmap       = "6.1.0"
aes-gcm       = "0.10.3"
rust_decimal  = { version = "1.36.0", features = ["serde-with-str"] }
chrono        = { version = "0.4", features = ["serde"] }
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
thiserror     = "1.0"
tokio         = { version = "1.38", features = ["full"] }
tracing       = "0.1.40"
uuid          = { version = "1.0", features = ["v4", "v7", "serde"] }
async-trait   = "0.1.83"
mockall       = "0.13"
base64        = "0.22.1"
secrecy       = "0.10.3"
subtle        = "2.5"
argon2        = { version = "0.5", features = ["std"] }
redis         = { version = "0.25.0", features = ["aio", "tokio-comp", "connection-manager", "streams"] }
tonic         = "0.14.6"
tonic-prost   = "0.14.6"
tonic-web     = "0.14.1"
tower-http    = { version = "0.6", features = ["cors"] }
tower         = "0.5"
http          = "1"
error_core    = { path = "crates/error_core" }
tracing-subscriber = "0.3.18"
flatbuffers   = "25.0.0"
prost         = "0.14.3"
tonic-prost-build = "0.14.6"
flatc-rust    = "0.2.0"
contracts     = { path = "crates/contracts" }
transport     = { path = "crates/transport" }
application   = { path = "crates/application" }
observability = { path = "crates/observability" }
anyhow        = "1.0.86"
bytes         = "1.6.0"
futures-util  = "0.3.30"
# Sem a feature default `rustls`: ela liga o cliente HTTP LEGADO
# (aws-smithy-http-client/legacy-rustls-ring -> hyper 0.14 + rustls 0.21 +
# rustls-webpki 0.101.7, com RUSTSEC-2026-0098/0099/0104). O cliente que o SDK
# realmente usa aqui vem de `default-https-client` (hyper 1.x + rustls 0.23 +
# webpki 0.103.x), porque `criar_cliente_com_config` nao chama `.http_client(..)`
# e deixa o SDK escolher o default. As outras features default sao mantidas.
aws-sdk-s3    = { version = "1", default-features = false, features = [
    "sigv4a", "http-1x", "default-https-client", "rt-tokio",
    "behavior-version-latest",
] }
jsonwebtoken  = "9.3.0"
sha2          = "0.10.8"
rand_core     = { version = "0.6", features = ["std"] }

