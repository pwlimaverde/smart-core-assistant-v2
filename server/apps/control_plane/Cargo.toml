[package]
name = "control_plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
secrecy = { workspace = true }
redis = { workspace = true }
contracts = { workspace = true }
transport = { workspace = true }
error_core = { workspace = true }
observability = { workspace = true }
tracing = { workspace = true }

# Authorization server OAuth 2.1 do módulo MCP (N13.1). É a primeira superfície
# HTTP deste serviço: até aqui ele só atendia RPC interno pelo `transport`.
application  = { workspace = true }
axum         = "0.8"
# `axum::Form` usa `serde_urlencoded`, que NAO junta chave repetida num `Vec`:
# um formulario com varias caixas `name="escopos"` chega como `escopos=a&escopos=b`
# e falha com "invalid type: string, expected a sequence". O `Form` do
# axum-extra usa `serde_html_form`, que trata chave repetida — e e por isso que
# esta dependencia existe.
axum-extra   = { version = "0.10", features = ["form"] }
jsonwebtoken = { workspace = true }
sha2         = { workspace = true }
base64       = { workspace = true }
subtle       = { workspace = true }
thiserror    = { workspace = true }
url          = "2"
# Só para buscar o Client ID Metadata Document do cliente MCP (com a guarda
# anti-SSRF de `oauth/cimd.rs`). `rustls-tls` em vez do default `native-tls`: a
# imagem final é slim e não carrega OpenSSL.
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# O mesmo desserializador que o `axum-extra` usa por baixo. O teste de regressao
# do consentimento chama-o direto: testar contra `serde_urlencoded` passaria a
# mentir no dia em que alguem revertesse o `Form`.
serde_html_form = "0.2"

