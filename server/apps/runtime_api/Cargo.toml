[package]
name = "runtime_api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }

contracts = { workspace = true }
transport = { workspace = true }
error_core = { workspace = true }
observability = { workspace = true }
application = { workspace = true }
ia_client = { workspace = true }
infrastructure_redis = { path = "../../crates/infrastructure_redis" }
redis = { workspace = true }
tracing = { workspace = true }
tokio-stream = "0.1"

# Fachada gRPC-Web da borda do browser (Frente A do login-module).
tonic = { workspace = true }
tonic-web = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }

[dev-dependencies]
# A feature `mock` só entra na compilação de teste: o binário de produção não
# carrega mockall.
ia_client = { workspace = true, features = ["mock"] }
