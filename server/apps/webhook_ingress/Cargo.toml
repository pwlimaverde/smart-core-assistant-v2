[package]
name = "webhook_ingress"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "webhook_ingress"
path = "src/main.rs"

[dependencies]
contracts                = { workspace = true }
transport                = { workspace = true }
error_core               = { workspace = true }
observability            = { workspace = true }
infrastructure_messaging = { path = "../../crates/infrastructure_messaging" }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
redis      = { workspace = true }
uuid       = { workspace = true }
anyhow     = { workspace = true }
axum       = "0.8"
chrono     = { workspace = true }
secrecy    = { workspace = true }
# Cloud API da Meta: assinatura X-Hub-Signature-256 (HMAC-SHA256) e o
# aperto de mão em tempo constante.
hmac       = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
subtle     = { workspace = true }

[dev-dependencies]
# O teste da tradução da Meta usa o MESMO parser do worker.
domain_whatsapp = { path = "../../crates/domain_whatsapp" }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
