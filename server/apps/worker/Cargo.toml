[package]
name = "worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
redis = { workspace = true }
tonic = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }

contracts = { workspace = true }
transport = { workspace = true }
error_core = { workspace = true }
observability = { workspace = true }
tracing = { workspace = true }
domain_whatsapp = { path = "../../crates/domain_whatsapp" }
# N8.5/E4: só pelas chaves de Redis, que são CONTRATO com o ia_engine
# (`tenant:config:<uuid>` e o canal de invalidação) — duplicar o literal aqui
# deixaria worker e Python divergirem em silêncio numa renomeação.
infrastructure_redis = { path = "../../crates/infrastructure_redis" }
ia_client = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
# Sem isto, `cargo test -p worker` isolado NÃO compila: os testes usam
# `MockIaEngineClient`, que vive atrás da feature `mock` do `ia_client`. Funcionava
# só por acidente — rodando o workspace inteiro, o `runtime_api` habilita a feature
# e a unificação do Cargo a empresta ao worker. Quem rodasse os testes deste app
# sozinho via erro de compilação, não falha de teste.
ia_client = { workspace = true, features = ["mock"] }
