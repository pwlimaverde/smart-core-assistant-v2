syntax = "proto3";
package smartcore.contracts.ai;

// Par chave/valor local (equivalente a `errors.proto:KeyValue`, mas
// duplicado aqui em vez de importado): o passo `flatc --proto` deste
// pipeline (ver build.rs) resolve imports relativos ao diretório do próprio
// .proto e não recebe `-I schemas`, então `import "errors.proto"` a partir
// de `schemas/ai/` falha. `map<string,string>` também não é suportado pela
// conversão --proto do flatc.
message KeyValuePair {
  string key = 1;
  string value = 2;
}

// A config de provedor (modelo, api_key, temperatura) NÃO trafega mais aqui.
// O `data_postgres` resolve a cascata `TenantConfig > CoreSettings`, publica o
// `RuntimeConfig` em `tenant:config:<tenant_id>` no Redis e sinaliza mudanças
// pelo canal `tenant:config:invalidate`; o `ia_engine` lê de lá, com cache em
// RAM. Ver `doc_dev/modelagem_dados/gerenciamento_configuracoes_ia.md`.
//
// Por isso cada request carrega apenas `tenant_id` + os dados da mensagem:
// chave de API e prompt de sistema não viajam a cada interação de WhatsApp.
// Os números de campo liberados por essa mudança ficam `reserved` em cada
// mensagem — reusá-los faria um cliente desatualizado ler lixo com o tipo certo.

// Ponteiro de mídia (URL pré-assinada R2, curta duração) — nunca binário
// inline nas mensagens gRPC.
message MediaRef {
  string url = 1;
  string mimetype = 2;
  string file_name = 3; // preenchido para documentMessage
}

message ChatTurn {
  string role = 1;     // "human" | "ai"
  string conteudo = 2;
}

message ChatHistory {
  repeated ChatTurn turnos = 1;
}

// --- Motor Jev (plano ia-engine-jev) --------------------------------------
// Tudo aditivo: o `ia_engine` atual ignora os campos novos e não envia os de
// resposta; o `ia_engine_jev` usa os dois lados. Sem `map` (o conversor
// proto→flatbuffers não aceita).

// Intenção do catálogo do tenant com o que o Jev precisa para escolher entre
// opções parecidas: descrição e exemplo. `comportamento` é o texto que a LLM
// recebe quando a intenção é a escolhida.
message IntentDef {
  string tag = 1;
  string grupo = 2;
  string descricao = 3;
  string exemplo = 4;
  string comportamento = 5;
}

// Tipo de entidade com a estratégia de busca de valor (regex | lista | varios
// | data | livre) e as opções conhecidas, quando houver.
message EntidadeDef {
  string tipo = 1;
  string descricao = 2;
  string estrategia = 3;
  repeated string opcoes = 4;
}

// Trecho da base de conhecimento, um por documento — antes chegavam colados
// num texto só, o que impedia avaliar trecho a trecho.
message Trecho {
  string id = 1;
  string conteudo = 2;
  double distancia = 3;
}

// Um sinal que pesou na decisão: nome, valor medido e o limiar comparado.
message SinalDaDecisao {
  string nome = 1;
  double valor = 2;
  double limiar = 3;
}

// Como cada trecho foi julgado: aprovado como evidência, em conflito, ou
// descartado (nenhum dos dois).
message TrechoAvaliado {
  string id = 1;
  bool aprovado = 2;
  bool conflito = 3;
}

// Custo e duração da decisão, para o registro das decisões da IA.
message UsoDoMotor {
  int64 tokens_entrada = 1;
  int32 requisicoes = 2;
  int64 duracao_ms = 3;
}

// --- TestarRegraTransferencia (só o motor Jev) ---
// Uma frase contra uma regra de transferência, antes de ela valer. Nada é
// gravado: nem a frase, nem o resultado.
message TestarRegraTransferenciaRequest {
  string tenant_id = 1;
  string frase = 2;
  string condicao = 3;
  repeated string exemplos_sim = 4;
  repeated string exemplos_nao = 5;
  string sensibilidade = 6; // baixa | media | alta
}
message TestarRegraTransferenciaResponse {
  double probabilidade = 1;
  double limiar = 2;
  bool dispararia = 3;
  string modelo = 4;
}

// --- Transcribe (áudio -> texto) ---
message TranscribeRequest {
  string tenant_id = 1;
  MediaRef media = 2;
  string language = 3; // default "pt"
  reserved 4; // era transcription_provider — vem do RuntimeConfig (Redis)
}
message TranscribeResponse {
  string transcricao = 1;
  string resumo = 2;
}

// --- InterpretMedia (imagem/vídeo/documento) ---
message InterpretMediaRequest {
  string tenant_id = 1;
  MediaRef media = 2;
  string media_type = 3; // "imageMessage" | "videoMessage" | "documentMessage"
  reserved 4; // era vision_provider — vem do RuntimeConfig (Redis)
}
message InterpretMediaResponse {
  string analise = 1;
  string resumo = 2;
}

// --- Analyse (intents/entidades — equivalente a analise_previa_mensagem) ---
message AnalyseRequest {
  string tenant_id = 1;
  string mensagem = 2;
  ChatHistory historico = 3;
  string valid_intent_types = 4;
  repeated string valid_entity_types = 5;
  reserved 6; // era llm — vem do RuntimeConfig (Redis)
  // Motor Jev: catálogo completo (descrição e exemplo) e tipos de entidade
  // com estratégia. O motor atual continua usando os campos 4 e 5.
  repeated IntentDef intents = 7;
  repeated EntidadeDef entidades = 8;
}
message Intent {
  string tipo = 1;
  double confianca = 2;
}
message Entidade {
  string tipo = 1;
  string valor = 2;
  double confianca = 3;
}
message AnalyseResponse {
  repeated Intent intents = 1;
  repeated Entidade entidades = 2;
  // Motor Jev: a intenção principal com a confiança do `Choice`, as
  // etiquetas na faixa de dúvida e quem respondeu.
  string intent_principal = 3;
  double confianca_principal = 4;
  repeated string intents_a_revisar = 5;
  string motor = 6;
  string modelo = 7;
  UsoDoMotor uso = 8;
}

// --- ExtrairTextoDocumento (B9 / N10 E5) ---
// Texto de um documento de treinamento (pdf, docx, xlsx, txt, csv). Sem LLM:
// e leitura do arquivo. O texto nunca vai para log - so a contagem.
message ExtrairTextoDocumentoRequest {
  string tenant_id = 1;
  MediaRef media = 2; // URL pre-assinada de leitura + mimetype + nome
}
message ExtrairTextoDocumentoResponse {
  string texto = 1;
  string formato = 2;  // pdf | docx | xlsx | txt | csv
  int32 caracteres = 3;
}

// --- Embed ---
message EmbedRequest {
  string tenant_id = 1;
  repeated string textos = 2; // batch
  reserved 3; // era embeddings_provider — vem do RuntimeConfig (Redis)
}
message Embedding {
  repeated float valores = 1;
}
message EmbedResponse {
  repeated Embedding embeddings = 1;
}

// --- Responder (resposta do bot; RAG textual já resolvido pelo worker via
// data_postgres.QueryCompose antes desta chamada) ---
message CampoColetado {
  string slug = 1;
  string nome = 2;
  string valor = 3;
}
message CampoPendente {
  string slug = 1;
  string nome = 2;
  string descricao = 3;
  string hint = 4;
}

message ResponderRequest {
  string tenant_id = 1;
  string atendimento_id = 2;
  string mensagem = 3;
  ChatHistory historico = 4;
  repeated KeyValuePair fluxos_disponiveis = 5; // key = "Setor - descrição"
  string dados_treinamento = 7; // resolvido via data_postgres.QueryCompose
  repeated CampoColetado campos_coletados = 8;
  repeated CampoPendente campos_pendentes = 9;
  // 6  era dados_empresa          | 10 era llm
  // 12 era similarity_threshold   | 11 era embeddings_provider
  // Todos vêm do RuntimeConfig (Redis).
  reserved 6, 10, 11, 12;
  // Motor Jev: catálogo de intenções (o comportamento vem da intenção que o
  // Jev escolher), trechos separados e o comportamento da intenção mais
  // próxima por vetor, à parte. As regras de transferência NÃO viajam aqui:
  // vêm do Redis com a config do tenant.
  repeated IntentDef intents = 13;
  repeated Trecho trechos = 14;
  string comportamento = 15;
}
// C1 — o que a IA extraiu da mensagem do cliente.
//
// Sem isto o laco nao fecha: a IA recebe `campos_pendentes` com a `hint`,
// pergunta, o cliente responde, e o valor e jogado fora — entao ela pergunta
// de novo na mensagem seguinte, e na outra.
message CampoExtraido {
  string slug = 1;
  // Ja na forma tipada do campo (texto, numero, data, lista...), serializado
  // como JSON. O servidor revalida contra o `tipo` do catalogo antes de
  // gravar: o LLM nao define o esquema.
  string valor_json = 2;
  double confianca = 3;
}

message ResponderResponse {
  string resposta_texto = 1;
  bool transferir_atendimento = 2;
  string fluxo_transferencia = 3;
  double confiabilidade = 4;
  // Aditivo: um `ia_engine` antigo simplesmente nao envia nada aqui, e o
  // servidor grava zero campos — que e o comportamento de hoje.
  repeated CampoExtraido campos_extraidos = 5;
  // Motor Jev: por que transferiu (nome da regra ou do sinal), os sinais com
  // valor e limiar, e como a resposta foi decidida.
  string motivo_transferencia = 6;
  repeated SinalDaDecisao sinais = 7;
  string motor = 8;
  string modelo = 9;
  UsoDoMotor uso = 10;
  repeated TrechoAvaliado trechos = 11;
  string intencao_principal = 12;
  double confianca_intencao = 13;
  // automatica | transferida | sem_info | a_revisar | reserva
  string decisao = 14;
  int64 regra_id = 15;
  bool regerada = 16;
}

// --- Sentimento (equivalente a analise_avaliacao) ---
message SentimentoRequest {
  string tenant_id = 1;
  ChatHistory historico = 2;
  reserved 3; // era llm — vem do RuntimeConfig (Redis)
}
message SentimentoResponse {
  int32 nota = 1;
  string sentimento = 2;
  string feedback = 3;
}

service IaEngineService {
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc InterpretMedia(InterpretMediaRequest) returns (InterpretMediaResponse);
  rpc Analyse(AnalyseRequest) returns (AnalyseResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc Responder(ResponderRequest) returns (ResponderResponse);
  rpc Sentimento(SentimentoRequest) returns (SentimentoResponse);
  rpc ExtrairTextoDocumento(ExtrairTextoDocumentoRequest) returns (ExtrairTextoDocumentoResponse);
  // Só o motor Jev implementa; o atual responde UNIMPLEMENTED.
  rpc TestarRegraTransferencia(TestarRegraTransferenciaRequest) returns (TestarRegraTransferenciaResponse);
}
