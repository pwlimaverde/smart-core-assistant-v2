syntax = "proto3";
package smartcore.contracts.queries;

// --- Configurações Globais (CoreSettings) ---
message CoreSetting {
  string key = 1;
  string value = 2;
  bool encrypted = 3;
  string description = 4;
}

message ListCoreSettingsRequest {}

message ListCoreSettingsResponse {
  repeated CoreSetting settings = 1;
}

message UpsertCoreSettingRequest {
  string key = 1;
  string value = 2;
  bool encrypted = 3;
  string description = 4;
}

message UpsertCoreSettingResponse {
  bool success = 1;
}

message DeleteCoreSettingRequest {
  string key = 1;
}

message DeleteCoreSettingResponse {
  bool success = 1;
}

// --- Entrada de Chave de API ---
message ApiKeyEntry {
  string key = 1;
  string value = 2;
}

// --- Configurações de Tenant (TenantConfig) ---
message GetTenantConfigRequest {
  string tenant_id = 1;
}

message GetTenantConfigResponse {
  string dados_empresa = 1;
  string persona_bot = 2;
  string bot_agent_name = 3;
  string msg_fallback = 4;
  string msg_sem_info = 5;
  string msg_transferencia = 6;
  string llm_class = 7;
  string model = 8;
  string llm_temperature = 9;
  string transcription_provider = 10;
  string transcription_model = 11;
  string vision_provider = 12;
  string vision_model = 13;
  string embeddings_class = 14;
  string embeddings_model = 15;
  int32 chunk_size = 16;
  int32 chunk_overlap = 17;
  string similarity_threshold = 18;
  string vector_distance_threshold = 19;
  repeated ApiKeyEntry api_keys = 20;
}

message UpdateTenantConfigRequest {
  string tenant_id = 1;
  string dados_empresa = 2;
  string persona_bot = 3;
  string bot_agent_name = 4;
  string msg_fallback = 5;
  string msg_sem_info = 6;
  string msg_transferencia = 7;
  string llm_class = 8;
  string model = 9;
  string llm_temperature = 10;
  string transcription_provider = 11;
  string transcription_model = 12;
  string vision_provider = 13;
  string vision_model = 14;
  string embeddings_class = 15;
  string embeddings_model = 16;
  int32 chunk_size = 17;
  int32 chunk_overlap = 18;
  string similarity_threshold = 19;
  string vector_distance_threshold = 20;
  repeated ApiKeyEntry api_keys = 21;
}

message UpdateTenantConfigResponse {
  bool success = 1;
}

// --- FASE 2: Entidades de Tenants & Billing ---

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  string api_key = 4;
  int32 owner_id = 5;
  string email = 6;
  string phone = 7;
  bool active = 8;
  bool setup_completed = 9;
  int32 onboarding_step = 10;
  string access_code = 11;
  int64 created_at = 12; // timestamp_millis
  int64 updated_at = 13; // timestamp_millis
}

message Plan {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string price = 4; // Decimal como string (evita perda de precisão)
  int32 max_instances = 5;
  int32 max_departments = 6;
  bool active = 7;
  int64 created_at = 8;
  int32 max_fluxos = 9;
}

message Subscription {
  int32 id = 1;
  string tenant_id = 2;
  int32 plan_id = 3;
  string status = 4;
  int64 current_period_start = 5;
  int64 current_period_end = 6;
  string payment_gateway = 7;
  string external_customer_id = 8;
  string external_subscription_id = 9;
  int64 updated_at = 10;
}

message PaymentRecord {
  int32 id = 1;
  string tenant_id = 2;
  string amount = 3;
  string payment_date = 4; // YYYY-MM-DD
  string payment_method = 5;
  string period_start = 6;  // YYYY-MM-DD
  string period_end = 7;    // YYYY-MM-DD
  string notes = 8;
  int32 recorded_by_id = 9;
  int64 created_at = 10;
}

// --- Requisições/Respostas de Tenants ---

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message GetTenantRequest {
  string id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message CreateTenantRequest {
  string name = 1;
  string slug = 2;
  int32 owner_id = 3;
  string email = 4;
  string phone = 5;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message UpdateTenantRequest {
  string id = 1;
  string name = 2;
  string slug = 3;
  int32 owner_id = 4;
  string email = 5;
  string phone = 6;
}

message UpdateTenantResponse {
  bool success = 1;
}

message SetTenantActiveRequest {
  string id = 1;
  bool active = 2;
}

message SetTenantActiveResponse {
  bool success = 1;
}

message GenerateAccessCodeRequest {
  string id = 1;
}

message GenerateAccessCodeResponse {
  string access_code = 1;
}

// --- Requisições/Respostas de Billing ---

message ListPlansRequest {}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreatePlanRequest {
  string name = 1;
  string description = 2;
  string price = 3;
  int32 max_instances = 4;
  int32 max_departments = 5;
  int32 max_fluxos = 6;
}

message CreatePlanResponse {
  Plan plan = 1;
}

message UpdatePlanRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  int32 max_instances = 5;
  int32 max_departments = 6;
  bool active = 7;
  int32 max_fluxos = 8;
}

message UpdatePlanResponse {
  bool success = 1;
}

// --- Vouchers de ativação (meio de pagamento, não cupom de desconto) ---

message Voucher {
  string id = 1;
  string codigo = 2;
  string descricao = 3;
  int32 plan_id = 4;
  string plan_name = 5;
  int32 duracao_dias = 6;
  // 0 = ilimitado.
  int32 max_resgates = 7;
  int32 resgates_usados = 8;
  int64 valido_de = 9;
  // 0 = não expira sozinho.
  int64 valido_ate = 10;
  // 0 = não revogado. Revogar bloqueia NOVOS resgates e preserva as
  // assinaturas já concedidas.
  int64 revogado_em = 11;
  string motivo_revogacao = 12;
  int64 created_at = 13;
}

message VoucherRedemption {
  string id = 1;
  string voucher_id = 2;
  string tenant_id = 3;
  int32 plan_id = 4;
  int64 periodo_inicio = 5;
  int64 periodo_fim = 6;
  string ip = 7;
  int64 redeemed_at = 8;
}

message ListVouchersRequest {}

message ListVouchersResponse {
  repeated Voucher vouchers = 1;
}

message CreateVoucherRequest {
  string codigo = 1;
  string descricao = 2;
  int32 plan_id = 3;
  int32 duracao_dias = 4;
  // 0 = ilimitado (campanha aberta). O cliente sempre envia o valor escolhido
  // na tela; o padrão da tela é 1, o mais conservador.
  int32 max_resgates = 5;
  // RFC 3339; vazio = sem expiração.
  string valido_ate = 6;
}

message CreateVoucherResponse {
  Voucher voucher = 1;
}

message RevokeVoucherRequest {
  string voucher_id = 1;
  string motivo = 2;
}

message RevokeVoucherResponse {
  // false = já estava revogado (não é erro).
  bool revogado = 1;
}

message ListVoucherRedemptionsRequest {
  string voucher_id = 1;
}

message ListVoucherRedemptionsResponse {
  repeated VoucherRedemption resgates = 1;
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message RegisterPaymentRequest {
  string tenant_id = 1;
  string amount = 2;
  string payment_method = 3;
  string payment_date = 4; // YYYY-MM-DD
  string period_start = 5;  // YYYY-MM-DD
  string period_end = 6;    // YYYY-MM-DD
  string notes = 7;
}

message RegisterPaymentResponse {
  PaymentRecord payment = 1;
}

message ListPaymentsRequest {
  string tenant_id = 1; // Opcional: filtra por tenant, se vazio lista todos
}

message ListPaymentsResponse {
  repeated PaymentRecord payments = 1;
}

// --- Requisições/Respostas de Faturamento ---
// ...

// --- Fase 3: Evolution Connection ---
message TestEvolutionConnectionRequest {
  string tenant_id = 1;
}

message TestEvolutionConnectionResponse {
  string status = 1; // "open", "connecting", "close", "error"
  string error_message = 2;
}

// --- Fase 4: Feature Flags ---
message FeatureFlagOverride {
  string tenant_id = 1;
  bool enabled = 2;
}

message FeatureFlag {
  string key = 1;
  string description = 2;
  bool enabled_globally = 3;
  repeated FeatureFlagOverride overrides = 4;
}

message ListFeatureFlagsRequest {}

message ListFeatureFlagsResponse {
  repeated FeatureFlag flags = 1;
}

message SetFeatureFlagRequest {
  string key = 1;
  bool enabled_globally = 2;
}

message SetFeatureFlagResponse {
  bool success = 1;
}

message SetFeatureFlagOverrideRequest {
  string key = 1;
  string tenant_id = 2;
  bool enabled = 3;
  bool remove_override = 4;
}

message SetFeatureFlagOverrideResponse {
  bool success = 1;
}

// --- Fase 5: Auditoria & Saúde ---
message AuditLogEntry {
  int32 id = 1;
  string event_type = 2;
  string actor = 3;
  string tenant_id = 4;
  string description = 5;
  string ip_address = 6;
  string user_agent = 7;
  int64 created_at = 8;
}

message QueryAuditLogRequest {
  string tenant_id = 1;
  string event_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message QueryAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total_count = 2;
}

message ServiceHealth {
  string service_name = 1;
  string status = 2; // "healthy", "unhealthy", "degraded"
  string message = 3;
  int64 response_time_ms = 4;
}

message GetServiceHealthRequest {}

message GetServiceHealthResponse {
  repeated ServiceHealth services = 1;
}

message GetDashboardSummaryRequest {}

message GetDashboardSummaryResponse {
  int32 total_tenants = 1;
  int32 active_tenants = 2;
  int32 total_subscriptions = 3;
  string monthly_recurring_revenue = 4;
  repeated ServiceHealth health = 5;
}

message ExportTenantsCsvRequest {}

message ExportTenantsCsvResponse {
  bytes chunk = 1;
}

// --- Fase 6: Operacional (fila/Kanban/chat — WS-6) ---
message AtendimentoResumo {
  int32 id = 1;
  int32 contato_id = 2;
  string status = 3;
  int32 departamento_id = 4;      // 0 = ausente
  int32 fluxo_atendimento_id = 5; // 0 = ausente
  int32 etapa_atual_id = 6;       // 0 = ausente
  string assunto = 7;
  string prioridade = 8;
  int32 atendente_humano_id = 9;  // 0 = ausente
  int64 data_inicio = 10;
  int64 data_ultima_mensagem = 11;
  optional int32 sentimento_nota = 12;    // última leitura de sentimento da IA (N6.5)
  optional string sentimento_label = 13; // ex.: positivo/neutro/negativo
}

message ListAtendimentosRequest {
  string status = 1;         // default "fila" no cliente quando vazio
  int32 departamento_id = 2; // 0 = todos os departamentos
  int32 limit = 3;
}

message ListAtendimentosResponse {
  repeated AtendimentoResumo atendimentos = 1;
}

message MensagemThread {
  int32 id = 1;
  int32 atendimento_id = 2;
  string tipo = 3;
  string conteudo = 4;
  string remetente = 5;
  int64 timestamp = 6;
  string status_envio = 7;
  bool gerado_por_ia = 8;            // selo "gerado por IA" no chat (N6.2)
  optional string resumo_midia = 9;  // resumo/transcrição da mídia analisada (N6.1/N6.2)
}

message GetThreadRequest {
  int32 atendimento_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetThreadResponse {
  repeated MensagemThread mensagens = 1;
}

message MoveAtendimentoEtapaRequest {
  int32 atendimento_id = 1;
  int32 etapa_destino_id = 2;
  string motivo = 3;
  // N7.2: idempotência do sync offline. Campo aditivo/opcional — clientes
  // antigos (sem action_id) seguem funcionando sem dedupe server-side.
  optional string action_id = 4;
}

message MoveAtendimentoEtapaResponse {
  bool success = 1;
}

// O par simetrico de MoveAtendimentoEtapa: la a coluna manda no status, aqui o
// status manda na coluna. Encerrar pelo chat sem isto deixaria o cartao parado
// na coluna de trabalho, e o quadro passaria a mentir sobre o que esta aberto.
message SetAtendimentoStatusRequest {
  int32 atendimento_id = 1;
  // Vocabulario fechado: fila, em_atendimento, pendencia, resolvido,
  // cancelado, arquivado.
  string status = 2;
  string motivo = 3;
}

message SetAtendimentoStatusResponse {
  bool success = 1;
  string status = 2;
  // Onde o cartao ficou. 0 quando o fluxo nao tem coluna daquele tipo -- o
  // cartao fica onde estava, que e melhor que sumir do quadro.
  int32 etapa_atual_id = 3;
}

message SendOutboundMessageRequest {
  int32 atendimento_id = 1;
  string conteudo = 2;
  string tipo = 3; // default "texto" no cliente quando vazio
  // N7.2: idempotência do sync offline. Campo aditivo/opcional — clientes
  // antigos (sem action_id) seguem funcionando sem dedupe server-side.
  optional string action_id = 4;
}

message SendOutboundMessageResponse {
  int32 message_id = 1;
}

// --- Fase N3: Painel do Tenant (convites, usuários e config tenant-scoped) ---
// Diferente das rotas de superusuário: exigem apenas autenticação (o RBAC fino
// `tenant:admin` é aplicado dentro do data_postgres). O tenant_id NUNCA vem do
// request — é sempre derivado das claims da sessão (um tenant não age sobre outro).

message CreateInviteRequest {
  string email = 1;
  string name = 2;
  string role = 3;
  repeated string module_permissions = 4;
  repeated int32 flow_permissions = 5;
}

// Convite recém-criado. É o ÚNICO ponto onde o `token` é exposto (momento da
// criação); as listagens jamais o retornam.
message TenantInviteCreated {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string name = 4;
  string role = 5;
  string token = 6;
  int64 expires_at = 7; // timestamp_millis
  bool used = 8;
  int64 created_at = 9; // timestamp_millis
}

message CreateInviteResponse {
  TenantInviteCreated invite = 1;
}

// Rota PÚBLICA (sem sessão): o convidado cria a própria conta a partir do token.
message AcceptInviteRequest {
  string token = 1;
  string username = 2;
  string email = 3;
  string password = 4;
}

message AcceptedTenantUser {
  int32 id = 1;
  int32 user_id = 2;
  string tenant_id = 3;
  string role = 4;
  repeated string module_permissions = 5;
  repeated int32 flow_permissions = 6;
  bool is_active = 7;
}

message AcceptInviteResponse {
  AcceptedTenantUser tenant_user = 1;
}

message ListInvitesRequest {}

message TenantInviteItem {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  repeated string module_permissions = 5;
  repeated int32 flow_permissions = 6;
  int64 expires_at = 7; // timestamp_millis
  bool used = 8;
  bool revoked = 9;
  int64 created_at = 10; // timestamp_millis
}

message ListInvitesResponse {
  repeated TenantInviteItem invites = 1;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {
  bool success = 1;
}

message ListTenantUsersRequest {}

message TenantUserItem {
  int32 id = 1;
  int32 user_id = 2;
  string role = 3;
  repeated string module_permissions = 4;
  repeated int32 flow_permissions = 5;
  bool is_active = 6;
  int64 created_at = 7; // timestamp_millis
}

message ListTenantUsersResponse {
  repeated TenantUserItem users = 1;
}

// Campos opcionais em proto3: como não há `optional`/wrappers no projeto e listas
// repetidas não distinguem "vazio" de "ausente", usamos flags companion `set_*`.
// Só os campos com a flag correspondente `true` são alterados no data_postgres.
message UpdateTenantUserRequest {
  int32 user_id = 1;
  bool set_role = 2;
  string role = 3;
  bool set_module_permissions = 4;
  repeated string module_permissions = 5;
  bool set_flow_permissions = 6;
  repeated int32 flow_permissions = 7;
}

message UpdateTenantUserResponse {
  bool success = 1;
}

// --- Configuração inicial guiada (passos 5 a 8 do onboarding) ---
//
// O tenant sai do pagamento com a conta criada, mas sem nada operando. Estes
// RPCs são o que o roteiro guiado usa para deixá-lo funcionando: conectar o
// WhatsApp, criar o primeiro departamento e registrar até onde ele chegou.
//
// Todos com escopo de TENANT (o `tenant_id` vem das claims, nunca do request) —
// diferente dos RPCs de instância do superusuário, que operam cross-tenant.

message CreateMyWhatsappInstanceRequest {
  // Nome da instância no provedor. Precisa ser único entre todos os tenants.
  string instance_name = 1;
}

message CreateMyWhatsappInstanceResponse {
  int32 id = 1;
  string instance_name = 2;
  string provider = 3;
}

message GetMyWhatsappInstanceStatusRequest {
  int32 id = 1;
}

message GetMyWhatsappInstanceStatusResponse {
  // `connected`, `disconnected`, `connecting` ou `unknown`.
  string connection_state = 1;
  // QR em base64 para o pareamento; vazio quando já conectado (ou quando o
  // provedor ainda não o gerou).
  string qr_code = 2;
}

message CreateMyDepartamentoRequest {
  string nome = 1;
  string descricao = 2;
}

message CreateMyDepartamentoResponse {
  int32 id = 1;
  string nome = 2;
}

// Define a persona do bot no passo 7.
//
// RPC dedicado, e não `UpdateMyTenantConfig`: aquele carrega o objeto de
// configuração inteiro, e em proto3 um campo não preenchido chega como string
// vazia — o UPSERT do `data_postgres` faz `COALESCE(EXCLUDED.campo, atual)`, de
// modo que "" SOBRESCREVE o valor existente. Mandar só a persona por ali
// apagaria modelo de LLM, thresholds e o resto da configuração de IA.
message SetMyBotPersonaRequest {
  string persona_bot = 1;
  string bot_agent_name = 2;
}

message SetMyBotPersonaResponse {
  bool success = 1;
}

// Registra até onde o tenant chegou na configuração guiada.
//
// O progresso vive no servidor, e não no app, para que fechar o programa e
// reabrir continue de onde parou — num app instalado isso é o esperado.
message SetOnboardingProgressRequest {
  // 5..8. O passo 8 conclui o roteiro e marca `setup_completed`.
  int32 passo = 1;
  // true = o tenant terminou (ou pulou o que faltava) e vai para o workspace.
  bool concluido = 2;
}

message SetOnboardingProgressResponse {
  int32 passo = 1;
  bool concluido = 2;
}

// Lê o progresso gravado — a contraparte que faltava do `SetOnboardingProgress`.
//
// Sem ela o progresso era gravado e nunca lido: quem fechava o app no meio da
// configuração reabria direto no workspace vazio, sem caminho de volta ao
// roteiro, com a conta paga e inutilizável.
message GetMyOnboardingProgressRequest {}

message GetMyOnboardingProgressResponse {
  // 5..8 enquanto o roteiro corre. 0 = nunca registrou nada.
  int32 passo = 1;
  // true = terminou (ou pulou o que faltava); o app vai para o workspace.
  bool concluido = 2;
}

// N3.3: config do PRÓPRIO tenant (tenant_id vem das claims, não do request).
// Reaproveita GetTenantConfigResponse/UpdateTenantConfigResponse. As api_keys já
// vêm mascaradas do data_postgres (`••••••••`), igual ao caminho do superusuário.
message GetMyTenantConfigRequest {}

message UpdateMyTenantConfigRequest {
  string dados_empresa = 1;
  string persona_bot = 2;
  string bot_agent_name = 3;
  string msg_fallback = 4;
  string msg_sem_info = 5;
  string msg_transferencia = 6;
  string llm_class = 7;
  string model = 8;
  string llm_temperature = 9;
  string transcription_provider = 10;
  string transcription_model = 11;
  string vision_provider = 12;
  string vision_model = 13;
  string embeddings_class = 14;
  string embeddings_model = 15;
  int32 chunk_size = 16;
  int32 chunk_overlap = 17;
  string similarity_threshold = 18;
  string vector_distance_threshold = 19;
  repeated ApiKeyEntry api_keys = 20;
}

// --- Serviço Admin ---
service AdminService {
  rpc ListCoreSettings(ListCoreSettingsRequest) returns (ListCoreSettingsResponse);
  rpc UpsertCoreSetting(UpsertCoreSettingRequest) returns (UpsertCoreSettingResponse);
  rpc DeleteCoreSetting(DeleteCoreSettingRequest) returns (DeleteCoreSettingResponse);
  rpc GetTenantConfig(GetTenantConfigRequest) returns (GetTenantConfigResponse);
  rpc UpdateTenantConfig(UpdateTenantConfigRequest) returns (UpdateTenantConfigResponse);

  // Fase 2: Tenants
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc SetTenantActive(SetTenantActiveRequest) returns (SetTenantActiveResponse);
  rpc GenerateAccessCode(GenerateAccessCodeRequest) returns (GenerateAccessCodeResponse);

  // Fase 2: Billing
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc RegisterPayment(RegisterPaymentRequest) returns (RegisterPaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);

  // Vouchers de ativação
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse);
  rpc CreateVoucher(CreateVoucherRequest) returns (CreateVoucherResponse);
  rpc RevokeVoucher(RevokeVoucherRequest) returns (RevokeVoucherResponse);
  rpc ListVoucherRedemptions(ListVoucherRedemptionsRequest) returns (ListVoucherRedemptionsResponse);

  // Fase 3: Evolution Connection
  rpc TestEvolutionConnection(TestEvolutionConnectionRequest) returns (TestEvolutionConnectionResponse);

  // Fase 4: Feature Flags
  rpc ListFeatureFlags(ListFeatureFlagsRequest) returns (ListFeatureFlagsResponse);
  rpc SetFeatureFlag(SetFeatureFlagRequest) returns (SetFeatureFlagResponse);
  rpc SetFeatureFlagOverride(SetFeatureFlagOverrideRequest) returns (SetFeatureFlagOverrideResponse);

  // Fase 5: Auditoria & Saúde
  rpc QueryAuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse);
  rpc GetServiceHealth(GetServiceHealthRequest) returns (GetServiceHealthResponse);
  rpc GetDashboardSummary(GetDashboardSummaryRequest) returns (GetDashboardSummaryResponse);
  rpc ExportTenantsCsv(ExportTenantsCsvRequest) returns (stream ExportTenantsCsvResponse);

  // Realtime
  rpc StreamAtendimentos(StreamAtendimentosRequest) returns (stream AtendimentoEvent);

  // Fase 6: Operacional (fila/Kanban/chat — WS-6). RBAC fino por fluxo (flow_permissions)
  // já é aplicado no data_postgres (WS-5a); estas rotas exigem só autenticação, não superuser.
  rpc ListAtendimentos(ListAtendimentosRequest) returns (ListAtendimentosResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc MoveAtendimentoEtapa(MoveAtendimentoEtapaRequest) returns (MoveAtendimentoEtapaResponse);
  rpc SetAtendimentoStatus(SetAtendimentoStatusRequest) returns (SetAtendimentoStatusResponse);
  rpc SendOutboundMessage(SendOutboundMessageRequest) returns (SendOutboundMessageResponse);

  // Fase N3: Painel do Tenant. Exigem só autenticação (não superuser); o RBAC fino
  // `tenant:admin` é aplicado no data_postgres. AcceptInvite é rota pública (sem sessão).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc ListTenantUsers(ListTenantUsersRequest) returns (ListTenantUsersResponse);
  rpc UpdateTenantUser(UpdateTenantUserRequest) returns (UpdateTenantUserResponse);
  rpc GetMyTenantConfig(GetMyTenantConfigRequest) returns (GetTenantConfigResponse);
  rpc UpdateMyTenantConfig(UpdateMyTenantConfigRequest) returns (UpdateTenantConfigResponse);

  // Configuração inicial guiada (passos 5 a 8)
  rpc CreateMyWhatsappInstance(CreateMyWhatsappInstanceRequest) returns (CreateMyWhatsappInstanceResponse);
  rpc GetMyWhatsappInstanceStatus(GetMyWhatsappInstanceStatusRequest) returns (GetMyWhatsappInstanceStatusResponse);
  rpc CreateMyDepartamento(CreateMyDepartamentoRequest) returns (CreateMyDepartamentoResponse);
  rpc SetMyBotPersona(SetMyBotPersonaRequest) returns (SetMyBotPersonaResponse);
  rpc SetOnboardingProgress(SetOnboardingProgressRequest) returns (SetOnboardingProgressResponse);
  rpc GetMyOnboardingProgress(GetMyOnboardingProgressRequest) returns (GetMyOnboardingProgressResponse);

  // Treinamento da IA (o tenant treina o próprio assistente)
  rpc CreateMyTreinamento(CreateMyTreinamentoRequest) returns (MyTreinamentoResponse);
  rpc ListMyTreinamentos(ListMyTreinamentosRequest) returns (ListMyTreinamentosResponse);
  rpc GetMyTreinamento(GetMyTreinamentoRequest) returns (MyTreinamentoResponse);
  rpc FinalizarMyTreinamento(FinalizarMyTreinamentoRequest) returns (SimpleOkResponse);
  rpc RemoverMyTreinamento(RemoverMyTreinamentoRequest) returns (SimpleOkResponse);

  // Gestão das conexões de WhatsApp DEPOIS de conectadas.
  //
  // O onboarding cria a primeira; sem estas, uma conexão que cai deixa o tenant
  // sem saída — não há como ver o estado, reconectar nem trocar de aparelho.
  rpc ListMyWhatsappInstances(ListMyWhatsappInstancesRequest) returns (ListMyWhatsappInstancesResponse);
  rpc ReconnectMyWhatsappInstance(MyWhatsappInstanceIdRequest) returns (SimpleOkResponse);
  rpc DeleteMyWhatsappInstance(MyWhatsappInstanceIdRequest) returns (SimpleOkResponse);

  // Departamentos e atendentes — a estrutura para onde a fila manda conversa.
  rpc ListMyDepartamentos(ListMyDepartamentosRequest) returns (ListMyDepartamentosResponse);
  rpc UpdateMyDepartamento(UpdateMyDepartamentoRequest) returns (SimpleOkResponse);
  rpc DesativarMyDepartamento(MyDepartamentoIdRequest) returns (SimpleOkResponse);
  rpc ListMyAtendentes(ListMyAtendentesRequest) returns (ListMyAtendentesResponse);
  rpc CreateMyAtendente(CreateMyAtendenteRequest) returns (MyAtendenteResponse);
  rpc UpdateMyAtendente(UpdateMyAtendenteRequest) returns (SimpleOkResponse);
  rpc DesativarMyAtendente(MyAtendenteIdRequest) returns (SimpleOkResponse);
  rpc GetMyPainel(GetMyPainelRequest) returns (GetMyPainelResponse);
  rpc ListMyContatos(ListMyContatosRequest) returns (ListMyContatosResponse);

  // Fluxos de atendimento e suas etapas — o quadro por onde a conversa anda.
  rpc ListMyFluxos(ListMyFluxosRequest) returns (ListMyFluxosResponse);
  rpc CreateMyFluxo(CreateMyFluxoRequest) returns (MyFluxoResponse);
  rpc UpdateMyFluxo(UpdateMyFluxoRequest) returns (SimpleOkResponse);
  rpc DesativarMyFluxo(MyFluxoIdRequest) returns (SimpleOkResponse);
  rpc ListMyEtapasFluxo(MyFluxoIdRequest) returns (ListMyEtapasFluxoResponse);
  rpc CreateMyEtapaFluxo(CreateMyEtapaFluxoRequest) returns (MyEtapaFluxoResponse);
  rpc UpdateMyEtapaFluxo(UpdateMyEtapaFluxoRequest) returns (SimpleOkResponse);
  rpc DesativarMyEtapaFluxo(MyEtapaFluxoIdRequest) returns (SimpleOkResponse);
  rpc MoverMyEtapaFluxo(MoverMyEtapaFluxoRequest) returns (SimpleOkResponse);
}

// --- Fluxos de atendimento ---
//
// O fluxo é o quadro; a etapa é a coluna. Cada atendimento mora numa etapa, e
// é a etapa do tipo `fila` que recebe conversa nova — por isso um fluxo nasce
// já com as quatro etapas padrão.

message MyFluxo {
  int32 id = 1;
  int32 departamento_id = 2;
  string departamento_nome = 3;
  string nome = 4;
  string descricao = 5;
  bool ativo = 6;
  int32 etapas = 7;
  // Conversas que ainda não terminaram neste fluxo. É o número que diz se
  // desativá-lo deixaria gente no meio do caminho.
  int32 atendimentos_abertos = 8;
  int64 criado_em = 9;
}

message ListMyFluxosRequest {}

message ListMyFluxosResponse {
  // Inativos vêm junto: escondê-los deixaria o tenant sem como reativar o que
  // desativou por engano.
  repeated MyFluxo fluxos = 1;
}

message CreateMyFluxoRequest {
  int32 departamento_id = 1;
  string nome = 2;
  string descricao = 3;
}

message MyFluxoResponse {
  MyFluxo fluxo = 1;
}

message UpdateMyFluxoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  bool ativo = 4;
}

message MyFluxoIdRequest {
  int32 id = 1;
}

message MyEtapaFluxo {
  int32 id = 1;
  int32 fluxo_id = 2;
  string nome = 3;
  string descricao = 4;
  int32 ordem = 5;
  string cor = 6;
  // Vocabulário fechado: fila, trabalho, espera, finalizacao. Não é enfeite —
  // o roteamento procura `fila` para saber onde a conversa entra.
  string tipo_etapa = 7;
  bool ativo = 8;
}

message ListMyEtapasFluxoResponse {
  repeated MyEtapaFluxo etapas = 1;
}

message CreateMyEtapaFluxoRequest {
  int32 fluxo_id = 1;
  string nome = 2;
  string tipo_etapa = 3;
  string cor = 4;
}

message MyEtapaFluxoResponse {
  MyEtapaFluxo etapa = 1;
}

message UpdateMyEtapaFluxoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  string cor = 4;
  string tipo_etapa = 5;
}

message MyEtapaFluxoIdRequest {
  int32 id = 1;
}

message MoverMyEtapaFluxoRequest {
  int32 id = 1;
  bool para_cima = 2;
}

// --- Contatos (quem fala com o tenant pelo WhatsApp) ---

message MyContato {
  int32 id = 1;
  string telefone = 2;
  // Nome cadastrado. Vazio quando o contato só existe pelo WhatsApp.
  string nome_contato = 3;
  // Como a pessoa se identifica no WhatsApp — muitas vezes é o único nome
  // que se tem.
  string nome_perfil_whatsapp = 4;
  string email = 5;
  bool ativo = 6;
  int64 ultima_interacao = 7;
  int64 cadastrado_em = 8;
}

message ListMyContatosRequest {
  // Casa contra nome, telefone e nome do perfil. Vazio = sem filtro.
  string busca = 1;
  // 0 = padrão do servidor (50). Teto de 200.
  int32 limite = 2;
}

message ListMyContatosResponse {
  repeated MyContato contatos = 1;
}

// --- Painel do tenant ---
//
// A primeira tela depois do login. Os números vêm de uma consulta só: cinco
// contagens do mesmo instante, e não cinco fotos de momentos diferentes.

message GetMyPainelRequest {}

message GetMyPainelResponse {
  int32 em_andamento = 1;
  int32 aguardando = 2;
  int32 mensagens_24h = 3;
  int32 conexoes_ativas = 4;
  int32 conexoes_total = 5;
  int32 departamentos = 6;
  int32 treinamentos_ativos = 7;
}

// --- Departamentos e atendentes ---

message MyDepartamento {
  int32 id = 1;
  string nome = 2;
  // Referência estável: NÃO muda ao renomear, porque há registros que apontam
  // para o departamento por ele.
  string slug = 3;
  string descricao = 4;
  bool ativo = 5;
  int64 criado_em = 6;
}

message ListMyDepartamentosRequest {}

message ListMyDepartamentosResponse {
  repeated MyDepartamento departamentos = 1;
}

message UpdateMyDepartamentoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  bool ativo = 4;
}

message MyDepartamentoIdRequest {
  int32 id = 1;
}

message MyAtendente {
  int32 id = 1;
  string nome = 2;
  string email = 3;
  string cargo = 4;
  // 0 = sem departamento.
  int32 departamento_id = 5;
  bool ativo = 6;
  // Aceitando conversa agora — diferente de `ativo`, que é o cadastro.
  bool disponivel = 7;
  int32 max_atendimentos_simultaneos = 8;
  // O quadro em que trabalha. Sem ele a edição não teria o que preencher no
  // seletor de fluxo, e salvar reatribuiria a pessoa por acidente.
  int32 fluxo_id = 9;
}

message ListMyAtendentesRequest {}

message ListMyAtendentesResponse {
  repeated MyAtendente atendentes = 1;
}

message CreateMyAtendenteRequest {
  string nome = 1;
  string email = 2;
  string cargo = 3;
  // Obrigatório: é o quadro em que a pessoa trabalha, e a coluna é NOT NULL.
  int32 fluxo_id = 4;
  // 0 = sem departamento.
  int32 departamento_id = 5;
}

message MyAtendenteResponse {
  MyAtendente atendente = 1;
}

message UpdateMyAtendenteRequest {
  int32 id = 1;
  string nome = 2;
  string cargo = 3;
  int32 departamento_id = 4;
  int32 fluxo_id = 5;
  bool ativo = 6;
  bool disponivel = 7;
  int32 max_atendimentos_simultaneos = 8;
}

message MyAtendenteIdRequest {
  int32 id = 1;
}

// --- Conexões de WhatsApp do tenant ---

message MyWhatsappInstance {
  int32 id = 1;
  string name = 2;
  // Número pareado; vazio enquanto o QR não foi lido.
  string phone_number = 3;
  // Vocabulário de `whatsapp_instance.connection_state`: connected,
  // connecting, disconnected, unknown.
  string connection_state = 4;
  bool active = 5;
  string provider = 6;
  int64 created_at = 7;
}

message ListMyWhatsappInstancesRequest {}

message ListMyWhatsappInstancesResponse {
  repeated MyWhatsappInstance instancias = 1;
}

message MyWhatsappInstanceIdRequest {
  int32 id = 1;
}

// --- Treinamento da IA ---
//
// O material que o assistente usa para responder. O fluxo tem três estados, e
// a tela precisa dos três: rascunho (criado, texto ainda em revisão),
// finalizado (aceito, na fila do worker) e vetorizado (já responde).

message MyTreinamento {
  int32 id = 1;
  // Assunto e agrupamento — a dupla identifica o treinamento no tenant.
  string tag = 2;
  string grupo = 3;
  string conteudo = 4;
  // Aceito pelo usuário e enviado para vetorização.
  bool finalizado = 5;
  // Já virou vetor: a partir daqui o assistente usa este material.
  bool vetorizado = 6;
  int64 criado_em = 7;
  int64 atualizado_em = 8;
}

message CreateMyTreinamentoRequest {
  string tag = 1;
  string grupo = 2;
  string conteudo = 3;
}

message MyTreinamentoResponse {
  MyTreinamento treinamento = 1;
}

message ListMyTreinamentosRequest {}

message ListMyTreinamentosResponse {
  repeated MyTreinamento treinamentos = 1;
}

message GetMyTreinamentoRequest {
  int32 id = 1;
}

message FinalizarMyTreinamentoRequest {
  int32 id = 1;
  // O texto como ficou depois da revisão — é ele que vira vetor.
  string conteudo = 2;
}

message RemoverMyTreinamentoRequest {
  int32 id = 1;
}

message SimpleOkResponse {
  bool sucesso = 1;
}

message StreamAtendimentosRequest {}

message AtendimentoEvent {
  string event_type = 1;
  string tenant_id = 2;
  string payload = 3;
}



