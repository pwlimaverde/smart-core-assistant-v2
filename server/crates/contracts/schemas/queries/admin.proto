syntax = "proto3";
package smartcore.contracts.queries;

// --- Configurações Globais (CoreSettings) ---
message CoreSetting {
  string key = 1;
  string value = 2;
  bool encrypted = 3;
  string description = 4;
}

message ListCoreSettingsRequest {}

message ListCoreSettingsResponse {
  repeated CoreSetting settings = 1;
}

message UpsertCoreSettingRequest {
  string key = 1;
  string value = 2;
  bool encrypted = 3;
  string description = 4;
}

message UpsertCoreSettingResponse {
  bool success = 1;
}

message DeleteCoreSettingRequest {
  string key = 1;
}

message DeleteCoreSettingResponse {
  bool success = 1;
}

// --- Entrada de Chave de API ---
message ApiKeyEntry {
  string key = 1;
  string value = 2;
}

// --- Configurações de Tenant (TenantConfig) ---
message GetTenantConfigRequest {
  string tenant_id = 1;
}

message GetTenantConfigResponse {
  string dados_empresa = 1;
  string persona_bot = 2;
  string bot_agent_name = 3;
  string msg_fallback = 4;
  string msg_sem_info = 5;
  string msg_transferencia = 6;
  string llm_class = 7;
  string model = 8;
  string llm_temperature = 9;
  string transcription_provider = 10;
  string transcription_model = 11;
  string vision_provider = 12;
  string vision_model = 13;
  string embeddings_class = 14;
  string embeddings_model = 15;
  int32 chunk_size = 16;
  int32 chunk_overlap = 17;
  string similarity_threshold = 18;
  string vector_distance_threshold = 19;
  repeated ApiKeyEntry api_keys = 20;
  // B4 — limiares de confiança da IA, como string decimal ("0.80").
  // Vazio = não mexer. "0" em confianca_minima_transferencia desliga o veto.
  string confianca_minima_transferencia = 21;
  string confianca_minima_automatica = 22;
}

message UpdateTenantConfigRequest {
  string tenant_id = 1;
  string dados_empresa = 2;
  string persona_bot = 3;
  string bot_agent_name = 4;
  string msg_fallback = 5;
  string msg_sem_info = 6;
  string msg_transferencia = 7;
  string llm_class = 8;
  string model = 9;
  string llm_temperature = 10;
  string transcription_provider = 11;
  string transcription_model = 12;
  string vision_provider = 13;
  string vision_model = 14;
  string embeddings_class = 15;
  string embeddings_model = 16;
  int32 chunk_size = 17;
  int32 chunk_overlap = 18;
  string similarity_threshold = 19;
  string vector_distance_threshold = 20;
  repeated ApiKeyEntry api_keys = 21;
  // B4 — limiares de confiança da IA, como string decimal ("0.80").
  // Vazio = não mexer. "0" em confianca_minima_transferencia desliga o veto.
  string confianca_minima_transferencia = 22;
  string confianca_minima_automatica = 23;
}

message UpdateTenantConfigResponse {
  bool success = 1;
}

// --- FASE 2: Entidades de Tenants & Billing ---

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  string api_key = 4;
  int32 owner_id = 5;
  string email = 6;
  string phone = 7;
  bool active = 8;
  bool setup_completed = 9;
  int32 onboarding_step = 10;
  string access_code = 11;
  int64 created_at = 12; // timestamp_millis
  int64 updated_at = 13; // timestamp_millis
}

message Plan {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string price = 4; // Decimal como string (evita perda de precisão)
  int32 max_instances = 5;
  int32 max_departments = 6;
  bool active = 7;
  int64 created_at = 8;
  int32 max_fluxos = 9;
}

message Subscription {
  int32 id = 1;
  string tenant_id = 2;
  int32 plan_id = 3;
  string status = 4;
  int64 current_period_start = 5;
  int64 current_period_end = 6;
  string payment_gateway = 7;
  string external_customer_id = 8;
  string external_subscription_id = 9;
  int64 updated_at = 10;
}

message PaymentRecord {
  int32 id = 1;
  string tenant_id = 2;
  string amount = 3;
  string payment_date = 4; // YYYY-MM-DD
  string payment_method = 5;
  string period_start = 6;  // YYYY-MM-DD
  string period_end = 7;    // YYYY-MM-DD
  string notes = 8;
  int32 recorded_by_id = 9;
  int64 created_at = 10;
}

// --- Requisições/Respostas de Tenants ---

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message GetTenantRequest {
  string id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message CreateTenantRequest {
  string name = 1;
  string slug = 2;
  int32 owner_id = 3;
  string email = 4;
  string phone = 5;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message UpdateTenantRequest {
  string id = 1;
  string name = 2;
  string slug = 3;
  int32 owner_id = 4;
  string email = 5;
  string phone = 6;
}

message UpdateTenantResponse {
  bool success = 1;
}

message SetTenantActiveRequest {
  string id = 1;
  bool active = 2;
}

message SetTenantActiveResponse {
  bool success = 1;
}

message GenerateAccessCodeRequest {
  string id = 1;
}

message GenerateAccessCodeResponse {
  string access_code = 1;
}

// --- Requisições/Respostas de Billing ---

message ListPlansRequest {}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreatePlanRequest {
  string name = 1;
  string description = 2;
  string price = 3;
  int32 max_instances = 4;
  int32 max_departments = 5;
  int32 max_fluxos = 6;
}

message CreatePlanResponse {
  Plan plan = 1;
}

message UpdatePlanRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  int32 max_instances = 5;
  int32 max_departments = 6;
  bool active = 7;
  int32 max_fluxos = 8;
}

message UpdatePlanResponse {
  bool success = 1;
}

// --- Vouchers de ativação (meio de pagamento, não cupom de desconto) ---

message Voucher {
  string id = 1;
  string codigo = 2;
  string descricao = 3;
  int32 plan_id = 4;
  string plan_name = 5;
  int32 duracao_dias = 6;
  // 0 = ilimitado.
  int32 max_resgates = 7;
  int32 resgates_usados = 8;
  int64 valido_de = 9;
  // 0 = não expira sozinho.
  int64 valido_ate = 10;
  // 0 = não revogado. Revogar bloqueia NOVOS resgates e preserva as
  // assinaturas já concedidas.
  int64 revogado_em = 11;
  string motivo_revogacao = 12;
  int64 created_at = 13;
}

message VoucherRedemption {
  string id = 1;
  string voucher_id = 2;
  string tenant_id = 3;
  int32 plan_id = 4;
  int64 periodo_inicio = 5;
  int64 periodo_fim = 6;
  string ip = 7;
  int64 redeemed_at = 8;
}

message ListVouchersRequest {}

message ListVouchersResponse {
  repeated Voucher vouchers = 1;
}

message CreateVoucherRequest {
  string codigo = 1;
  string descricao = 2;
  int32 plan_id = 3;
  int32 duracao_dias = 4;
  // 0 = ilimitado (campanha aberta). O cliente sempre envia o valor escolhido
  // na tela; o padrão da tela é 1, o mais conservador.
  int32 max_resgates = 5;
  // RFC 3339; vazio = sem expiração.
  string valido_ate = 6;
}

message CreateVoucherResponse {
  Voucher voucher = 1;
}

message RevokeVoucherRequest {
  string voucher_id = 1;
  string motivo = 2;
}

message RevokeVoucherResponse {
  // false = já estava revogado (não é erro).
  bool revogado = 1;
}

message ListVoucherRedemptionsRequest {
  string voucher_id = 1;
}

message ListVoucherRedemptionsResponse {
  repeated VoucherRedemption resgates = 1;
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message RegisterPaymentRequest {
  string tenant_id = 1;
  string amount = 2;
  string payment_method = 3;
  string payment_date = 4; // YYYY-MM-DD
  string period_start = 5;  // YYYY-MM-DD
  string period_end = 6;    // YYYY-MM-DD
  string notes = 7;
}

message RegisterPaymentResponse {
  PaymentRecord payment = 1;
}

message ListPaymentsRequest {
  string tenant_id = 1; // Opcional: filtra por tenant, se vazio lista todos
}

message ListPaymentsResponse {
  repeated PaymentRecord payments = 1;
}

// --- Requisições/Respostas de Faturamento ---
// ...

// --- Fase 3: Evolution Connection ---
message TestEvolutionConnectionRequest {
  string tenant_id = 1;
}

message TestEvolutionConnectionResponse {
  string status = 1; // "open", "connecting", "close", "error"
  string error_message = 2;
}

// --- Fase 4: Feature Flags ---
message FeatureFlagOverride {
  string tenant_id = 1;
  bool enabled = 2;
}

message FeatureFlag {
  string key = 1;
  string description = 2;
  bool enabled_globally = 3;
  repeated FeatureFlagOverride overrides = 4;
}

message ListFeatureFlagsRequest {}

message ListFeatureFlagsResponse {
  repeated FeatureFlag flags = 1;
}

message SetFeatureFlagRequest {
  string key = 1;
  bool enabled_globally = 2;
}

message SetFeatureFlagResponse {
  bool success = 1;
}

message SetFeatureFlagOverrideRequest {
  string key = 1;
  string tenant_id = 2;
  bool enabled = 3;
  bool remove_override = 4;
}

message SetFeatureFlagOverrideResponse {
  bool success = 1;
}

// --- Fase 5: Auditoria & Saúde ---
message AuditLogEntry {
  int32 id = 1;
  string event_type = 2;
  string actor = 3;
  string tenant_id = 4;
  string description = 5;
  string ip_address = 6;
  string user_agent = 7;
  int64 created_at = 8;
}

message QueryAuditLogRequest {
  string tenant_id = 1;
  string event_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message QueryAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total_count = 2;
}

message ServiceHealth {
  string service_name = 1;
  string status = 2; // "healthy", "unhealthy", "degraded"
  string message = 3;
  int64 response_time_ms = 4;
}

message GetServiceHealthRequest {}

message GetServiceHealthResponse {
  repeated ServiceHealth services = 1;
}

message GetDashboardSummaryRequest {}

message GetDashboardSummaryResponse {
  int32 total_tenants = 1;
  int32 active_tenants = 2;
  int32 total_subscriptions = 3;
  string monthly_recurring_revenue = 4;
  repeated ServiceHealth health = 5;
}

message ExportTenantsCsvRequest {}

message ExportTenantsCsvResponse {
  bytes chunk = 1;
}

// --- Fase 6: Operacional (fila/Kanban/chat — WS-6) ---
message AtendimentoResumo {
  int32 id = 1;
  int32 contato_id = 2;
  string status = 3;
  int32 departamento_id = 4;      // 0 = ausente
  int32 fluxo_atendimento_id = 5; // 0 = ausente
  int32 etapa_atual_id = 6;       // 0 = ausente
  string assunto = 7;
  string prioridade = 8;
  int32 atendente_humano_id = 9;  // 0 = ausente
  int64 data_inicio = 10;
  int64 data_ultima_mensagem = 11;
  optional int32 sentimento_nota = 12;    // última leitura de sentimento da IA (N6.5)
  optional string sentimento_label = 13; // ex.: positivo/neutro/negativo
  int32 nao_lidas = 14;                  // B6 (N9/E4): mensagens do contato ainda não lidas
}

message ListAtendimentosRequest {
  // Vazio = o quadro inteiro (tudo que nao foi arquivado).
  string status = 1;
  int32 departamento_id = 2; // 0 = todos os departamentos
  int32 limit = 3;
  // P1 (paridade v1 `list_conversations`): o mesmo recorte que a v1 fazia.
  // Casa nome do contato, nome do perfil do WhatsApp, telefone e assunto.
  string busca = 4;
  // 0 = todos. Use -1 para "sem dono" (a fila que ninguem assumiu).
  int32 atendente_id = 5;
  bool somente_nao_lidos = 6;
  string prioridade = 7;     // vazio = todas
  int64 etiqueta_id = 8;     // 0 = todas
  // "minhas conversas": o servidor resolve o atendente pelo usuario logado,
  // como a v1 fazia — o cliente nao conhece o id do atendente.
  bool somente_meus = 9;
}

message ListAtendimentosResponse {
  repeated AtendimentoResumo atendimentos = 1;
}

// Mídia anexada a uma mensagem da thread (N9/E2).
//
// A `url_assinada` é gerada NO MOMENTO da leitura da thread, com TTL curto. Não
// é URL permanente nem proxy pelo backend: presign curto é o que o R2 faz bem, e
// virar CDN não é papel do servidor.
message MidiaMensagem {
  string kind = 1;                 // image | audio | video | document
  string url_assinada = 2;         // credencial temporária — não persistir no cliente
  string mimetype = 3;
  string filename = 4;
  int64 size_bytes = 5;
  optional int32 seconds = 6;      // duração, para áudio/vídeo
  optional bool is_ptt = 7;        // áudio gravado na hora (push-to-talk)
}

message MensagemThread {
  int32 id = 1;
  int32 atendimento_id = 2;
  string tipo = 3;
  string conteudo = 4;
  string remetente = 5;
  int64 timestamp = 6;
  string status_envio = 7;
  bool gerado_por_ia = 8;            // selo "gerado por IA" no chat (N6.2)
  optional string resumo_midia = 9;  // resumo/transcrição da mídia analisada (N6.1/N6.2)
  // N9/E2: presente só quando a mensagem tem mídia.
  optional MidiaMensagem midia = 10;
  // N9/E7: ticks de entrega e leitura. As colunas existem desde a 0006 e nunca
  // foram expostas — sem elas a bolha não distingue "enviado" de "lido".
  optional int64 data_entregue = 11;
  optional int64 data_lida = 12;
  // N9/E6: citação (responder mensagem). Colunas existentes desde a 0006.
  optional int32 mensagem_citada_id = 13;
  optional string citada_remetente = 14;
  optional string citada_preview = 15;
}

message GetThreadRequest {
  int32 atendimento_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // P2 — rolar para cima carrega o que veio ANTES desta mensagem, como o
  // `get_messages(before_id=...)` da v1. Paginar por offset numa conversa que
  // recebe mensagem enquanto se rola repete ou pula bolha; o cursor nao.
  // Quando presente, `offset` e ignorado.
  optional int32 before_id = 4;
}

message GetThreadResponse {
  repeated MensagemThread mensagens = 1;
}

// C3 — iniciar um atendimento a partir de um cliente ja cadastrado.
//
// Ate aqui um atendimento so nascia de uma mensagem que chegou: para procurar
// o cliente era preciso abrir o WhatsApp por fora, e o historico da conversa
// comecava pela metade.
message IniciarAtendimentoManualRequest {
  int32 contato_id = 1;
  // Fluxo e etapa sao OBRIGATORIOS, ao contrario da ingestao (que cria sem
  // etapa e preenche depois). Um atendimento sem etapa nao aparece em coluna
  // nenhuma do quadro — nasceria invisivel.
  int32 fluxo_id = 2;
  int32 etapa_inicial_id = 3;
  optional int32 departamento_id = 4;
  optional string assunto = 5;
}

message IniciarAtendimentoManualResponse {
  int32 atendimento_id = 1;
  // TRUE quando ja havia conversa aberta com esse contato: vale a invariante
  // de um atendimento ativo por contato, e a tela ABRE a existente em vez de
  // criar um segundo cartao para o mesmo cliente.
  bool ja_existia = 2;
}

message MoveAtendimentoEtapaRequest {
  int32 atendimento_id = 1;
  int32 etapa_destino_id = 2;
  string motivo = 3;
  // N7.2: idempotência do sync offline. Campo aditivo/opcional — clientes
  // antigos (sem action_id) seguem funcionando sem dedupe server-side.
  optional string action_id = 4;
}

message MoveAtendimentoEtapaResponse {
  bool success = 1;
}

// O par simetrico de MoveAtendimentoEtapa: la a coluna manda no status, aqui o
// status manda na coluna. Encerrar pelo chat sem isto deixaria o cartao parado
// na coluna de trabalho, e o quadro passaria a mentir sobre o que esta aberto.
message SetAtendimentoStatusRequest {
  int32 atendimento_id = 1;
  // Vocabulario fechado: fila, em_atendimento, pendencia, resolvido,
  // cancelado, arquivado.
  string status = 2;
  string motivo = 3;
}

message SetAtendimentoStatusResponse {
  bool success = 1;
  string status = 2;
  // Onde o cartao ficou. 0 quando o fluxo nao tem coluna daquele tipo -- o
  // cartao fica onde estava, que e melhor que sumir do quadro.
  int32 etapa_atual_id = 3;
}

message SendOutboundMessageRequest {
  int32 atendimento_id = 1;
  string conteudo = 2;
  string tipo = 3; // default "texto" no cliente quando vazio
  // N7.2: idempotência do sync offline. Campo aditivo/opcional — clientes
  // antigos (sem action_id) seguem funcionando sem dedupe server-side.
  optional string action_id = 4;
  // N9/E6: responder citando outra mensagem da mesma thread.
  optional int32 mensagem_citada_id = 5;
}

message SendOutboundMessageResponse {
  int32 message_id = 1;
}

// --- N9a: mídia na conversa ---

// Passo 1 do envio: pedir onde subir. O binário NÃO trafega pelo gRPC-Web.
message SolicitarUploadMidiaRequest {
  int32 atendimento_id = 1;
  string nome_arquivo = 2;
  string mimetype = 3;
  int64 bytes = 4;
}

message SolicitarUploadMidiaResponse {
  // URL pré-assinada de PUT. É credencial de escrita: usar e descartar.
  string url_upload = 1;
  // Chave do objeto no bucket — é o que volta em EnviarMidiaAtendimento.
  string chave = 2;
  // Content-Type que o PUT DEVE mandar: o R2 recusa se divergir do assinado.
  string content_type = 3;
  int64 expira_em_segundos = 4;
}

// Passo 3: o upload terminou. O servidor confere o conteúdo (magic bytes),
// contabiliza a quota e só então põe a mensagem na thread.
message EnviarMidiaAtendimentoRequest {
  int32 atendimento_id = 1;
  string chave = 2;
  string mimetype = 3;
  string nome_arquivo = 4;
  string legenda = 5;
  optional bool is_ptt = 6;
  // Mesma idempotência do envio de texto (N7.2).
  optional string action_id = 7;
}

message EnviarMidiaAtendimentoResponse {
  int32 message_id = 1;
}

// P3 — "digitando..." / "gravando audio..." do atendente para o contato.
//
// E efemero: nao grava nada, nao entra na thread. O `data_whatsapp` ja sabia
// mandar (`SetWhatsappPresence`); faltava caminho da borda ate ele.
message EnviarPresencaRequest {
  int32 atendimento_id = 1;
  // "composing", "recording" ou "paused".
  string situacao = 2;
}

message EnviarPresencaResponse {
  bool enviado = 1;
}

message ListarMidiasAtendimentoRequest {
  int32 atendimento_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListarMidiasAtendimentoResponse {
  repeated MidiaMensagem midias = 1;
}

// --- Fase N3: Painel do Tenant (convites, usuários e config tenant-scoped) ---
// Diferente das rotas de superusuário: exigem apenas autenticação (o RBAC fino
// `tenant:admin` é aplicado dentro do data_postgres). O tenant_id NUNCA vem do
// request — é sempre derivado das claims da sessão (um tenant não age sobre outro).

message CreateInviteRequest {
  string email = 1;
  string name = 2;
  string role = 3;
  repeated string module_permissions = 4;
  repeated int32 flow_permissions = 5;
}

// Convite recém-criado. É o ÚNICO ponto onde o `token` é exposto (momento da
// criação); as listagens jamais o retornam.
message TenantInviteCreated {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string name = 4;
  string role = 5;
  string token = 6;
  int64 expires_at = 7; // timestamp_millis
  bool used = 8;
  int64 created_at = 9; // timestamp_millis
}

message CreateInviteResponse {
  TenantInviteCreated invite = 1;
}

// Rota PÚBLICA (sem sessão): o convidado cria a própria conta a partir do token.
message AcceptInviteRequest {
  string token = 1;
  string username = 2;
  string email = 3;
  string password = 4;
}

message AcceptedTenantUser {
  int32 id = 1;
  int32 user_id = 2;
  string tenant_id = 3;
  string role = 4;
  repeated string module_permissions = 5;
  repeated int32 flow_permissions = 6;
  bool is_active = 7;
}

message AcceptInviteResponse {
  AcceptedTenantUser tenant_user = 1;
}

message ListInvitesRequest {}

message TenantInviteItem {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  repeated string module_permissions = 5;
  repeated int32 flow_permissions = 6;
  int64 expires_at = 7; // timestamp_millis
  bool used = 8;
  bool revoked = 9;
  int64 created_at = 10; // timestamp_millis
}

message ListInvitesResponse {
  repeated TenantInviteItem invites = 1;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {
  bool success = 1;
}

// N11 E8 — reenviar o e-mail de um convite pendente ou vencido. Renova a
// validade e mantém o mesmo link.
message ReenviarConviteRequest {
  string invite_id = 1;
}

message ReenviarConviteResponse {
  // Nova validade, em milissegundos desde a época.
  int64 expires_at = 1;
}

// D7 — usuarios de TODOS os tenants, para o painel do superusuario.
//
// `ListTenantUsers` resolve o tenant a partir das claims de quem chama e nunca
// enxerga alem do proprio; a v1 tinha esta visao global no admin do Django.
message AdminListUsersRequest {
  // Casa em username, e-mail e nome. Vazio lista todo mundo.
  string busca = 1;
  int32 limite = 2;   // teto de 200 no servidor
  int32 offset = 3;
}

message AdminUserItem {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string nome = 4;
  bool is_active = 5;
  bool is_superuser = 6;
  int64 last_login = 7;   // timestamp_millis; 0 = nunca entrou
  int64 date_joined = 8;  // timestamp_millis
  string tenant_dono = 9;    // tenant de que e DONO, se for
  string tenant_membro = 10; // tenant em que e FUNCIONARIO, se for
  string papel = 11;         // papel como funcionario
}

message AdminListUsersResponse {
  repeated AdminUserItem usuarios = 1;
}

// D7 — bloqueia/desbloqueia o acesso de um usuario.
message AdminSetUserActiveRequest {
  int32 user_id = 1;
  bool ativo = 2;
}

message AdminSetUserActiveResponse {
  bool ativo = 1;
}

// ---------------------------------------------------------------------------
// N13 — Consentimentos OAuth dos clientes MCP ("Aplicativos conectados")
// ---------------------------------------------------------------------------

message ListMcpGrantsRequest {}

message McpGrantItem {
  string id = 1;
  // URL do Client ID Metadata Document — é o identificador do cliente na spec
  // MCP (Dynamic Client Registration foi deprecado).
  string client_id = 2;
  // Nome exibido, vindo do documento do terceiro. TEXTO NÃO CONFIÁVEL: escapar
  // na renderização.
  string client_name = 3;
  // Guardado inteiro para a trilha; a tela mostra só o hostname, que é o que o
  // usuário consegue reconhecer.
  string redirect_uri = 4;
  repeated string scopes = 5;
  int64 last_used_at = 6; // timestamp_millis; 0 = nunca usado
  int64 created_at = 7;   // timestamp_millis
}

message ListMcpGrantsResponse {
  repeated McpGrantItem grants = 1;
}

message RevokeMcpGrantRequest {
  string grant_id = 1;
}

message RevokeMcpGrantResponse {
  bool success = 1;
  // Minutos que o acesso em curso ainda pode durar depois da revogação (o
  // access token morre no `exp`). Vem do servidor para que a tela não precise
  // repetir um número que a configuração pode mudar.
  int32 janela_revogacao_min = 2;
}

// B7 (doc 35-agentes F4) — reduz as permissões de um aplicativo conectado sem
// desconectá-lo. Só reduz: ampliar exige reconectar e aprovar no consentimento.
message AjustarEscoposMcpGrantRequest {
  string grant_id = 1;
  repeated string scopes = 2; // o que deve FICAR; subconjunto do que o grant tem
}

message AjustarEscoposMcpGrantResponse {
  repeated string scopes = 1;
  // Minutos até o agente sentir a mudança: vale na renovação seguinte do token.
  int32 janela_min = 2;
}

// B3 (doc 35-agentes F1) — "o que o agente fez": a trilha do PRÓPRIO tenant.
// Distinta de QueryAuditLog (superusuário, cross-tenant): aqui o tenant vem da
// sessão, e quem não é tenant:admin só vê o que os próprios agentes fizeram.
message ListMyAuditLogRequest {
  // "" = tudo | "mcp" = só agentes | "painel" = só pessoas. Para quem não é
  // admin o servidor usa sempre "mcp".
  string origem = 1;
  // Restringe a um aplicativo conectado (o `id` de McpGrantItem).
  string grant_id = 2;
  // Só o que aconteceu a partir deste instante (ms desde a época). 0 = tudo.
  int64 desde = 3;
  // Teto de 200 no servidor.
  int32 limit = 4;
  int32 offset = 5;
}

// Sem a mensagem do evento, de propósito: alguns eventos guardam nome ou
// e-mail na mensagem, e esta tela não mostra dado pessoal.
message MyAuditLogEntry {
  int64 timestamp = 1;
  string event_type = 2;
  // "mcp" | "painel" — derivada do user_agent, não um campo da tabela.
  string origem = 3;
  // Nome do aplicativo, quando a origem é mcp. TEXTO DE TERCEIRO: escapar.
  string client_name = 4;
  // Operação chamada pelo agente, quando a origem é mcp.
  string tool = 5;
  int32 user_id = 6;
  string user_nome = 7;
  string grant_id = 8;
}

message ListMyAuditLogResponse {
  repeated MyAuditLogEntry entries = 1;
}

message ListTenantUsersRequest {}

message TenantUserItem {
  int32 id = 1;
  int32 user_id = 2;
  string role = 3;
  repeated string module_permissions = 4;
  repeated int32 flow_permissions = 5;
  bool is_active = 6;
  int64 created_at = 7; // timestamp_millis
}

message ListTenantUsersResponse {
  repeated TenantUserItem users = 1;
}

// Campos opcionais em proto3: como não há `optional`/wrappers no projeto e listas
// repetidas não distinguem "vazio" de "ausente", usamos flags companion `set_*`.
// Só os campos com a flag correspondente `true` são alterados no data_postgres.
message UpdateTenantUserRequest {
  int32 user_id = 1;
  bool set_role = 2;
  string role = 3;
  bool set_module_permissions = 4;
  repeated string module_permissions = 5;
  bool set_flow_permissions = 6;
  repeated int32 flow_permissions = 7;
}

message UpdateTenantUserResponse {
  bool success = 1;
}

// --- Configuração inicial guiada (passos 5 a 8 do onboarding) ---
//
// O tenant sai do pagamento com a conta criada, mas sem nada operando. Estes
// RPCs são o que o roteiro guiado usa para deixá-lo funcionando: conectar o
// WhatsApp, criar o primeiro departamento e registrar até onde ele chegou.
//
// Todos com escopo de TENANT (o `tenant_id` vem das claims, nunca do request) —
// diferente dos RPCs de instância do superusuário, que operam cross-tenant.

message CreateMyWhatsappInstanceRequest {
  // Nome da instância no provedor. Precisa ser único entre todos os tenants.
  string instance_name = 1;
}

message CreateMyWhatsappInstanceResponse {
  int32 id = 1;
  string instance_name = 2;
  string provider = 3;
}

message GetMyWhatsappInstanceStatusRequest {
  int32 id = 1;
}

message GetMyWhatsappInstanceStatusResponse {
  // `connected`, `disconnected`, `connecting` ou `unknown`.
  string connection_state = 1;
  // QR em base64 para o pareamento; vazio quando já conectado (ou quando o
  // provedor ainda não o gerou).
  string qr_code = 2;
}

message CreateMyDepartamentoRequest {
  string nome = 1;
  string descricao = 2;
}

message CreateMyDepartamentoResponse {
  int32 id = 1;
  string nome = 2;
}

// Define a persona do bot no passo 7.
//
// RPC dedicado, e não `UpdateMyTenantConfig`: aquele carrega o objeto de
// configuração inteiro, e em proto3 um campo não preenchido chega como string
// vazia — o UPSERT do `data_postgres` faz `COALESCE(EXCLUDED.campo, atual)`, de
// modo que "" SOBRESCREVE o valor existente. Mandar só a persona por ali
// apagaria modelo de LLM, thresholds e o resto da configuração de IA.
message SetMyBotPersonaRequest {
  string persona_bot = 1;
  string bot_agent_name = 2;
}

message SetMyBotPersonaResponse {
  bool success = 1;
}

// Registra até onde o tenant chegou na configuração guiada.
//
// O progresso vive no servidor, e não no app, para que fechar o programa e
// reabrir continue de onde parou — num app instalado isso é o esperado.
message SetOnboardingProgressRequest {
  // 5..8. O passo 8 conclui o roteiro e marca `setup_completed`.
  int32 passo = 1;
  // true = o tenant terminou (ou pulou o que faltava) e vai para o workspace.
  bool concluido = 2;
}

message SetOnboardingProgressResponse {
  int32 passo = 1;
  bool concluido = 2;
}

// Lê o progresso gravado — a contraparte que faltava do `SetOnboardingProgress`.
//
// Sem ela o progresso era gravado e nunca lido: quem fechava o app no meio da
// configuração reabria direto no workspace vazio, sem caminho de volta ao
// roteiro, com a conta paga e inutilizável.
message GetMyOnboardingProgressRequest {}

message GetMyOnboardingProgressResponse {
  // 5..8 enquanto o roteiro corre. 0 = nunca registrou nada.
  int32 passo = 1;
  // true = terminou (ou pulou o que faltava); o app vai para o workspace.
  bool concluido = 2;
  // Campos aditivos: o progresso não dizia nada sobre dinheiro, e por isso o
  // guard mandava para /configuracao/* quem nunca pagou. Aditivos de propósito —
  // campo novo em proto3 não quebra cliente antigo, que segue no comportamento
  // atual (degradado, não quebrado) enquanto não atualiza.
  //
  // subscription.status != ACTIVE. Sem assinatura nenhuma também conta como
  // pendente: o tenant não pode operar.
  bool pagamento_pendente = 3;
  // PENDING_PAYMENT | ACTIVE | SUSPENDED | ... Vazio = sem assinatura.
  string assinatura_status = 4;
  // Para a tela dizer o que está sendo cobrado. Vazio = plano não escolhido.
  string plano_nome = 5;
  // 0 = plano não escolhido.
  int32 plano_id = 6;
}

// Quitação da assinatura **depois do login**.
//
// O `ConfirmPayment` do wizard exige `signup_token`, que morre com a sessão de
// cadastro. Sem este RPC, um tenant cuja sessão expirou no meio do wizard entra
// no app e não tem como pagar: esbarra em "assinatura inadimplente" a cada
// cadastro e não existe tela que resolva.
//
// O `tenant_id` vem das **claims**, nunca do request — mesma regra dos demais
// `*My*`. Exige escopo `tenant:admin`: cobrança é assunto do dono, não do
// colaborador.
message QuitarMinhaAssinaturaRequest {
  // `id` de um PaymentProvider (hoje só `voucher`).
  string provedor = 1;
  // O que o dono digitou. Para `voucher`, o código. É credencial: não entra em
  // span, log nem auditoria.
  string credencial = 2;
}

message QuitarMinhaAssinaturaResponse {
  // true = assinatura ativa ao fim da chamada (inclusive se já estava).
  bool confirmado = 1;
  string assinatura_status = 2;
  // Preenchida quando o provedor exige concluir o pagamento fora do app.
  string url_externa = 3;
  // Recusa de negócio (código expirado, já usado...). Vai para junto do campo
  // na tela, não para um erro de RPC.
  string motivo = 4;
  string erro_legivel = 5;
}

// N3.3: config do PRÓPRIO tenant (tenant_id vem das claims, não do request).
// Reaproveita GetTenantConfigResponse/UpdateTenantConfigResponse. As api_keys já
// vêm mascaradas do data_postgres (`••••••••`), igual ao caminho do superusuário.
message GetMyTenantConfigRequest {}

message UpdateMyTenantConfigRequest {
  string dados_empresa = 1;
  string persona_bot = 2;
  string bot_agent_name = 3;
  string msg_fallback = 4;
  string msg_sem_info = 5;
  string msg_transferencia = 6;
  string llm_class = 7;
  string model = 8;
  string llm_temperature = 9;
  string transcription_provider = 10;
  string transcription_model = 11;
  string vision_provider = 12;
  string vision_model = 13;
  string embeddings_class = 14;
  string embeddings_model = 15;
  int32 chunk_size = 16;
  int32 chunk_overlap = 17;
  string similarity_threshold = 18;
  string vector_distance_threshold = 19;
  repeated ApiKeyEntry api_keys = 20;
  // B4 — limiares de confiança da IA, como string decimal ("0.80").
  // Vazio = não mexer. "0" em confianca_minima_transferencia desliga o veto.
  string confianca_minima_transferencia = 21;
  string confianca_minima_automatica = 22;
}

// --- Serviço Admin ---
service AdminService {
  rpc ListCoreSettings(ListCoreSettingsRequest) returns (ListCoreSettingsResponse);
  rpc UpsertCoreSetting(UpsertCoreSettingRequest) returns (UpsertCoreSettingResponse);
  rpc DeleteCoreSetting(DeleteCoreSettingRequest) returns (DeleteCoreSettingResponse);
  rpc GetTenantConfig(GetTenantConfigRequest) returns (GetTenantConfigResponse);
  rpc UpdateTenantConfig(UpdateTenantConfigRequest) returns (UpdateTenantConfigResponse);

  // Fase 2: Tenants
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminSetUserActive(AdminSetUserActiveRequest) returns (AdminSetUserActiveResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc SetTenantActive(SetTenantActiveRequest) returns (SetTenantActiveResponse);
  rpc GenerateAccessCode(GenerateAccessCodeRequest) returns (GenerateAccessCodeResponse);

  // Fase 2: Billing
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc RegisterPayment(RegisterPaymentRequest) returns (RegisterPaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);

  // Vouchers de ativação
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse);
  rpc CreateVoucher(CreateVoucherRequest) returns (CreateVoucherResponse);
  rpc RevokeVoucher(RevokeVoucherRequest) returns (RevokeVoucherResponse);
  rpc ListVoucherRedemptions(ListVoucherRedemptionsRequest) returns (ListVoucherRedemptionsResponse);

  // Fase 3: Evolution Connection
  rpc TestEvolutionConnection(TestEvolutionConnectionRequest) returns (TestEvolutionConnectionResponse);

  // Fase 4: Feature Flags
  rpc ListFeatureFlags(ListFeatureFlagsRequest) returns (ListFeatureFlagsResponse);
  rpc SetFeatureFlag(SetFeatureFlagRequest) returns (SetFeatureFlagResponse);
  rpc SetFeatureFlagOverride(SetFeatureFlagOverrideRequest) returns (SetFeatureFlagOverrideResponse);

  // Fase 5: Auditoria & Saúde
  rpc QueryAuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse);
  rpc GetServiceHealth(GetServiceHealthRequest) returns (GetServiceHealthResponse);
  rpc GetDashboardSummary(GetDashboardSummaryRequest) returns (GetDashboardSummaryResponse);
  rpc ExportTenantsCsv(ExportTenantsCsvRequest) returns (stream ExportTenantsCsvResponse);

  // Realtime
  rpc StreamAtendimentos(StreamAtendimentosRequest) returns (stream AtendimentoEvent);

  // Fase 6: Operacional (fila/Kanban/chat — WS-6). RBAC fino por fluxo (flow_permissions)
  // já é aplicado no data_postgres (WS-5a); estas rotas exigem só autenticação, não superuser.
  rpc ListAtendimentos(ListAtendimentosRequest) returns (ListAtendimentosResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc IniciarAtendimentoManual(IniciarAtendimentoManualRequest) returns (IniciarAtendimentoManualResponse);
  rpc MoveAtendimentoEtapa(MoveAtendimentoEtapaRequest) returns (MoveAtendimentoEtapaResponse);
  rpc SetAtendimentoStatus(SetAtendimentoStatusRequest) returns (SetAtendimentoStatusResponse);

  // Ficha do atendimento: etiquetas e anotacoes internas. As tabelas
  // existiam desde o comeco e nenhum app as alcancava.
  rpc GetDetalheAtendimento(AtendimentoIdRequest) returns (DetalheAtendimentoResponse);
  rpc CreateEtiqueta(CreateEtiquetaRequest) returns (EtiquetaResponse);
  rpc AlternarEtiqueta(AlternarEtiquetaRequest) returns (SimpleOkResponse);
  rpc CreateNota(CreateNotaRequest) returns (NotaResponse);
  rpc SendOutboundMessage(SendOutboundMessageRequest) returns (SendOutboundMessageResponse);

  // N9a — mídia na conversa. Upload em duas etapas (presign + confirmação) para
  // o binário não passar pelo envelope.
  rpc SolicitarUploadMidia(SolicitarUploadMidiaRequest) returns (SolicitarUploadMidiaResponse);
  rpc EnviarMidiaAtendimento(EnviarMidiaAtendimentoRequest) returns (EnviarMidiaAtendimentoResponse);
  rpc ListarMidiasAtendimento(ListarMidiasAtendimentoRequest) returns (ListarMidiasAtendimentoResponse);
  // P3 — presenca do atendente na conversa (efemera).
  rpc EnviarPresenca(EnviarPresencaRequest) returns (EnviarPresencaResponse);

  // Fase N3: Painel do Tenant. Exigem só autenticação (não superuser); o RBAC fino
  // `tenant:admin` é aplicado no data_postgres. AcceptInvite é rota pública (sem sessão).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc ReenviarConvite(ReenviarConviteRequest) returns (ReenviarConviteResponse);
  rpc ListTenantUsers(ListTenantUsersRequest) returns (ListTenantUsersResponse);
  rpc UpdateTenantUser(UpdateTenantUserRequest) returns (UpdateTenantUserResponse);
  rpc GetMyTenantConfig(GetMyTenantConfigRequest) returns (GetTenantConfigResponse);
  rpc UpdateMyTenantConfig(UpdateMyTenantConfigRequest) returns (UpdateTenantConfigResponse);

  // Fase N13: aplicativos de IA conectados por OAuth 2.1 (servidor MCP).
  // Cada usuário enxerga e revoga APENAS os próprios consentimentos — nem um
  // `tenant:admin` vê o do colega. Por isso não há variante administrativa.
  rpc ListMcpGrants(ListMcpGrantsRequest) returns (ListMcpGrantsResponse);
  rpc RevokeMcpGrant(RevokeMcpGrantRequest) returns (RevokeMcpGrantResponse);
  rpc AjustarEscoposMcpGrant(AjustarEscoposMcpGrantRequest) returns (AjustarEscoposMcpGrantResponse);
  rpc ListMyAuditLog(ListMyAuditLogRequest) returns (ListMyAuditLogResponse);

  // Configuração inicial guiada (passos 5 a 8)
  rpc CreateMyWhatsappInstance(CreateMyWhatsappInstanceRequest) returns (CreateMyWhatsappInstanceResponse);
  rpc GetMyWhatsappInstanceStatus(GetMyWhatsappInstanceStatusRequest) returns (GetMyWhatsappInstanceStatusResponse);
  rpc CreateMyDepartamento(CreateMyDepartamentoRequest) returns (CreateMyDepartamentoResponse);
  rpc SetMyBotPersona(SetMyBotPersonaRequest) returns (SetMyBotPersonaResponse);
  rpc SetOnboardingProgress(SetOnboardingProgressRequest) returns (SetOnboardingProgressResponse);
  rpc GetMyOnboardingProgress(GetMyOnboardingProgressRequest) returns (GetMyOnboardingProgressResponse);
  rpc QuitarMinhaAssinatura(QuitarMinhaAssinaturaRequest) returns (QuitarMinhaAssinaturaResponse);

  // Treinamento da IA (o tenant treina o próprio assistente)
  rpc CreateMyTreinamento(CreateMyTreinamentoRequest) returns (MyTreinamentoResponse);
  rpc ListMyTreinamentos(ListMyTreinamentosRequest) returns (ListMyTreinamentosResponse);

  // Curadoria de intencoes: o que a IA deve FAZER quando a pergunta se parecer
  // com um exemplo. Complementa o material treinado, que diz o que ela SABE.
  rpc ListMyIntents(ListMyIntentsRequest) returns (ListMyIntentsResponse);
  rpc CreateMyIntent(MyIntentDados) returns (MyIntentResponse);
  rpc UpdateMyIntent(UpdateMyIntentRequest) returns (SimpleOkResponse);
  rpc RemoveMyIntent(MyIntentIdRequest) returns (SimpleOkResponse);

  // Ensaio: a pergunta percorre o MESMO caminho de uma mensagem real (embed ->
  // RAG -> LLM), sem gravar atendimento nenhum. Validar o treinamento pelo
  // WhatsApp de verdade obrigaria a usar um numero real e sujar o historico.
  rpc TestarPergunta(TestarPerguntaRequest) returns (TestarPerguntaResponse);
  rpc SolicitarUploadTreinamento(SolicitarUploadTreinamentoRequest) returns (SolicitarUploadTreinamentoResponse);
  rpc CreateMyTreinamentoComArquivo(CreateMyTreinamentoComArquivoRequest) returns (MyTreinamentoResponse);
  rpc RegistrarFeedbackTeste(RegistrarFeedbackTesteRequest) returns (RegistrarFeedbackTesteResponse);
  rpc GetMyTreinamento(GetMyTreinamentoRequest) returns (MyTreinamentoResponse);
  rpc FinalizarMyTreinamento(FinalizarMyTreinamentoRequest) returns (SimpleOkResponse);
  rpc RemoverMyTreinamento(RemoverMyTreinamentoRequest) returns (SimpleOkResponse);

  // Gestão das conexões de WhatsApp DEPOIS de conectadas.
  //
  // O onboarding cria a primeira; sem estas, uma conexão que cai deixa o tenant
  // sem saída — não há como ver o estado, reconectar nem trocar de aparelho.
  rpc ListMyWhatsappInstances(ListMyWhatsappInstancesRequest) returns (ListMyWhatsappInstancesResponse);
  rpc DefinirRespostaBotInstancia(DefinirRespostaBotInstanciaRequest) returns (DefinirRespostaBotInstanciaResponse);
  rpc DefinirBotDaConversa(DefinirBotDaConversaRequest) returns (DefinirBotDaConversaResponse);
  // B6 (N9/E4): abrir a conversa e chegar ao fim dela marca o que o contato mandou.
  rpc MarcarAtendimentoLido(MarcarAtendimentoLidoRequest) returns (MarcarAtendimentoLidoResponse);
  rpc ReconnectMyWhatsappInstance(MyWhatsappInstanceIdRequest) returns (SimpleOkResponse);
  rpc DeleteMyWhatsappInstance(MyWhatsappInstanceIdRequest) returns (SimpleOkResponse);

  // Departamentos e atendentes — a estrutura para onde a fila manda conversa.
  rpc ListMyDepartamentos(ListMyDepartamentosRequest) returns (ListMyDepartamentosResponse);
  rpc UpdateMyDepartamento(UpdateMyDepartamentoRequest) returns (SimpleOkResponse);
  rpc DesativarMyDepartamento(MyDepartamentoIdRequest) returns (SimpleOkResponse);
  rpc ListMyAtendentes(ListMyAtendentesRequest) returns (ListMyAtendentesResponse);
  rpc CreateMyAtendente(CreateMyAtendenteRequest) returns (MyAtendenteResponse);
  rpc UpdateMyAtendente(UpdateMyAtendenteRequest) returns (SimpleOkResponse);
  rpc DesativarMyAtendente(MyAtendenteIdRequest) returns (SimpleOkResponse);
  rpc GetMyPainel(GetMyPainelRequest) returns (GetMyPainelResponse);
  rpc ListMyContatos(ListMyContatosRequest) returns (ListMyContatosResponse);
  // C4 — cadastro de contato pela tela. Ate aqui um contato so existia
  // porque mandou mensagem, e o "iniciar atendimento" do C3 nao achava
  // ninguem para escolher.
  rpc CreateMyContato(CreateMyContatoRequest) returns (MyContatoResponse);
  rpc UpdateMyContato(UpdateMyContatoRequest) returns (SimpleOkResponse);
  rpc DefinirMyContatoAtivo(DefinirMyContatoAtivoRequest) returns (SimpleOkResponse);
  // B10 (N11 E5): clientes (PJ/PF) e o vinculo com os contatos.
  rpc ListMyClientes(ListMyClientesRequest) returns (ListMyClientesResponse);
  rpc CreateMyCliente(CreateMyClienteRequest) returns (MyClienteResponse);
  rpc UpdateMyCliente(UpdateMyClienteRequest) returns (SimpleOkResponse);
  rpc DefinirMyClienteAtivo(DefinirMyClienteAtivoRequest) returns (SimpleOkResponse);
  rpc ListMyContatosDoCliente(MyClienteIdRequest) returns (ListMyContatosDoClienteResponse);
  rpc VincularMyContatoCliente(VincularMyContatoClienteRequest) returns (SimpleOkResponse);

  // N9 E13 — o catalogo de campos do cartao, por tenant.
  rpc ListMyCampos(ListMyCamposRequest) returns (ListMyCamposResponse);
  rpc CreateMyCampo(CreateMyCampoRequest) returns (MyCampoResponse);
  rpc UpdateMyCampo(UpdateMyCampoRequest) returns (SimpleOkResponse);
  rpc DesativarMyCampo(MyCampoIdRequest) returns (SimpleOkResponse);
  // Preenchimento manual na ficha do atendimento.
  rpc SetMyValorCampo(SetMyValorCampoRequest) returns (SimpleOkResponse);

  // Fluxos de atendimento e suas etapas — o quadro por onde a conversa anda.
  rpc ListMyFluxos(ListMyFluxosRequest) returns (ListMyFluxosResponse);
  rpc CreateMyFluxo(CreateMyFluxoRequest) returns (MyFluxoResponse);
  rpc UpdateMyFluxo(UpdateMyFluxoRequest) returns (SimpleOkResponse);
  rpc DesativarMyFluxo(MyFluxoIdRequest) returns (SimpleOkResponse);
  rpc ListMyEtapasFluxo(MyFluxoIdRequest) returns (ListMyEtapasFluxoResponse);
  rpc CreateMyEtapaFluxo(CreateMyEtapaFluxoRequest) returns (MyEtapaFluxoResponse);
  rpc UpdateMyEtapaFluxo(UpdateMyEtapaFluxoRequest) returns (SimpleOkResponse);
  rpc DesativarMyEtapaFluxo(MyEtapaFluxoIdRequest) returns (SimpleOkResponse);
  rpc MoverMyEtapaFluxo(MoverMyEtapaFluxoRequest) returns (SimpleOkResponse);
}

// --- Fluxos de atendimento ---
//
// O fluxo é o quadro; a etapa é a coluna. Cada atendimento mora numa etapa, e
// é a etapa do tipo `fila` que recebe conversa nova — por isso um fluxo nasce
// já com as quatro etapas padrão.

message MyFluxo {
  int32 id = 1;
  int32 departamento_id = 2;
  string departamento_nome = 3;
  string nome = 4;
  string descricao = 5;
  bool ativo = 6;
  int32 etapas = 7;
  // Conversas que ainda não terminaram neste fluxo. É o número que diz se
  // desativá-lo deixaria gente no meio do caminho.
  int32 atendimentos_abertos = 8;
  int64 criado_em = 9;
}

message ListMyFluxosRequest {}

message ListMyFluxosResponse {
  // Inativos vêm junto: escondê-los deixaria o tenant sem como reativar o que
  // desativou por engano.
  repeated MyFluxo fluxos = 1;
}

message CreateMyFluxoRequest {
  int32 departamento_id = 1;
  string nome = 2;
  string descricao = 3;
}

message MyFluxoResponse {
  MyFluxo fluxo = 1;
}

message UpdateMyFluxoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  bool ativo = 4;
}

message MyFluxoIdRequest {
  int32 id = 1;
}

message MyEtapaFluxo {
  int32 id = 1;
  int32 fluxo_id = 2;
  string nome = 3;
  string descricao = 4;
  int32 ordem = 5;
  string cor = 6;
  // Vocabulário fechado: fila, trabalho, espera, finalizacao. Não é enfeite —
  // o roteamento procura `fila` para saber onde a conversa entra.
  string tipo_etapa = 7;
  bool ativo = 8;
}

message ListMyEtapasFluxoResponse {
  repeated MyEtapaFluxo etapas = 1;
}

message CreateMyEtapaFluxoRequest {
  int32 fluxo_id = 1;
  string nome = 2;
  string tipo_etapa = 3;
  string cor = 4;
}

message MyEtapaFluxoResponse {
  MyEtapaFluxo etapa = 1;
}

message UpdateMyEtapaFluxoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  string cor = 4;
  string tipo_etapa = 5;
}

message MyEtapaFluxoIdRequest {
  int32 id = 1;
}

message MoverMyEtapaFluxoRequest {
  int32 id = 1;
  bool para_cima = 2;
}

// --- Contatos (quem fala com o tenant pelo WhatsApp) ---

message MyContato {
  int32 id = 1;
  string telefone = 2;
  // Nome cadastrado. Vazio quando o contato só existe pelo WhatsApp.
  string nome_contato = 3;
  // Como a pessoa se identifica no WhatsApp — muitas vezes é o único nome
  // que se tem.
  string nome_perfil_whatsapp = 4;
  string email = 5;
  bool ativo = 6;
  int64 ultima_interacao = 7;
  int64 cadastrado_em = 8;
}

// --- N9 E13: campos do cartao de atendimento -----------------------------
//
// Cada tenant desenha a ficha que faz sentido para o negocio dele: numero do
// pedido, data de retorno, tipo de produto. O modelo e o do Trello — nome,
// tipo de dado, e uma descricao que serve de instrucao para a IA preencher.

message OpcaoCampo {
  // Id estavel: e ele que fica gravado no valor. Renomear o rotulo depois nao
  // pode invalidar o que ja foi preenchido.
  string id = 1;
  string rotulo = 2;
}

message MyCampoPersonalizado {
  int64  id = 1;
  string slug = 2;
  string nome = 3;
  // Serve a duas leituras: explica o campo para quem preenche a mao e diz a
  // IA o que procurar. E a "descricao completa" do pedido original.
  string descricao = 4;
  // GLOBAL (todo atendimento) ou FLUXO (so o quadro escolhido).
  string escopo = 5;
  optional int32 fluxo_id = 6;
  // texto | numero | data | booleano | lista
  string tipo = 7;
  repeated OpcaoCampo opcoes = 8;
  // Regra de TELA: impede concluir o atendimento sem o campo.
  bool obrigatorio = 9;
  // Regra de PROMPT: a IA tenta obter no meio da conversa. Sao coisas
  // diferentes, e trata-las como uma so foi um defeito real (C2).
  bool extrair_automaticamente = 10;
  // Como perguntar sem soar interrogatorio.
  string extrair_hint = 11;
  bool mostrar_no_card = 12;
  int32 ordem = 13;
  bool ativo = 14;
}

message ListMyCamposRequest {
  // Vazio = todos. Com fluxo, devolve os GLOBAL mais os daquele quadro.
  optional int32 fluxo_id = 1;
}
message ListMyCamposResponse { repeated MyCampoPersonalizado campos = 1; }

message CreateMyCampoRequest {
  string nome = 1;
  string descricao = 2;
  string escopo = 3;
  optional int32 fluxo_id = 4;
  string tipo = 5;
  repeated OpcaoCampo opcoes = 6;
  bool obrigatorio = 7;
  bool extrair_automaticamente = 8;
  string extrair_hint = 9;
  bool mostrar_no_card = 10;
  int32 ordem = 11;
}
message MyCampoResponse { MyCampoPersonalizado campo = 1; }

message UpdateMyCampoRequest {
  int64  id = 1;
  string nome = 2;
  string descricao = 3;
  string tipo = 4;
  repeated OpcaoCampo opcoes = 5;
  bool obrigatorio = 6;
  bool extrair_automaticamente = 7;
  string extrair_hint = 8;
  bool mostrar_no_card = 9;
  int32 ordem = 10;
  bool ativo = 11;
}
message MyCampoIdRequest { int64 id = 1; }

// Preenchimento manual, pelo operador. A origem fica registrada: um valor
// escrito por gente nao pode ser sobrescrito pela IA depois.
message SetMyValorCampoRequest {
  int32  atendimento_id = 1;
  int64  campo_id = 2;
  // JSON na forma do `tipo`. `null` = apagar de proposito, que e diferente de
  // nunca ter sido preenchido: a IA nao repreenche o que alguem apagou.
  string valor_json = 3;
}

message ListMyContatosRequest {
  // Casa contra nome, telefone e nome do perfil. Vazio = sem filtro.
  string busca = 1;
  // 0 = padrão do servidor (50). Teto de 200.
  int32 limite = 2;
}

message ListMyContatosResponse {
  repeated MyContato contatos = 1;
}

message CreateMyContatoRequest {
  // Como a pessoa digitou. O servidor normaliza para o mesmo formato que a
  // ingestao grava (so digitos, com DDI) — sem isso o contato cadastrado a
  // mao e o mesmo numero que chega pelo WhatsApp virariam duas pessoas.
  string telefone = 1;
  string nome_contato = 2;
  string email = 3;
}

message MyContatoResponse {
  MyContato contato = 1;
}

message UpdateMyContatoRequest {
  int32 id = 1;
  string nome_contato = 2;
  string email = 3;
  // Vazio = nao mexe. So e aceito enquanto o contato nao tem conversa: o
  // historico esta amarrado ao numero, e troca-lo passaria as mensagens de
  // uma pessoa para outra.
  string telefone = 4;
}

message DefinirMyContatoAtivoRequest {
  int32 id = 1;
  bool ativo = 2;
}

// --- B10 (N11 E5): clientes (PJ/PF) ---
// CNPJ/CPF e endereco sao dado protegido: nunca em log.
message DadosMyCliente {
  string nome_fantasia = 1;
  string razao_social = 2;
  string tipo = 3;          // pj | pf | vazio
  string cnpj = 4;          // como digitado; o servidor guarda so digitos
  string cpf = 5;
  string telefone = 6;
  string site = 7;
  string ramo_atividade = 8;
  string observacoes = 9;
  string cep = 10;
  string logradouro = 11;
  string numero = 12;
  string complemento = 13;
  string bairro = 14;
  string cidade = 15;
  string uf = 16;
}

message MyCliente {
  int32 id = 1;
  DadosMyCliente dados = 2;
  bool ativo = 3;
  int32 contatos = 4;       // quantos contatos estao ligados a ele
}

message ListMyClientesRequest {
  string busca = 1;           // nome, razao social ou documento
  bool incluir_inativos = 2;
  int32 limite = 3;           // 0 = padrao do servidor (50); teto 200
}

message ListMyClientesResponse {
  repeated MyCliente clientes = 1;
}

message CreateMyClienteRequest {
  DadosMyCliente dados = 1;
}

message MyClienteResponse {
  MyCliente cliente = 1;
}

message UpdateMyClienteRequest {
  int32 id = 1;
  DadosMyCliente dados = 2;
}

message DefinirMyClienteAtivoRequest {
  int32 id = 1;
  bool ativo = 2;
}

message MyClienteIdRequest {
  int32 id = 1;
}

message ContatoDoCliente {
  int32 id = 1;
  string nome = 2;
  string telefone = 3;
}

message ListMyContatosDoClienteResponse {
  repeated ContatoDoCliente contatos = 1;
}

message VincularMyContatoClienteRequest {
  int32 cliente_id = 1;
  int32 contato_id = 2;
  bool vincular = 3;          // false = desligar
}

// --- Painel do tenant ---
//
// A primeira tela depois do login. Os números vêm de uma consulta só: cinco
// contagens do mesmo instante, e não cinco fotos de momentos diferentes.

message GetMyPainelRequest {}

message GetMyPainelResponse {
  int32 em_andamento = 1;
  int32 aguardando = 2;
  int32 mensagens_24h = 3;
  int32 conexoes_ativas = 4;
  int32 conexoes_total = 5;
  int32 departamentos = 6;
  int32 treinamentos_ativos = 7;
}

// --- Departamentos e atendentes ---

message MyDepartamento {
  int32 id = 1;
  string nome = 2;
  // Referência estável: NÃO muda ao renomear, porque há registros que apontam
  // para o departamento por ele.
  string slug = 3;
  string descricao = 4;
  bool ativo = 5;
  int64 criado_em = 6;
}

message ListMyDepartamentosRequest {}

message ListMyDepartamentosResponse {
  repeated MyDepartamento departamentos = 1;
}

message UpdateMyDepartamentoRequest {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  bool ativo = 4;
}

message MyDepartamentoIdRequest {
  int32 id = 1;
}

message MyAtendente {
  int32 id = 1;
  string nome = 2;
  string email = 3;
  string cargo = 4;
  // 0 = sem departamento.
  int32 departamento_id = 5;
  bool ativo = 6;
  // Aceitando conversa agora — diferente de `ativo`, que é o cadastro.
  bool disponivel = 7;
  int32 max_atendimentos_simultaneos = 8;
  // O quadro em que trabalha. Sem ele a edição não teria o que preencher no
  // seletor de fluxo, e salvar reatribuiria a pessoa por acidente.
  int32 fluxo_id = 9;
}

message ListMyAtendentesRequest {}

message ListMyAtendentesResponse {
  repeated MyAtendente atendentes = 1;
}

message CreateMyAtendenteRequest {
  string nome = 1;
  string email = 2;
  string cargo = 3;
  // Obrigatório: é o quadro em que a pessoa trabalha, e a coluna é NOT NULL.
  int32 fluxo_id = 4;
  // 0 = sem departamento.
  int32 departamento_id = 5;
}

message MyAtendenteResponse {
  MyAtendente atendente = 1;
}

message UpdateMyAtendenteRequest {
  int32 id = 1;
  string nome = 2;
  string cargo = 3;
  int32 departamento_id = 4;
  int32 fluxo_id = 5;
  bool ativo = 6;
  bool disponivel = 7;
  int32 max_atendimentos_simultaneos = 8;
}

message MyAtendenteIdRequest {
  int32 id = 1;
}

// --- Conexões de WhatsApp do tenant ---

message MyWhatsappInstance {
  int32 id = 1;
  string name = 2;
  // Número pareado; vazio enquanto o QR não foi lido.
  string phone_number = 3;
  // Vocabulário de `whatsapp_instance.connection_state`: connected,
  // connecting, disconnected, unknown.
  string connection_state = 4;
  bool active = 5;
  string provider = 6;
  int64 created_at = 7;
  // D3 — quando false, a IA nao responde NENHUMA conversa desta conexao.
  // Aditivo: cliente antigo o le como `false` por omissao, mas nunca o mostra,
  // entao segue no comportamento de hoje.
  bool resposta_bot = 8;
}

// D3 — liga/desliga a resposta automatica da IA para a conexao inteira.
//
// Equivale ao `instances/<pk>/toggle-bot/` da v1. O `tenant_id` vem das claims:
// ninguem cala o bot da conexao de outro tenant mandando o id na mensagem.
message DefinirRespostaBotInstanciaRequest {
  int32 id = 1;
  // Sem default no servidor: "nao mandou" e erro de contrato, nao "desligue".
  bool habilitado = 2;
}

message DefinirRespostaBotInstanciaResponse {
  bool habilitado = 1;
}

// D3 — liga/desliga a IA nesta conversa.
//
// O caminho de volta que faltava: assumir o atendimento desliga o bot, e nada
// devolvia o valor. Uma conversa que passou por um humano ficava sem bot para
// sempre.
message DefinirBotDaConversaRequest {
  int32 atendimento_id = 1;
  bool habilitado = 2;
}

message DefinirBotDaConversaResponse {
  bool habilitado = 1;
}

message MarcarAtendimentoLidoRequest {
  int32 atendimento_id = 1;
}

message MarcarAtendimentoLidoResponse {
  int32 marcadas = 1; // quantas mensagens deixaram de estar não lidas agora
}

message ListMyWhatsappInstancesRequest {}

message ListMyWhatsappInstancesResponse {
  repeated MyWhatsappInstance instancias = 1;
}

message MyWhatsappInstanceIdRequest {
  int32 id = 1;
}

// --- Treinamento da IA ---
//
// O material que o assistente usa para responder. O fluxo tem três estados, e
// a tela precisa dos três: rascunho (criado, texto ainda em revisão),
// finalizado (aceito, na fila do worker) e vetorizado (já responde).

message MyTreinamento {
  int32 id = 1;
  // Assunto e agrupamento — a dupla identifica o treinamento no tenant.
  string tag = 2;
  string grupo = 3;
  string conteudo = 4;
  // Aceito pelo usuário e enviado para vetorização.
  bool finalizado = 5;
  // Já virou vetor: a partir daqui o assistente usa este material.
  bool vetorizado = 6;
  int64 criado_em = 7;
  int64 atualizado_em = 8;
  // B9 (N10 E5) - vazios quando o treinamento e de texto colado.
  string arquivo_nome = 9;
  string extracao_status = 10; // pendente | extraido | falhou | vazio
  string extracao_erro = 11;   // motivo pronto para ler
}

// B9 (N10 E5) - passo 1 do treinamento por arquivo: onde subir.
message SolicitarUploadTreinamentoRequest {
  string nome_arquivo = 1;
  string mimetype = 2;
  int64 bytes = 3;
}

message SolicitarUploadTreinamentoResponse {
  string url_upload = 1;          // credencial temporaria - nunca logar
  string chave = 2;
  string content_type = 3;        // o PUT tem de mandar exatamente este valor
  int64 expira_em_segundos = 4;
}

// B9 (N10 E5) - passo 3: o arquivo subiu; cria o treinamento.
message CreateMyTreinamentoComArquivoRequest {
  string tag = 1;
  string grupo = 2;
  string chave = 3;
  string nome_arquivo = 4;
  string mimetype = 5;
}

message CreateMyTreinamentoRequest {
  string tag = 1;
  string grupo = 2;
  string conteudo = 3;
}

message MyTreinamentoResponse {
  MyTreinamento treinamento = 1;
}

message ListMyTreinamentosRequest {}

message ListMyTreinamentosResponse {
  repeated MyTreinamento treinamentos = 1;
}

message GetMyTreinamentoRequest {
  int32 id = 1;
}

message FinalizarMyTreinamentoRequest {
  int32 id = 1;
  // O texto como ficou depois da revisão — é ele que vira vetor.
  string conteudo = 2;
}

message RemoverMyTreinamentoRequest {
  int32 id = 1;
}

message SimpleOkResponse {
  bool sucesso = 1;
}

message StreamAtendimentosRequest {}

message AtendimentoEvent {
  string event_type = 1;
  string tenant_id = 2;
  string payload = 3;
}




// --- Intencoes (curadoria manual do RAG) ---

message MyIntent {
  int32 id = 1;
  string tag = 2;
  string grupo = 3;
  // Quando esta intencao se aplica. Entra no texto que vira vetor.
  string descricao = 4;
  // Uma pergunta tipica do cliente. Tambem entra no vetor.
  string exemplo = 5;
  // O que a IA passa a fazer quando a intencao casa.
  string comportamento = 6;
  // `false` enquanto o worker nao gerou o vetor. Ate la a intencao existe no
  // cadastro e NAO existe para a IA -- a busca semantica filtra por embedding.
  bool vetorizada = 7;
  int64 criado_em = 8;
  int64 atualizado_em = 9;
}

message ListMyIntentsRequest {}

message ListMyIntentsResponse {
  repeated MyIntent intents = 1;
}

message MyIntentDados {
  string tag = 1;
  string grupo = 2;
  string descricao = 3;
  string exemplo = 4;
  string comportamento = 5;
}

message MyIntentResponse {
  MyIntent intent = 1;
}

message UpdateMyIntentRequest {
  int32 id = 1;
  MyIntentDados dados = 2;
}

message MyIntentIdRequest {
  int32 id = 1;
}

// --- Testar pergunta (ensaio do treinamento) ---

message TestarPerguntaRequest {
  string pergunta = 1;
}

/// Um trecho de material que a IA usou para responder.
message TrechoUsado {
  string conteudo = 1;
  // Distancia de cosseno: quanto MENOR, mais parecido. Aparece na tela porque
  // e o que explica por que um trecho entrou e outro nao.
  double distancia = 2;
}

message TestarPerguntaResponse {
  string resposta = 1;
  // Intencao que casou, se alguma. Vazio = nenhuma dentro do limiar.
  string comportamento_aplicado = 2;
  repeated TrechoUsado trechos = 3;
  double confiabilidade = 4;
  // `true` quando a IA decidiu transferir em vez de responder.
  bool transferiria = 5;
  string fluxo_transferencia = 6;
}

// B9 (N10 E6) - a avaliacao de um ensaio, com a resposta correta. E correcao
// supervisionada: insumo de curadoria, nao um joinha.
message RegistrarFeedbackTesteRequest {
  string pergunta = 1;
  string resposta_obtida = 2;
  string resposta_correta = 3;       // vazio = sem correcao
  string avaliacao = 4;              // "boa" | "ruim"
  string comportamento_aplicado = 5;
  double confiabilidade = 6;
}

message RegistrarFeedbackTesteResponse {
  int32 id = 1;
}

// --- Ficha do atendimento ---

message AtendimentoIdRequest {
  int32 atendimento_id = 1;
}

message Etiqueta {
  int64 id = 1;
  string nome = 2;
  string cor = 3;
  string descricao = 4;
  // Do CATALOGO. Uma etiqueta desativada continua aparecendo nas conversas em
  // que ja estava -- sumir com ela reescreveria o passado.
  bool ativo = 5;
}

message Nota {
  int64 id = 1;
  // Texto livre do operador, interno: o contato nunca ve.
  string texto = 2;
  int64 criado_em = 3;
}

message DetalheAtendimentoResponse {
  // O que existe para escolher.
  repeated Etiqueta catalogo = 1;
  // O que esta colado nesta conversa.
  repeated Etiqueta etiquetas = 2;
  repeated Nota notas = 3;
  // D3 — a IA responde nesta conversa? Assumir o atendimento desliga; so o
  // controle da ficha religa. Sem este campo a tela nao teria como saber em
  // que estado esta o interruptor que ela mesma desenha.
  bool bot_pode_atender = 4;
  // N9 E13 — os campos do cartao aplicaveis a este atendimento, ja com o
  // valor quando ha. Vem juntos com o resto da ficha porque a tela os desenha
  // no mesmo painel: buscar em duas chamadas faria metade da ficha aparecer
  // antes da outra.
  repeated ValorCampoDoAtendimento campos = 5;
}

// Um campo do cartao na ficha de UM atendimento: a definicao mais o valor.
message ValorCampoDoAtendimento {
  int64  campo_id = 1;
  string slug = 2;
  string nome = 3;
  string descricao = 4;
  string tipo = 5;
  repeated OpcaoCampo opcoes = 6;
  bool   obrigatorio = 7;
  // Vazio = nunca preenchido. `"null"` = apagado de proposito, e a IA nao
  // repreenche o que alguem apagou.
  string valor_json = 8;
  // MANUAL | IA — a tela mostra de onde veio, e a confianca quando foi a IA.
  string origem = 9;
  double confianca = 10;
  // TRUE quando uma pessoa escreveu ou apagou: a IA nao sobrescreve.
  bool   editado_por_humano = 11;
}

message CreateEtiquetaRequest {
  string nome = 1;
  string cor = 2;
}

message EtiquetaResponse {
  Etiqueta etiqueta = 1;
}

message AlternarEtiquetaRequest {
  int32 atendimento_id = 1;
  int64 etiqueta_id = 2;
  // `false` tira a etiqueta da conversa.
  bool aplicar = 3;
}

message CreateNotaRequest {
  int32 atendimento_id = 1;
  string texto = 2;
}

message NotaResponse {
  Nota nota = 1;
}
