syntax = "proto3";
package smartcore.contracts.queries;

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
  string tenant_name = 5;
  string tenant_slug = 6;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  // refresh opcional: se presente, revoga a família inteira (logout global).
  string refresh_token = 1;
}

message LogoutResponse {
  bool revoked = 1;
}

// N11 E8 — recuperação de senha. `login` aceita e-mail ou nome de usuário, como
// a tela de login. A resposta é a mesma exista a conta ou não.
message SolicitarRedefinicaoSenhaRequest {
  string login = 1;
}

message SolicitarRedefinicaoSenhaResponse {
  bool aceito = 1;
}

message RedefinirSenhaRequest {
  string token = 1;
  string nova_senha = 2;
}

message RedefinirSenhaResponse {
  bool sucesso = 1;
}

// Fachada de borda gRPC-Web. Login/Refresh e a recuperação de senha são
// públicas; Logout exige access token no metadata `authorization: Bearer <access>`.
service AuthService {
  rpc Login   (LoginRequest)   returns (AuthResponse);
  rpc Refresh (RefreshRequest) returns (AuthResponse);
  rpc Logout  (LogoutRequest)  returns (LogoutResponse);
  rpc SolicitarRedefinicaoSenha (SolicitarRedefinicaoSenhaRequest) returns (SolicitarRedefinicaoSenhaResponse);
  rpc RedefinirSenha (RedefinirSenhaRequest) returns (RedefinirSenhaResponse);
}
