[package]
name    = "observability"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Tracing
tracing.workspace            = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "registry"] }

# OpenTelemetry
opentelemetry       = { version = "0.24", features = ["metrics"] }
opentelemetry_sdk   = { version = "0.24", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp  = { version = "0.17", features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.25"

# Runtime e serialização
tokio.workspace              = true
serde.workspace              = true
serde_json.workspace         = true
chrono.workspace             = true
uuid.workspace               = true

# Infra e contratos para barramento de auditoria
contracts  = { path = "../contracts" }
transport  = { path = "../transport" }
redis      = { workspace = true }

# Dependências opcionais para testes/retrocompatibilidade com banco
infrastructure_postgres = { path = "../infrastructure_postgres", optional = true }
sqlx = { workspace = true, optional = true }

[features]
# Produção NÃO depende de postgres: o build padrão publica auditoria só via Redis Streams,
# eliminando a aresta observability → infrastructure_postgres (quebra o ciclo registrado).
default = []
# Caminho de retrocompatibilidade (testes): grava auditoria direto no banco.
postgres-audit = ["dep:infrastructure_postgres", "dep:sqlx"]

[dev-dependencies]
# Dev-dependency auto-referente: liga `postgres-audit` apenas ao compilar testes/exemplos,
# sem reintroduzir postgres no build de produção da crate.
observability = { path = ".", features = ["postgres-audit"] }
test_support = { path = "../test_support" }
infrastructure_postgres = { path = "../infrastructure_postgres" }
sqlx.workspace               = true
